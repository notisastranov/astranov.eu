name: grokbuild 4412 (full hunt merge + OSM card fields + deterministic notches + Crete cluster; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "f63fd1edfa8c1cbd5df2853f6b5a0ca2f49431fc29a4ae144e6b4fbc1f0e65ac"
          gunzip -c /tmp/f.gz > /tmp/fix4412.patch
          test "$(sha256sum /tmp/fix4412.patch | cut -d' ' -f1)" = "4f30ae68c76c2a4a926ca6ae1247486ebdfc2b96b4542cb57b3edff8c8bc0b31"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412.yml || true
          git rm -f .github/workflows/grokbuild-4411.yml || true
          T0="$(git write-tree)"
          test "$T0" = "9389cc8904a0d643acc0ac05731a9454f26cb119" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412.patch
          grep -q 'var VER = "4412"' sw.js
          grep -q 'sn-shell-4412' sw.js
          test "$(cat VERSION)" = "4412"
          grep -q 'HUNT_CAP' lib/http/find.js
          grep -q '4412: always merge' lib/http/find.js
          grep -q 'photoFromTags' lib/http/find.js
          grep -q '__snNotchPlan' js/spacenet/app.js
          grep -q 'sn-cluster' js/spacenet/app.js
          grep -q 'huntCreteSpan' js/spacenet/app.js
          grep -q 'window.__SN_4412' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "821dff288187af8e45e92c2365747e8a8ea6da46" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412: raise hunt cap+merge Overpass/Nominatim; OSM phone/website/addr/image on cards (no fakes); deterministic notch plan from startZ; Crete-wide count bubbles clear Ηράκλειο. Keep 4411.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
