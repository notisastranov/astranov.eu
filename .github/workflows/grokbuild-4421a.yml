name: grokbuild 4421a (hunt distance filter; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4421a.b64", ".github/workflows/grokbuild-4421a.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4421a
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "b920632c9fe62d6dacdb11c397e75d16ca052960" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4421a.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "19c3af05ce0671a23411434a5a236924d70c86971ae955efc1904095ddb5d167"
          mkdir -p /tmp/f4421a
          tar -xzf /tmp/f.tgz -C /tmp/f4421a
          test "$(wc -c < /tmp/f4421a/js/spacenet/app.js)" = "57260"
          grep -q 'never keep pins outside' /tmp/f4421a/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4421a.yml || true
          T0="$(git write-tree)"
          test "$T0" = "fedc52383c1f7c527d18c08d08f590dfe33a7ae5" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f4421a/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "4f571549862d0fe62c1f51aa630b351f6e379b86" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4421a: client hunt filter — drop pins >80km from view (blocks Photon Spain/Germany leaks).")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
