name: grokbuild 4331 wheel+shops+gps+fee (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4331.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main; decode kit; apply; stamp 4331; unit-test; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "ef3f2856d71b1f257aa6bfaf4733e784459e96ba" || { echo "main moved"; exit 1; }
          git merge origin/main -m "merge main under 4331 preview" -X ours || {
            git checkout --ours js/spacenet/app.js api/find.js || true
            git checkout --theirs index.html vercel.json sw.js VERSION api/version.js || true
            git add -A
            git -c core.editor=true merge --continue || git commit --no-edit || true
          }
          grep -q 'function activeSeat' js/spacenet/app.js
          grep -q 'findOwnRoleTwin' js/spacenet/app.js
          test -f .grokbuild/fix33_client.py.gz.b64
          python3 - <<'PYFIX'
          import gzip, base64, hashlib
          from pathlib import Path
          p = Path(".grokbuild/fix33_client.py.gz.b64")
          s = list(p.read_text().strip())
          # Undo known MCP/XML transcription damage vs golden (4 bytes)
          fixes = {398: "4", 3784: "g", 3785: "m", 3786: "l"}
          for i, ch in fixes.items():
              s[i] = ch
          blob = "".join(s)
          raw = gzip.decompress(base64.b64decode(blob))
          want = "88568ea3ef1c68ec429299c917ccbc5356253fd87166ed07f01d84ba08ef0900"
          got = hashlib.sha256(raw).hexdigest()
          print("fix33 sha", got)
          if got != want:
              raise SystemExit("fix33 sha mismatch after unmangle")
          Path(".grokbuild/fix33_client.py").write_bytes(raw)
          print("ok decoded fix33_client.py")
          PYFIX
          test "$(sha256sum .grokbuild/fix33_client.py | awk '{print $1}')" = "88568ea3ef1c68ec429299c917ccbc5356253fd87166ed07f01d84ba08ef0900"
          python3 .grokbuild/fix33_client.py
          bash .grokbuild/stamp4331.sh
          printf '4331\n' > VERSION
          mkdir -p tests
          cp .grokbuild/globe_math.js tests/globe_math.js
          cp .grokbuild/test_globe_roundtrip.js tests/test_globe_roundtrip.js
          node tests/test_globe_roundtrip.js | tee /tmp/globe-test.out
          grep -q 'fail=0' /tmp/globe-test.out
          ! grep -n 'app\.jsg' index.html
          grep -q 'app.js?v=4331' index.html
          grep -q 'var VER = "4331"' js/spacenet/app.js
          grep -q 'function screenToLatLng' js/spacenet/app.js
          grep -q 'Delivery · set a drop address' js/spacenet/app.js
          grep -q 'aria-label="Apply">APPLY' js/spacenet/app.js
          grep -q 'src = "listed"' js/spacenet/app.js
          grep -q '4331-real' vercel.json
          node --check js/spacenet/app.js
          node --check api/find.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4331.yml || true
          git rm -q -f .github/workflows/grokbuild-4330.yml 2>/dev/null || true
          git add -A
          git status --short | head -40
          git commit -q -m "4331: wheel screen↔latlng + street handoff; shop union; GPS≠sky; fee; APPLY/X (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
