name: grokbuild 4407b (merge main 4405 + fixes; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4407b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix125b as merge commit, assert trees, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin 07d5d08e8854d649708780c86003fc64cfa01ed2
          base64 -d .grokbuild/fix125b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "03441740456cd7df43a5691a4de118fb1c600e177267c39221fa52feb154126d"
          gunzip -c /tmp/f.gz > /tmp/fix125b.patch
          test "$(sha256sum /tmp/fix125b.patch | cut -d' ' -f1)" = "7304dbcde5386d9d8139a99a2b3d49270115760ad4867cc9820031216e7c1d88"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4407.yml .github/workflows/grokbuild-4407b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "415950e92813f3c2e969fd94a4af97b2e589e39a" || { echo "tree0 $T0"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix125b.patch
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          grep -q '^4407$' VERSION
          grep -q '__SN_4407' js/spacenet/app.js
          test -f favicon.ico
          T="$(git write-tree)"
          test "$T" = "c03fadbf66f785951478c1377620c2091cda73be" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 07d5d08e8854d649708780c86003fc64cfa01ed2 -m "merge main 4405 (07d5d08e) + 4407: account panel on identity (guest SIGN IN only; signed-in name/email/avatar + SIGN OUT); wallet is ledger-only (guest 0.00, unavailable never fake); leaders that cross neighbouring pins snap home; always 7 notches to Widest view; root favicon.ico. Branch engine wins. Lockstep 4407")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
