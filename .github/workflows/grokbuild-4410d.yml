name: grokbuild 4410d (hold centre before sheet; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4410d.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4410d
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4410d.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "b13ae1f82bfd90bdf008ca0bdbe5babce9ccb38030b8f1ba0231b03502adf166"
          gunzip -c /tmp/f.gz > /tmp/fix4410d.patch
          test "$(sha256sum /tmp/fix4410d.patch | cut -d' ' -f1)" = "8af7eac7a08f045ec78783ec534be786df6fc0dc17b01a490e5b94c457468dd2"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4410d.yml || true
          git rm -f .github/workflows/grokbuild-4410c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "ff3aac4e803bb0f66d296fd643e72793973bb2c5" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4410d.patch
          grep -q 'freeze the centre BEFORE' js/spacenet/app.js
          grep -q 'window.__SN_4410D' js/spacenet/app.js
          grep -q 'sheet/chrome resize during a hold' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "7020026498c8cfabd4951c4af0a074abcb078974" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4410d: capture map centre before openVendor on hold; restore after sheet RO/invalidateSize so 1280 Siteia holds stay put. Keep 4410c. Lockstep 4410")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
