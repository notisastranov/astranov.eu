name: grokbuild 4383 (YOU always visible for guests, honest location chip; stamps 4383; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4383.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix98, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "040977b92f675b83ea267cfa583e541d41dcaadd" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix98.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "fd5f06ce3085bff02e87b3c1944e17d69c1159bcc4748c169e197ca555ea5d27"
          gunzip -c /tmp/f.gz > /tmp/fix98.patch
          test "$(sha256sum /tmp/fix98.patch | cut -d' ' -f1)" = "828b46dc9a6407f2b459cc9e8668e1f14a04bb1bd4cc11e97a3f43492f349287"
          git rm -rq .grokbuild .github/workflows/grokbuild-4383.yml
          git apply --index /tmp/fix98.patch
          node --check js/spacenet/app.js
          grep -q '^4383$' VERSION
          T="$(git write-tree)"
          test "$T" = "6e7954e3dcb4f446f7cb1c28cdf7e7d4dccbaa2c" || { echo "tree $T"; exit 1; }
          git commit -q -m "4383: guests see YOU (not a bare LOGIN) and a YOU chip that reads a real precise GPS fix or Location not shared · tap to locate, never the IP city; YOU panel gets LOCATE ME (rough network fixes are refused); lockstep 4383"
          git push origin HEAD:grokbuild/4328-street-level-gps
