name: grokbuild 4410 (notch Widest, hold shop, chrome fit, declutter; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4410.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4410
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          echo "main tip $MAIN_TIP"
          base64 -d .grokbuild/fix4410.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "91e385cbf80e7f7acda7eb684fa3751530d78d94da021a197a0e83e247fd5a2b"
          gunzip -c /tmp/f.gz > /tmp/fix4410.patch
          test "$(sha256sum /tmp/fix4410.patch | cut -d' ' -f1)" = "b98458c7da29d478ede9bdf15019466438944f590077400a8bcd0b5d2ea57dda"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4410.yml || true
          git rm -f .github/workflows/grokbuild-4409c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "cb6ce6123a6113d5c3af0c7e0f04e91d3f3c53f9" || { echo "tree0 $T0 want cb6ce6123a6113d5c3af0c7e0f04e91d3f3c53f9"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4410.patch
          grep -q '"4410"' vercel.json
          grep -q '4410-real' vercel.json
          grep -q 'window.__SN_4410' js/spacenet/app.js
          grep -q 'cityWheelResetFloor' js/spacenet/app.js
          grep -q 'Math.round(z) - 3' js/spacenet/app.js
          ! grep -q '"4409"' vercel.json
          T="$(git write-tree)"
          test "$T" = "65c718100cccf3935f6136f28f1b0b880f251bee" || { echo "tree $T want 65c718100cccf3935f6136f28f1b0b880f251bee"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4410: steady 3 notches to Widest then globe (every notch changes view); hold hits face-off/small-town pins for shop card; chrome (power/GPS/…) in fit+declutter; globe news culls wallet/guest; declutter after every zoom; place veil only when pins cover. Keep 4409 remine. Lockstep 4410")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
          git log --oneline -3
