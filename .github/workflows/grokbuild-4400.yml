name: grokbuild 4400 (merge main 4396; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4400.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Carry main files, apply fix117, assert trees, merge commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "3c7cc9102bda5aba9e368646b4d3bc901a6f6001" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          M=b5ed295c9cb0e41cfeb6910955e07f18309fb4cb
          git cat-file -e $M^{commit}
          test "$(sha256sum .grokbuild/fix117.list | cut -d' ' -f1)" = "e9ec73ab6a5474fc08eba4c1a83695e5bd2cc7c436a69cf0d8721152a8c7ef96"
          base64 -d .grokbuild/fix117.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "4ca765451850c92d1d5806e0f1fc28420ee6810b58fbbe3370aeecbe7299de09"
          gunzip -c /tmp/f.gz > /tmp/fix117.patch
          test "$(sha256sum /tmp/fix117.patch | cut -d' ' -f1)" = "da4748662105bfd2ac3f5a198d74c58e1f086ecc5faa880f83af9a26b4f014ab"
          cp .grokbuild/fix117.list /tmp/fix117.list
          git rm -rq .grokbuild .github/workflows/grokbuild-4400.yml
          xargs -a /tmp/fix117.list -d '\n' git checkout $M --
          T0="$(git write-tree)"
          test "$T0" = "c3dc8334037cd145c9720c13c9f6b235a1d45ef7" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix117.patch
          node --check js/spacenet/app.js
          grep -q '^4400$' VERSION
          T="$(git write-tree)"
          test "$T" = "3027807d91c99f0c276fe06f2318ba98bd3c5404" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p $M -m "4400: merge main b5ed295c (4394-4396): path-based solar-system app registry, mic on search, single GPS button with compass clear, headset support kept. Hide blocks and #sn-bar stay out; branch engine wins. Lockstep 4400")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
