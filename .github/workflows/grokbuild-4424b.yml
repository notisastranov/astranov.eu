name: grokbuild 4424b (parcels full-page continue; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4424b.b64", ".github/workflows/grokbuild-4424b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4424b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "34d616e109cba5317c747f03b6708597496ec6e1" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4424b.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "50778ff9ee7773e32a57c45ee2c7576a0ac065955e87c34e7a78f567520c7b0b"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/lib/http/parcels.js)" = "4590"
          test "$(cat /tmp/f/VERSION)" = "4424"
          grep -q 'full PAGE means there may be more' /tmp/f/lib/http/parcels.js
          grep -q 'resultOffset' /tmp/f/lib/http/parcels.js
          grep -q 'Zoom in to see all parcels' /tmp/f/lib/http/parcels.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4424b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "4de071ec5d9c3ec2426c1e58217a74690579095f" || { echo "tree0 $T0"; exit 1; }
          mkdir -p lib/http
          cp /tmp/f/lib/http/parcels.js lib/http/parcels.js
          git add lib/http/parcels.js
          T="$(git write-tree)"
          test "$T" = "e6c23660d8f7c9681947ae1e7a62fc7d7119781c" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4424b: /api/parcels keeps paging on full 500 pages (cadastre omits exceededTransferLimit); truncated+zoom-in at 2000 cap.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
