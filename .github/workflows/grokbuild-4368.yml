name: grokbuild 4368 (no guest YouTube, Overpass 2 tries per hunt; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4368.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix70, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "7aaa1fac8ea40639c1cc702086fe9c6d986addf7" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix70.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "b830eb90d8fbb430b1bdc4bdc9321c68991d174994ab92da6cc0bca6e0339b7a"
          gunzip -c /tmp/f.gz > /tmp/fix70.patch
          test "$(sha256sum /tmp/fix70.patch | cut -d' ' -f1)" = "58c866c4b84e5971c8ed39a19c4f5ead49481cca564321270d2cea6255a86ac9"
          git rm -rq .grokbuild .github/workflows/grokbuild-4368.yml
          git apply --index /tmp/fix70.patch
          node --check js/spacenet/app.js
          grep -q '^4368$' VERSION
          T="$(git write-tree)"
          test "$T" = "7a54aa9dfff65ab4c73545a117fd7006cf70ce10" || { echo "tree $T"; exit 1; }
          git commit -q -m "4368: YouTube APIs only with a live signed-in session and a fresh token (guests make 0 calls; one ask per minute); Overpass: one mirror per call, at most 2 tries per hunt, 5 min rest after a failure (client and per-mirror on the server), pins fallback unchanged; lockstep 4368"
          git push origin HEAD:grokbuild/4328-street-level-gps
