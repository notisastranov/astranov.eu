name: grokbuild 4410b (steady 3 notches + hold no-refit; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4410b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4410b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4410b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "cd7c0673e8a98ee6806c36fa63d6ca207614be408435df685d973c940919b241"
          gunzip -c /tmp/f.gz > /tmp/fix4410b.patch
          test "$(sha256sum /tmp/fix4410b.patch | cut -d' ' -f1)" = "0acc4f1c9b137f4bc7151fb3bbe4d823d7e58605fb574d7d724277cf4525b4fe"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4410b.yml || true
          git rm -f .github/workflows/grokbuild-4410.yml || true
          T0="$(git write-tree)"
          test "$T0" = "65c718100cccf3935f6136f28f1b0b880f251bee" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4410b.patch
          grep -q 'Math.max(3, Math.round(z) - 3)' js/spacenet/app.js
          grep -q 'never refit/pan underneath' js/spacenet/app.js
          grep -q 'window.__SN_4410' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "64c52c342e993f46059f19ccaed781963ad7a1ff" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4410b: closeBelow = z-3 (no clamp-to-8) so every fit has exactly 3 outs to Widest then globe; hold cancels pending fitHunt so the shop card never pans the map. Keep 4410. Lockstep 4410")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
