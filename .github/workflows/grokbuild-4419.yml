name: grokbuild 4419 (merge main 4409 + stamps; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4419.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4419 as merge of main
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "049c2dd36e2479c5f9854f39203e2c7691a48192" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4419.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "49acedc0dd1c669e3c78a0c237a590ca4e4da9710ebe07939dd040988bfb8347"
          gunzip -c /tmp/f.gz > /tmp/fix4419.patch
          test "$(sha256sum /tmp/fix4419.patch | cut -d' ' -f1)" = "09db7c0949457bf212bd691dfefaaa1f22bf335f9c7e8196ecf036416b09bcb0"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4419.yml || true
          T0="$(git write-tree)"
          test "$T0" = "9837f8eb22c7c39cf7c261c337e9b112de5442f0" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4419.patch
          grep -q '__SN_4419' js/spacenet/app.js
          test "$(cat VERSION)" = "4419"
          T="$(git write-tree)"
          test "$T" = "a329b0e5fbccd9928763b576d6c5e8d1525e4580" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4419: merge main 4409 (Rhodes menus.json + pending offer); stamps 4419 incl x-astranov-build/ship headers.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
