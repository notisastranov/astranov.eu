name: grokbuild 4391b (pin label guard ignores leader lines; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4391b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix108, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "d324572e25ec4cfd7d99730a2c640f9c7d21ca5c" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix108.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "33c984b00e5f58205a11c6df0f666300d3cd34b47b64d1f0f4e112a7563ae107"
          gunzip -c /tmp/f.gz > /tmp/fix108.patch
          test "$(sha256sum /tmp/fix108.patch | cut -d' ' -f1)" = "985a53a688df8a8d7c56f1310d1f158516098e66665bd11c0ec046406b07eea3"
          git rm -rq .grokbuild .github/workflows/grokbuild-4391b.yml
          git apply --index /tmp/fix108.patch
          node --check js/spacenet/app.js
          grep -q '^4391$' VERSION
          T="$(git write-tree)"
          test "$T" = "0420cd03ef5e26cd32e3304f4863ce8acfee6ce3" || { echo "tree $T"; exit 1; }
          git commit -q -m "4391: the pin label collision guard ignores leader lines (they hid 10 labels); faces, numbers and shown labels still count. Lockstep 4391"
          git push origin HEAD:grokbuild/4328-street-level-gps
