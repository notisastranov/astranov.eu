name: grokbuild 4402 (fixes; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4402.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix120, assert trees, merge commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "3db123e7519720de758515cc2a7737c9842985c4" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix120.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "07fd26c1ff617710356931ad33fa57981e677f2aeb15a32de16d2015a3f7d7d7"
          gunzip -c /tmp/f.gz > /tmp/fix120.patch
          test "$(sha256sum /tmp/fix120.patch | cut -d' ' -f1)" = "99653d3b8c1c683b65446727a15870e76a280fad17fdfcfc6eb0ef56c959df50"
          git rm -rq .grokbuild .github/workflows/grokbuild-4402.yml
          T0="$(git write-tree)"
          test "$T0" = "b9e17c01c366c4f1afbb50b7bc1d250b601a0502" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix120.patch
          node --check js/spacenet/app.js
          grep -q '^4402$' VERSION
          T="$(git write-tree)"
          test "$T" = "0b136a87390bc5c2c3d759c3b13db64c22126440" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4402: crew runs (seekHold/markTier), role buttons on every login card and SIGN IN opens it, honest mic (getUserMedia + start in the tap). Lockstep 4402")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
