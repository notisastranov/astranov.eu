name: grokbuild 4385 (no IP or coarse anchor, bare place names fly globally, favicon links; stamps 4385; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4385.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix100, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "da576e51ceac1c347758f43856d16476ab63a91e" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix100.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "3fca642e5d8bc708aa6bb7dd15738660e3bd0836201e9b1440bd011db5404191"
          gunzip -c /tmp/f.gz > /tmp/fix100.patch
          test "$(sha256sum /tmp/fix100.patch | cut -d' ' -f1)" = "2d1ced999f132bd49531e5e56c0ff13b4f0e3d6981dd0dac272ed31a95e791a4"
          git rm -rq .grokbuild .github/workflows/grokbuild-4385.yml
          git apply --index /tmp/fix100.patch
          node --check js/spacenet/app.js
          grep -q '^4385$' VERSION
          T="$(git write-tree)"
          test "$T" = "bf9b893e8b26e369d1e1186ce9c622aae34cbaf8" || { echo "tree $T"; exit 1; }
          git commit -q -m "4385: a browser network position (coarse, e.g. Ashburn VA from a cloud box) is not a fix anywhere (locate, land, late GPS); IP or coarse points never become here, a hunt anchor, a camera target or a reply; a bare place name (Heraklion, Nairobi) geocodes globally and flies there before the helper; favicon and apple-touch links to existing icons; lockstep 4385"
          git push origin HEAD:grokbuild/4328-street-level-gps
