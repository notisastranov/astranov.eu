name: grokbuild 4384 (merge main 95fe013d V4378; helper keeps its route over card fields, boot scan zooms to a real fix only, honest order bar, geocode memo; stamps 4384; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4384.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix99, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "9ead085fc9be7bac95b6b9d1be83b33b805048fa" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 95fe013d0c79bb1b5b8d11cff204da2a8a1b806a^{commit}
          base64 -d .grokbuild/fix99.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "e970fda8cba5e40ae26091eb8d2c00b87080f0c7436f6b96e974adbe2734777a"
          gunzip -c /tmp/f.gz > /tmp/fix99.patch
          test "$(sha256sum /tmp/fix99.patch | cut -d' ' -f1)" = "f7eb738862117ca2b9a2e2edc2e3ab9e8a6bb2317dbe8542b02f5c10f1bef2b1"
          git rm -rq .grokbuild .github/workflows/grokbuild-4384.yml
          git apply --index /tmp/fix99.patch
          node --check js/spacenet/app.js
          grep -q '^4384$' VERSION
          T="$(git write-tree)"
          test "$T" = "b1bd3419779a186fb0e904a1992aaca9e456b60c" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 95fe013d0c79bb1b5b8d11cff204da2a8a1b806a -m "Merge main (95fe013d: V4378 stamp bump and the Command the HUD placeholder) into the branch engine; took the placeholder, kept everything else of the branch. Helper commands typed or Entered into a shop card field go to the helper (card fields own keys only after a real tap); the opening Earth scan zooms only to a precise GPS fix or a stored precise fix under 30 min, else an honest Location not shared line, never IP; the pending / on the way / cancelled bar counts only real orders, is titled YOUR ORDERS and hides at zero; named places resolve once per device per week (faster hunts). Lockstep 4384")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
