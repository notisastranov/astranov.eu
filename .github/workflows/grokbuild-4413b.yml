name: grokbuild 4413b (bind burger click from bindChrome; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4413b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4413b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4413b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "11cd8c8f4b81a4dd776e4adf9a5163c6a08c558b33e38bf380ee201e65915a3d"
          gunzip -c /tmp/f.gz > /tmp/fix4413b.patch
          test "$(sha256sum /tmp/fix4413b.patch | cut -d' ' -f1)" = "dd9d1e5f0981b57b8ef32346a029717acdcaef3c6a3d61a002edbed3286e1789"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4413b.yml || true
          git rm -f .github/workflows/grokbuild-4413.yml || true
          T0="$(git write-tree)"
          test "$T0" = "57555f0cc6250736633e74bfe27a679271c8f5d3" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4413b.patch
          grep -q 'try { bindBurger(); }' js/spacenet/app.js
          grep -q '__SN_4413B' js/spacenet/app.js
          grep -q 'var VER = "4413"' sw.js
          test "$(cat VERSION)" = "4413"
          T="$(git write-tree)"
          test "$T" = "894c8c05ce6f041c1a057516f9550abdb4c52d4f" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4413b: bind #sn-burger click from bindChrome. Keep 4413.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
