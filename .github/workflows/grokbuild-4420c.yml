name: grokbuild 4420c (tall form no h-overflow; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4420c.b64", ".github/workflows/grokbuild-4420c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4420c as merge of main
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "7a66a1e5533f2eb0027fcaa559425a0ca6672e0b" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4420c.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "ee6b1628690a36b01f1116da1f62968ecbff782e990e330a21bdb499db4c2067"
          gunzip -c /tmp/f.gz > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | cut -d' ' -f1)" = "b0784186aaa67f59c7598e6102449718638d2c2b9bf3c21a295190a89f04c501"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4420c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "b016d914e84dca9d5181bad4ce116a09150ece88" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix.patch
          grep -q '4420c' js/spacenet/app.js
          grep -q 'fitFormSheet' js/spacenet/app.js
          test "$(cat VERSION)" = "4420"
          T="$(git write-tree)"
          test "$T" = "150623d702f2144c9240828f3dbd29ff81a76ad4" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4420c: tall VENDOR/CLIENT/DRIVER forms — no horizontal overflow on narrow; fields stay above START.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
