name: grokbuild 4412d (force-keep Menir/Sitia + trade-hunt purity + Heraklion cluster; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412d.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412d
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412d.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "fed977ef946bc2436f27fb2b1e892f2caed28aa53afab0480cba79ea6cbd2f25"
          gunzip -c /tmp/f.gz > /tmp/fix4412d.patch
          test "$(sha256sum /tmp/fix4412d.patch | cut -d' ' -f1)" = "af3fa28e6a58df186f444547ae80498ef4e2a4bfd2427814187f0e8e86ad9ce6"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412d.yml || true
          git rm -f .github/workflows/grokbuild-4412c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "8bc5ff30a8a7b63acbebc0d1f82d167883102e9d" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412d.patch
          grep -q '4412d' lib/http/find.js
          grep -q 'islandPri' lib/http/find.js
          grep -q 'pullPriority' lib/http/find.js
          grep -q 'grp.length < 3' js/spacenet/app.js
          grep -q 'var VER = "4412"' sw.js
          test "$(cat VERSION)" = "4412"
          grep -q 'window.__SN_4412' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "6cfd15772661e756d4e9c726fda9ef32e2fd9ec5" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412d: force-keep Menir/Sitia through HUNT_CAP; Heraklion island priority; drop Photon place junk on trade hunts; earlier Heraklion count bubbles. Keep 4412c.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
