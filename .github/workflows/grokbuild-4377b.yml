name: grokbuild 4377b (service worker passes robot images; only scripts are overlays; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4377b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix85, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "9510f12944d1993acf82125dadfe56bdc8d89197" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix85.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "a772e6757ba93c77e581e844bdef1454e042066e5cf985a8fab1d575ebdb67d3"
          gunzip -c /tmp/f.gz > /tmp/fix85.patch
          test "$(sha256sum /tmp/fix85.patch | cut -d' ' -f1)" = "921710abc2ef1e67cf35e997d7c64a03e0e3b1de73bba811fcd31bcf5e667df1"
          git rm -rq .grokbuild .github/workflows/grokbuild-4377b.yml
          git apply --index /tmp/fix85.patch
          node --check js/spacenet/app.js
          grep -q '^4377$' VERSION
          T="$(git write-tree)"
          test "$T" = "c0bd53d7a26ea5ab8c51744f8d685ab413610d03" || { echo "tree $T"; exit 1; }
          git commit -q -m "4377b: the service worker treats only .js under /js/spacenet/ as an overlay, so the robot pin / YOU images (robots/*.jpg) load instead of a 37-byte script stub; stamps stay 4377"
          git push origin HEAD:grokbuild/4328-street-level-gps
