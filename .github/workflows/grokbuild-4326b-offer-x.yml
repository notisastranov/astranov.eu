name: grokbuild 4326b offer-x persist (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".github/workflows/grokbuild-4326b-offer-x.yml", ".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Patch offer X dismiss across Power cycle; clean kit debris; keep stamp 4326
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "a00fe522b1d4765f855bc96353d374a74aaf6d73" || { echo "main moved past 4325; remine before restamping"; exit 1; }
          python3 .github/workflows/_patch_offer_x_4326b.py
          node --check js/spacenet/app.js
          if [ -d .grokbuild ]; then git rm -q -r .grokbuild || rm -rf .grokbuild; fi
          git rm -q --ignore-unmatch .github/workflows/grokbuild-4326b-offer-x.yml .github/workflows/_patch_offer_x_4326b.py || true
          git add -A
          git status --short | head -40
          git commit -q -m "4326b: offer X mutes all open offer tabs + current jobs across Power cycle (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
