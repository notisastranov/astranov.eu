name: grokbuild 4314h apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix14.py
          sha256sum -c .grokbuild/4314h.sha256
          node --check js/spacenet/app.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4314h.yml
          git add -A
          git commit -q -m "4314: IP fix labelled Approx. location (IP), never GPS; boot lines never overwrite a talk reply; greetings stay talk; bare near-me searches around YOU and repeats the last category, never the last city (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
