name: grokbuild 4417b (drive revert + GPS; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4417.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4417
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "8ab5ddea9cd644af8ad7cdbb2c5ed20084bb2868" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4417.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "2f8477879cd869e5b1151dd1989bbd7fba3adc2f7cbd780313d7be799e0aae3b"
          gunzip -c /tmp/f.gz > /tmp/fix4417.patch
          test "$(sha256sum /tmp/fix4417.patch | cut -d' ' -f1)" = "864d5bc93e7acadb42a3268908ac2c57e4ae1d99b1eaf5276352434028d9549d"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4417.yml || true
          T0="$(git write-tree)"
          test "$T0" = "cf25ee913ad1c09e9e83d431d42a6154666c3f5f" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4417.patch
          grep -q 'gateDown' js/spacenet/app.js
          grep -q 'function gpsFlyTo' js/spacenet/app.js
          grep -q '__SN_4417' js/spacenet/app.js
          test "$(cat VERSION)" = "4417"
          T="$(git write-tree)"
          test "$T" = "df2b044e3a64732d7c67c47529617f4463d42a51" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4417b: GPS drive revert uses raw speed for 20s drone clock; keep hunt+tiered GPS.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
