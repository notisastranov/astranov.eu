name: grokbuild 4417 (hunt pin + GPS fly/drive; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4417.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4417
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "8ab5ddea9cd644af8ad7cdbb2c5ed20084bb2868" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4417.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "d7c5d28b60f0327cb8206159d973fbf889ce5ef3c2db46d48b084a0ea56f48a9"
          gunzip -c /tmp/f.gz > /tmp/fix4417.patch
          test "$(sha256sum /tmp/fix4417.patch | cut -d' ' -f1)" = "d63de49f2f4ce6e24c5c6fabf3f6764e1e84f8545b7e0221113c0c5ab72d7147"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4417.yml || true
          git rm -f .github/workflows/grokbuild-4415.yml || true
          T0="$(git write-tree)"
          test "$T0" = "bca7da53cf2239f90dd308724c535777523286ed" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4417.patch
          grep -q '__SN_4417' js/spacenet/app.js
          grep -q '4417: never km-trim' js/spacenet/app.js
          grep -q 'thin / partial memo' js/spacenet/app.js
          grep -q 'function gpsFlyTo' js/spacenet/app.js
          grep -q 'startGpsWatch' js/spacenet/app.js
          grep -q '4417: clear GPS button' js/spacenet/app.js
          grep -q 'var VER = "4417"' sw.js
          test "$(cat VERSION)" = "4417"
          grep -q 'Astranov.Eu SpaceNet V4417' index.html
          T="$(git write-tree)"
          test "$T" = "cf25ee913ad1c09e9e83d431d42a6154666c3f5f" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4417: hunt pin stability + clear GPS (tiered solar→global→national→city fly; watchPosition speed>3km/h street drive); lockstep 4417.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
