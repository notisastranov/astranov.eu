name: grokbuild 4417c (GPS tier always + drone clock; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4417.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4417
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "8ab5ddea9cd644af8ad7cdbb2c5ed20084bb2868" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4417.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "7c6a00ee2107cbfacba8403b5a8ffed35f6aabdc314b50ed66a8264fa7437916"
          gunzip -c /tmp/f.gz > /tmp/fix4417.patch
          test "$(sha256sum /tmp/fix4417.patch | cut -d' ' -f1)" = "cb4a223a4145f3a140a7c144d38f394647f2d4ee6788ddaeb8b216424adaa6a5"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4417.yml || true
          T0="$(git write-tree)"
          test "$T0" = "df2b044e3a64732d7c67c47529617f4463d42a51" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4417.patch
          grep -q 'always flies one tier' js/spacenet/app.js
          grep -q 'raw/computed kmh' js/spacenet/app.js
          grep -q '__SN_4417' js/spacenet/app.js
          test "$(cat VERSION)" = "4417"
          T="$(git write-tree)"
          test "$T" = "55ac1e1ea8648d13d006d87485cee0c4b8a03304" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4417c: GPS button always tier-flies; drone 20s clock arms on raw kmh<=3.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
