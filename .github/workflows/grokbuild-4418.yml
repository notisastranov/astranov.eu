name: grokbuild 4418 (GPS harden + bottom drawer + no auto PROFILE; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4418.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4418
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "8ab5ddea9cd644af8ad7cdbb2c5ed20084bb2868" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4418.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "e3d9c2a990f362ceee248e1d34736012ca0c62059d599d3549605122dbab0986"
          gunzip -c /tmp/f.gz > /tmp/fix4418.patch
          test "$(sha256sum /tmp/fix4418.patch | cut -d' ' -f1)" = "65cdd312338ba1592eda369fbd697430168088af4a6a6b842ac512766aca6647"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4418.yml || true
          T0="$(git write-tree)"
          test "$T0" = "55ac1e1ea8648d13d006d87485cee0c4b8a03304" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4418.patch
          grep -q '__SN_4418' js/spacenet/app.js
          grep -q 'sn-drawer' index.html
          grep -q 'always-visible bottom drawer' js/spacenet/app.js
          grep -q 'never auto-open PROFILE' js/spacenet/app.js
          test "$(cat VERSION)" = "4418"
          T="$(git write-tree)"
          test "$T" = "9837f8eb22c7c39cf7c261c337e9b112de5442f0" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4418: GPS harden + always-visible START drawer; no auto PROFILE on boot.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
