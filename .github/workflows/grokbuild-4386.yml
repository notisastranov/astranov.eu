name: grokbuild 4386 (merge main f3bf7ca1 V4379; room on the apex ported, spacenet keeps globe, helper, field, stamp, YOU; faster place geocode; stamps 4386; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4386.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix102, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "a545a6b6f557da318dc4de2891c3b50a4d0c3a51" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e f3bf7ca1fe58d4b5db7880f23fbc2ef366dcfdc3^{commit}
          base64 -d .grokbuild/fix102.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "7a3228fe81ac06e2db1669715bcab988a8108377213a27b46570c58e194ae089"
          gunzip -c /tmp/f.gz > /tmp/fix102.patch
          test "$(sha256sum /tmp/fix102.patch | cut -d' ' -f1)" = "d3ec1f9655be4c623c45e5e96a2b25bed8211698c9c30c9aadfadb14b48f7f14"
          git rm -rq .grokbuild .github/workflows/grokbuild-4386.yml
          git apply --index /tmp/fix102.patch
          node --check js/spacenet/app.js
          grep -q '^4386$' VERSION
          T="$(git write-tree)"
          test "$T" = "2411bf1c96a4a187d003a9f3f5349b6d68f95883" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p f3bf7ca1fe58d4b5db7880f23fbc2ef366dcfdc3 -m "Merge main (90653c32 + f3bf7ca1: V4379 starry room on the apex, room mode in /api/ai, SpaceNet as a bare delivery map) into the branch engine. Took room/index.html, the apex and www rewrites to the room, the /api/ai room mode and MASTER_PROMPT. Skipped the SpaceNet hide-all CSS (top, island, ribbon, helper, radar, dock form, YOU, cloud, tester), the auto flat map from sn:here (Wheaton IL from IP) or Rhodes, the owner tap-shop-then-street delivery play (it replaces the shop card for admins) and constellations off. SpaceNet starts on the globe with the helper, field, stamp and YOU; fixtures stay hidden; every asset query is 4386. A clear settlement answer from Nominatim lands at once. Lockstep 4386")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
