name: grokbuild 4410e (setView reset after invalidateSize; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4410e.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4410e
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4410e.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "95d397d820af773c6b1aae19eca814d8a51a245568c5a7b2414bfb4eee39df93"
          gunzip -c /tmp/f.gz > /tmp/fix4410e.patch
          test "$(sha256sum /tmp/fix4410e.patch | cut -d' ' -f1)" = "c0253e8595406b51ebf82eaa36e15428d4dac6543b87f7f408dc516bd38ea138"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4410e.yml || true
          git rm -f .github/workflows/grokbuild-4410d.yml || true
          T0="$(git write-tree)"
          test "$T0" = "7020026498c8cfabd4951c4af0a074abcb078974" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4410e.patch
          grep -q '4410e: during a hold keep' js/spacenet/app.js
          grep -q 'window.__SN_4410E' js/spacenet/app.js
          grep -q 'reset: true' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "5aa99d594d340208e766c418b08179496a912ebf" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4410e: setView({reset:true}) after invalidateSize so 1280 hold centre actually restores (plain setView is a no-op). Keep 4410d. Lockstep 4410")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
