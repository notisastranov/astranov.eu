name: grokbuild 4427 (queue Prefer minimal; hold LIST; wheel/reborn; HUD/burger/menu; root→index; lockstep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4427.b64", ".github/workflows/grokbuild-4427.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4427
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4427.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "9478285424bd71e1a1c8843ab8e7ef578b6888702fc6d7577ed3f193d8370a3d"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "257039"
          test "$(wc -c < /tmp/f/index.html)" = "38555"
          test "$(cat /tmp/f/VERSION)" = "4427"
          grep -q 'id="g"' /tmp/f/index.html
          grep -q 'id="menu"' /tmp/f/index.html
          grep -q '__SN_4427' /tmp/f/js/spacenet/app.js
          grep -q '__SN_EARTH = true' /tmp/f/js/spacenet/app.js
          grep -q 'HOLD_MS = 1500' /tmp/f/js/spacenet/app.js
          grep -q 'list-vendor' /tmp/f/js/spacenet/app.js
          grep -q 'wheelAcc' /tmp/f/js/spacenet/app.js
          grep -q 'placeLeftCluster' /tmp/f/js/spacenet/app.js
          grep -q 'return=minimal' /tmp/f/lib/http/queue.js
          grep -q '4427-preview' /tmp/f/vercel.json
          ! grep -q '/room/index.html' /tmp/f/vercel.json
          grep -q 'sn-4427-chrome' /tmp/f/index.html
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4427.yml || true
          T0="$(git write-tree)"
          test "$T0" = "1ea3df209974bd3a42eeb1e969e5b53ba64367b2" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet lib/http
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js lib/http/queue.js; do
            cp "/tmp/f/$f" "$f"
            git add "$f"
          done
          T="$(git write-tree)"
          test "$T" = "b00eb02b2e2f4e44da64a39b1e09f54ac9d711c9" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4427: /api/queue Prefer return=minimal (RLS after lock_open_order_and_admin_reads); hold LIST VENDOR/CLIENT/DRIVER HOLD_MS 1500; wheel coalesce + __SN_EARTH so reborn skips busy pages; HUD under ribbon + island pointer-events; burger+menu PROFILE/wallet; astranov.eu/www → /index.html (undo 4425 /room); single V stamp; lockstep 4427.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
