name: grokbuild 4430 (real-wheel aim validate + SW wipe + tiles + HUD placeholder; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4430.b64", ".github/workflows/grokbuild-4430.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4430
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4430.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "b65fa3a3de769dea33ba91e9034611b9a9ec18771ea9574395e8853eff58730d"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "272318"
          grep -q 'hitOk' /tmp/f/js/spacenet/app.js
          grep -q '__SN_4430' /tmp/f/js/spacenet/app.js
          grep -q 'Name a place or shop' /tmp/f/index.html
          ! grep -q 'Command the HUD' /tmp/f/index.html
          grep -q 'sn-shell-4430' /tmp/f/sw.js
          grep -q '4430-preview' /tmp/f/vercel.json
          grep -q 'sn-4430-list' /tmp/f/index.html
          test "$(cat /tmp/f/VERSION)" = "4430"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4430.yml || true
          T0="$(git write-tree)"
          test "$T0" = "a537b930385dcc2ed37bc8c43677ea132d9fcf35" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          git add index.html sw.js vercel.json VERSION js/spacenet/app.js js/spacenet/auth.js
          T="$(git write-tree)"
          test "$T" = "8cca76f933a2fd923dbbd2836f28cce7b8148293" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4430: validate globeHit vs cam look-at (no Barents); 1-notch wheel coalesce; SW wipe+register; tile fallbacks; kill Command-the-HUD placeholder; DRIVER visible; lockstep 4430.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
