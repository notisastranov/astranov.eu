name: grokbuild 4346 a double click never zooms out (map centres + one step in, globe >= z10), readout + ring on the centre, tests (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4346.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit49; apply fix49 + stamp 4346; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved past 785011f6: merge it first (rebuild the kit)"; exit 1; }
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor 84e24c960251d760827960d3e12af931739d3902 HEAD
          git log --oneline -3
          grep -q 'var VER = "4345"' js/spacenet/app.js
          test -f .grokbuild/kit49.p00.b64
          test -f .grokbuild/kit49.p03.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit49.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "27506fd83dc4164e12bdc04c67234b9aa0c3ab93c7e9129a442f1c789030f545": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "56492754604346aea2b4d9068ad1d12566010a57b328c657d4669ae03cad812c": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYKIT
          git apply --check .grokbuild/k/fix49.patch
          git apply .grokbuild/k/fix49.patch
          python3 .grokbuild/k/stamp4346.py
          grep -q 'app.js?v=4346' index.html
          grep -q 'auth.js?v=4346' index.html
          grep -q 'leaflet.js?v=4346' index.html
          grep -q 'name="astranov-build" content="4346"' index.html
          grep -q 'id="ver">V4346' index.html
          grep -q 'var VER = "4346"' js/spacenet/app.js
          test "$(grep -c '__SN_4346 = true' js/spacenet/app.js)" = "2"
          grep -q 'location.href = "/?v=4346&' js/spacenet/app.js
          grep -q 'var VER = "4346"' sw.js
          grep -q 'sn-shell-4346' sw.js
          grep -q 'TREE LOCK 4346' sw.js
          grep -q 'SpaceNet SW 4346' sw.js
          grep -q '4346-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4346"' vercel.json
          grep -qx '4346' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4346"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          grep -qF -- 'function drawSiteLabels(list)' js/spacenet/app.js
          grep -qF -- 'drawSiteLabels(sitesDrawn)' js/spacenet/app.js
          grep -qF -- 'function dotAt(sx, sy)' js/spacenet/app.js
          grep -qF -- 'aim = snap ? { lat: snap.lat, lng: snap.lng }' js/spacenet/app.js
          grep -qF -- 'n: "ISTANBUL"' js/spacenet/app.js
          grep -qF -- 'window.__snLastDbl' js/spacenet/app.js
          grep -qF -- 'function mapH()' js/spacenet/app.js
          grep -qF -- 'Math.floor(mapH() * 0.42) - below() - ABOVE' js/spacenet/app.js
          grep -qF -- 'Math.round(area() * 0.28)' js/spacenet/app.js
          grep -qF -- 'function wxFor(el, p)' js/spacenet/app.js
          grep -qF -- 'localStorage.getItem("sn:wx")' js/spacenet/app.js
          grep -qF -- 'WX_SETTLE = 8000' js/spacenet/app.js
          grep -qF -- 'if (s.last && now - s.last < WX_TTL) return;' js/spacenet/app.js
          grep -qF -- 'if (seatKind !== "gps" && now - wxSeen.t < WX_SETTLE) return;' js/spacenet/app.js
          test "$(grep -c 'api.open-meteo.com' js/spacenet/app.js)" = "1"
          grep -qF -- 'var WX = { c: {}, back: 0, n: 0 };' api/ai.js
          grep -qF -- "'https://api.open-meteo.com/v1/forecast?latitude=' + rl + '&longitude=' + rg +" api/ai.js
          test "$(grep -c 'api.open-meteo.com' api/ai.js)" = "1"
          grep -qF -- 's2.back = Date.now()' js/spacenet/app.js
          grep -qF -- 'function briefAt' js/spacenet/app.js
          grep -qF -- 'function area()' js/spacenet/app.js
          grep -qF -- 'vendors on SpaceNet' js/spacenet/app.js
          grep -qF -- 'amenity|shop|healthcare' js/spacenet/app.js
          grep -qF -- 'listing needs LOGIN' js/spacenet/app.js
          grep -qF -- 'function gpsArrived' js/spacenet/app.js
          grep -qF -- '"source": "/VERSION"' vercel.json
          grep -qF -- '{"key": "Content-Type", "value": "text/plain; charset=utf-8"}' vercel.json
          grep -qF -- 'HEADED 4346 ALL PASS' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-crete' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-crete-guest' tests/headed_boot_gps_keys.js
          grep -qF -- 'dbl46-guest-crete-after' tests/headed_boot_gps_keys.js
          grep -qF -- 'for (const Z of [8, 10, 13])' tests/headed_boot_gps_keys.js
          grep -qF -- 'function mapDbl(lat, lng)' js/spacenet/app.js
          grep -qF -- 'map.on("dblclick", function (ev) {' js/spacenet/app.js
          grep -qF -- 'doubleClickZoom: false' js/spacenet/app.js
          grep -qF -- 'var nz = z0 < 10 ? 10 : Math.min(maxZ, z0 + 1);' js/spacenet/app.js
          grep -qF -- 'dz = Math.max(dz, Math.ceil(zEqG * 2) / 2);' js/spacenet/app.js
          grep -qF -- 'function ringAt(lat, lng)' js/spacenet/app.js
          grep -qF -- 'globeZoomEq: function ()' js/spacenet/app.js
          if grep -qF -- 'if (t - lastTap < 320) closeCity();' js/spacenet/app.js; then echo 'map double tap still closes the map'; exit 1; fi
          grep -qF -- 'Network.requestWillBeSent' tests/headed_boot_gps_keys.js
          grep -qF -- 'Network.requestWillBeSent' tests/pw_hunt_replace.js
          grep -qF -- 'Athens point on the map container centre within 1.5 px' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-athens-label' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-istanbul-dot' tests/headed_boot_gps_keys.js
          grep -qF -- 'D.realPx <= 20' tests/headed_boot_gps_keys.js
          grep -qF -- 'weather: a reload in the same tab' tests/headed_boot_gps_keys.js
          grep -qF -- 'STAMP || "4346"' tests/headed_wheel_xdotool.js
          grep -qF -- 'process.env.STAMP || "4346"' tests/pw_hunt_replace.js
          if grep -qE 'v=4345|"4345"|sn-shell-4345|4345-real|V4345|__SN_4345|TREE LOCK 4345|SW 4345' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4345 stamp'; exit 1; fi
          if grep -qx '4345' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check api/ai.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          node --check tests/headed_boot_gps_keys.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4346.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4346.yml
          git add -u
          git add VERSION index.html vercel.json sw.js api/ai.js js/spacenet/app.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js
          git status --short | head -40
          git commit -q -m "4346: a double click never zooms out: on the map it centres on the clicked point and zooms in one step (z10 when below; Leaflet's own double-click zoom off, and the double tap no longer closes the map to the zoomed-out globe), on the globe it centres on the point at >= max(the globe's zoom equivalent, z10); the readout names the new centre and a ring marks the clicked point; map min zoom 8; headed tests: open spots in west Crete and inland Anatolia on the close globe and at z8 / z10 / z13, plus the guest's wheel-into-Crete case (preview, do not merge)"
          # let the deploys of the kit commits finish first, so the preview alias ends on this commit
          sleep 75
          git push origin HEAD:grokbuild/4328-street-level-gps
