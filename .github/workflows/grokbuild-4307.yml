name: grokbuild 4307 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Replay feature diff, restamp, verify sha256, drop the kit, commit
        run: |
          set -e
          git fetch -q origin grokbuild/4306-talk-city-pins
          git diff 97980c19af5c4a58b8bb4acd42efd6c0c90a517c e3ffd5bdab49d576eab652bb45d1dcfb583efba2 -- js/spacenet/app.js api/ai.js api/find.js supabase/ > /tmp/feature.patch
          git apply --3way /tmp/feature.patch
          bash .grokbuild/stamp.sh 4307
          sha256sum -c .grokbuild/4307.sha256
          for f in js/spacenet/app.js api/find.js api/ai.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4307.yml
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git add -A
          git commit -q -m "4307: Talk pins named cities without GPS + Overpass fallback + stamp align (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
