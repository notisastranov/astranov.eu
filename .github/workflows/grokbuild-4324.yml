name: grokbuild 4324 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Merge main 4323 ribbon, resolve, moveDriver, restamp 4324, verify, drop kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "e2cd5928de099396e620b700a3957fd16406e77f" || { echo "main moved past 4323 ribbon; remine before restamping"; exit 1; }
          git merge -q --no-edit "$MAIN" || true
          python3 .grokbuild/resolve.py
          python3 .grokbuild/fix19.py
          bash .grokbuild/stamp2.sh 4324
          python3 .grokbuild/verify.py
          for f in js/spacenet/app.js api/find.js api/ai.js api/space.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4324.yml
          git add -A
          git commit -q -m "4324: merge main 4323 ribbon; keep talk-city + tester/order honesty; offer X; HERE Apply never creates orders; driver YOU + moveDriver; orphan dismiss; LIVE real counts; stamp lockstep (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
