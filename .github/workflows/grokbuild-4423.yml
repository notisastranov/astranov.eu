name: grokbuild 4423 (flush ribbon; preview auth return; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4423.b64", ".github/workflows/grokbuild-4423.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4423
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f9466e672eb59d311befd8578f88f1a6fe73cbb6" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4423.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "c60f5fbbf0e213578eb9e1c0b81252b2234e3399f6a171d09a8587ea42cda1a7"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "59250"
          test "$(wc -c < /tmp/f/js/spacenet/auth.js)" = "22841"
          test "$(cat /tmp/f/VERSION)" = "4423"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4423.yml || true
          T0="$(git write-tree)"
          test "$T0" = "2cff731dbb7b73fe4fb0d081ef0abb116780dd03" || { echo "tree0 $T0"; exit 1; }
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js; do cp "/tmp/f/$f" "$f"; git add "$f"; done
          T="$(git write-tree)"
          test "$T" = "7cdff068cbd30d5922c61e6b2ca7f4956623e7af" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4423: flush full-width ribbon (ASTRANOV + SpaceNet V4423); preview sign-in returns to its own origin; lockstep.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
