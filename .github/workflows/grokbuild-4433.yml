name: grokbuild 4433 (atomic tile handoff; no black/grey; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4433.b64", ".github/workflows/grokbuild-4433.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4433
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4433.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "3d9a8542d74d42ff45004a8729905b0cf9ab74bc782a4dc02aeac11707a095b9"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "295123"
          grep -q '__SN_4433' /tmp/f/js/spacenet/app.js
          grep -q 'never black' /tmp/f/js/spacenet/app.js
          grep -q 'waitCityTiles' /tmp/f/js/spacenet/app.js
          grep -q 'filter:none' /tmp/f/index.html
          grep -q 'sn-shell-4433' /tmp/f/sw.js
          grep -q 'content="4433"' /tmp/f/index.html
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4433.yml || true
          T0="$(git write-tree)"
          test "$T0" = "6e03fd41ef6f0a147fde278d12436abab04d4c55" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "f6bd9bc499ba2a840005758ffbe9765a2c970414" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4433: atomic city handoff (globe stays painted until labelled OSM tiles ready; no CSS filter; no wheel=globe/city limbo); lockstep 4433.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
