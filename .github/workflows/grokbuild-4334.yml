name: grokbuild 4334 gps-only-hunts+abort+test-filter+who+architect (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4334.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main; decode kit; apply; stamp 4334; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "b2b228dd8755f6f0a6b1b006313b4bca13292c84" || { echo "main moved"; exit 1; }
          git merge origin/main -m "merge main (V4329 Architect A) under 4334 preview" -X ours || {
            git checkout --ours js/spacenet/app.js api/find.js || true
            git checkout --theirs index.html vercel.json sw.js VERSION api/version.js || true
            git add -A
            git -c core.editor=true merge --continue || git commit --no-edit || true
          }
          grep -q 'sn-architect' index.html
          grep -q 'sn-architect' js/spacenet/app.js
          grep -q 'function activeSeat' js/spacenet/app.js
          grep -q 'findOwnRoleTwin' js/spacenet/app.js
          test -f .grokbuild/fix36.p00.hex
          test -f .grokbuild/stamp.p00.hex
          python3 - <<'PYHEX'
          from pathlib import Path
          import hashlib, gzip, glob
          def join(pattern):
              parts = sorted(glob.glob(pattern))
              return "".join(Path(p).read_text().strip() for p in parts)
          def unpack(pattern, dest, gzwant, want):
              raw = bytes.fromhex(join(pattern))
              g = hashlib.sha256(raw).hexdigest()
              print(dest, "gz", g, len(raw))
              if g != gzwant:
                  raise SystemExit("gz sha mismatch " + dest)
              body = gzip.decompress(raw)
              s = hashlib.sha256(body).hexdigest()
              print(dest, s, len(body))
              if s != want:
                  raise SystemExit("sha mismatch " + dest)
              Path(dest).write_bytes(body)
          unpack(".grokbuild/fix36.p*.hex", ".grokbuild/fix36_client.py",
                 "c7a7493201986dbfb771325837320b8a5af7343e7e5eb8eba35655aa0968a6fa",
                 "60aa6e7c09acb0511110ca1603c3a10d1580cdb45ffef84d66509e7e6df9b752")
          unpack(".grokbuild/stamp.p*.hex", ".grokbuild/stamp4334.sh",
                 "f77f266e9dcf5ea75512489d518eaaa855480fa977201e3fd97e286fff0d3e74",
                 "0c5fa4ec0cd4154ff3d4eeed147ed91ddffb47150b53f9093699b6923801b34f")
          PYHEX
          python3 .grokbuild/fix36_client.py
          bash .grokbuild/stamp4334.sh
          printf '4334\n' > VERSION
          grep -q 'app.js?v=4334' index.html
          grep -q 'auth.js?v=4334' index.html
          grep -q 'name="astranov-build" content="4334"' index.html
          grep -q 'id="ver">V4334' index.html
          grep -q 'var VER = "4334"' js/spacenet/app.js
          grep -q 'var VER = "4334"' sw.js
          grep -q 'latest: "4334"' api/version.js
          grep -q '4334-real' vercel.json
          grep -q 'function testView' js/spacenet/app.js
          grep -q 'function paintWho' js/spacenet/app.js
          grep -q 'function abortHunt' js/spacenet/app.js
          grep -q 'function huntSeatOk' js/spacenet/app.js
          grep -q 'fetchJsonT' js/spacenet/app.js
          grep -q 'noopener' js/spacenet/app.js
          grep -q 'Where? Name a place or allow location' js/spacenet/app.js
          grep -q 'Approximate location (IP)' js/spacenet/app.js
          if grep -q '4333' index.html sw.js VERSION api/version.js vercel.json; then echo 'stale 4333 stamp'; exit 1; fi
          node --check js/spacenet/app.js
          node --check sw.js
          node --check api/find.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4334.yml || true
          for o in 4333 4332 4331; do git rm -q -f .github/workflows/grokbuild-$o.yml 2>/dev/null || true; done
          rm -rf .grokbuild
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js api/version.js 2>/dev/null || true
          git status --short | head -40
          git commit -q -m "4334: GPS/named-only hunts (IP camera-only), 8s non-blocking Grok, test fixtures out of FIND/LIVE for all, abort in-flight hunt, TESTER ticker test-view only, signed-in name, Architect new tab (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
