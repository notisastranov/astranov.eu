name: grokbuild 4438 (Esc first on window capture; sky never prompts for location; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4438.b64", ".github/workflows/grokbuild-4438.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4438
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4438.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "e9b5d2ad0e874afb07cd6d9cb7a610636dab7a50ae289f364fbae3d03ae8b38d"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "309206"
          grep -q '__SN_4438' /tmp/f/js/spacenet/app.js
          grep -q '__SN_ESC_EARLY4438' /tmp/f/js/spacenet/app.js
          grep -q 'WHEEL_LOCK_MAX_MS' /tmp/f/js/spacenet/app.js
          grep -q 'content="4438"' /tmp/f/index.html
          grep -q 'sn-shell-4438' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4438.yml || true
          T0="$(git write-tree)"
          test "$T0" = "aef1fb10808ca894d8d9a8e214a4c22a7cbbbbc0" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "f4319135243a7cf649e3dc41e29c6c713977fbae" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4438: Esc armed first on window capture (keydown+keyup, Escape/Esc/27) closes LIST/YOU/menu/sky with no click; sheets keep key focus; sky no longer prompts for geolocation at boot (Chrome permission bubble stole Esc and first clicks); 4437 zoom lock unchanged; lockstep 4438.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
