name: grokbuild 4340 IP city view + GPS grant fly, every Enter submits, full-width sheet grip, callouts off the globe, LIVE loading (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4340.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit43; apply fix43 + stamp 4340 + tests; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved past 785011f6: merge it first (rebuild the kit)"; exit 1; }
          git merge-base --is-ancestor "$MAIN" HEAD
          git log --oneline -3
          grep -q 'var VER = "4339"' js/spacenet/app.js
          grep -q 'function armGrip' js/spacenet/app.js
          test -f .grokbuild/kit43.p00.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit43.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "511ddbc177f14f1f4c481f6721d9ca498af4721af7f1a2892caf3ffdc2c9904b": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "47d27981dbeea483564c601170eacdb8f72bc02c61613bef96c663c29140fecd": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYKIT
          python3 .grokbuild/k/fix43_client.py
          python3 .grokbuild/k/stamp4340.py
          python3 .grokbuild/k/mk_test43.py tests tests
          cp .grokbuild/k/headed_boot_gps_keys.js tests/headed_boot_gps_keys.js
          grep -q 'app.js?v=4340' index.html
          grep -q 'auth.js?v=4340' index.html
          grep -q 'leaflet.js?v=4340' index.html
          grep -q 'name="astranov-build" content="4340"' index.html
          grep -q 'id="ver">V4340' index.html
          grep -q 'var VER = "4340"' js/spacenet/app.js
          test "$(grep -c '__SN_4340 = true' js/spacenet/app.js)" = "2"
          grep -q 'location.href = "/?v=4340&' js/spacenet/app.js
          grep -q 'var VER = "4340"' sw.js
          grep -q 'sn-shell-4340' sw.js
          grep -q 'TREE LOCK 4340' sw.js
          grep -q 'SpaceNet SW 4340' sw.js
          grep -q '4340-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4340"' vercel.json
          grep -qx '4340' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4340"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          grep -q 'IP_CITY_Z = 11' js/spacenet/app.js
          grep -q 'openCity({ lat: lat, lng: lng, name: label }, { zoom: IP_CITY_Z })' js/spacenet/app.js
          grep -q 'function gpsArrived' js/spacenet/app.js
          grep -q 'function armGpsGrant' js/spacenet/app.js
          grep -q 'armGpsGrant();' js/spacenet/app.js
          grep -q 'if (st.how === "pan") return seatKind !== "ip"' js/spacenet/app.js
          grep -q 'var tq = ++talkSeq' js/spacenet/app.js
          grep -q 'Enter anywhere outside another field submits' js/spacenet/app.js
          grep -q 'var STRIP = 28, ABOVE = 24' js/spacenet/app.js
          grep -q 'map.dragging.disable()' js/spacenet/app.js
          grep -q 'LIVE · loading…' js/spacenet/app.js
          grep -q 'liveLoaded = true;' js/spacenet/app.js
          grep -q 'window.__snCards = placed' js/spacenet/app.js
          grep -q 'go.innerHTML = .<svg' js/spacenet/app.js
          grep -q 'seatState: function' js/spacenet/app.js
          grep -q 'var liveNet = 0' js/spacenet/app.js
          grep -q 'keepK = \["sn:user"' js/spacenet/app.js
          grep -q 'sign-in return in flight' js/spacenet/app.js
          grep -q 'limit=" + (lim || 16)' js/spacenet/app.js
          grep -q 'function hits(r)' js/spacenet/app.js
          grep -q 'function refresh()' js/spacenet/auth.js
          grep -q 'function geocodeFast' js/spacenet/app.js
          grep -q 'function huntSeatOk' js/spacenet/app.js
          grep -q 'function declutterPins' js/spacenet/app.js
          grep -q 'var wasShown = ' js/spacenet/app.js
          grep -q 'function isTestFixture' js/spacenet/app.js
          grep -q 'type: "sn-sw"' sw.js
          if grep -q 'c.navigate(' sw.js; then echo 'sw still navigates clients'; exit 1; fi
          grep -q 'HEADED 4340 ALL PASS' tests/headed_boot_gps_keys.js
          grep -q 'STAMP || "4340"' tests/headed_wheel_xdotool.js
          grep -q 'IP-only boot auto-zooms to the IP city view' tests/pw_hunt_replace.js
          grep -q 'grip.h >= 24' tests/pw_hunt_replace.js
          if grep -qE 'v=4339|"4339"|sn-shell-4339|4339-real|V4339|__SN_4339|TREE LOCK 4339|SW 4339' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4339 stamp'; exit 1; fi
          if grep -qx '4339' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          node --check tests/headed_boot_gps_keys.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4340.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4340.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js api/version.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js
          git status --short | head -40
          git commit -q -m "4340: an IP-only boot lands on the IP city view (camera only, labelled approximate, no hunt seat); a GPS grant at boot or later (late prompt answer, permission change, 2.5 s permission poll, GPS button) flies to the fix at street level and replaces the IP label; every Enter submits (keys typed with focus on the map/sheet land in the talk box, Enter anywhere submits, an older Grok reply never overwrites a newer line); the sheet grip is a full-width 28 px strip on the top edge plus the title bar, map dragging off while resizing, no hunt refit under a grip drag; NEWS/CALENDAR callouts sit outside the globe and never on each other; MIC is a cyan icon from boot; LIVE shows loading until /api/live answers; tests: headed_boot_gps_keys (IP auto-zoom, CDP GPS grant, GPS button, 3 queries x 1 Return, agent-scale grip drags) (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
