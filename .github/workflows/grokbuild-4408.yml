name: grokbuild 4408 (merge main 4406 + remine fixes; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4408.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4408 as merge commit, assert trees, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin 22481f203b9c6c3a3a913323093829aec4a48938
          base64 -d .grokbuild/fix4408.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "780c259a3e97baf34746bdf3b7c24272699ae42a90b1c3c51f8c041537196666"
          gunzip -c /tmp/f.gz > /tmp/fix4408.patch
          test "$(sha256sum /tmp/fix4408.patch | cut -d' ' -f1)" = "9c7f1eb43e0bb7c5882fa26dc2dea45042fcfaac1ed253655481d160096ab761"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4408.yml || true
          T0="$(git write-tree)"
          test "$T0" = "c03fadbf66f785951478c1377620c2091cda73be" || { echo "tree0 $T0"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4408.patch
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          grep -q '^4408$' VERSION
          grep -q '__SN_4408' js/spacenet/app.js
          grep -q 'zoomSnap: 1' js/spacenet/app.js
          grep -q 'setTimeout(fireHold, 1500)' js/spacenet/app.js
          grep -q 'function eatClicks' js/spacenet/app.js
          test -f favicon.ico
          T="$(git write-tree)"
          test "$T" = "361bd9ca5f9c8d2e03936888663f5c3c34c1fe14" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 22481f203b9c6c3a3a913323093829aec4a48938 -m "merge main 4406 (22481f20) + 4408: identity top-left opens account; eatClicks on panel close; integer zoom + 7 notches; pin hold 1.5s opens shop card; denser 500px labels/WALLET; integer OSM tiles no CORS. Branch engine wins. Lockstep 4408")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
