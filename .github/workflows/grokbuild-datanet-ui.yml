name: grokbuild datanet-ui (Country/City, profile+menu fields, Delete; self-deleting)
on:
  push:
    branches: ["grokbuild/datanet-ui"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-datanet-ui.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/datanet-ui
          fetch-depth: 0
      - name: Apply datanet-ui
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix-datanet-ui.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "8079bdeeae3c07039c0eeda078d6ec6996e7adf853d1669fe4b7326b66b365c2"
          gunzip -c /tmp/f.gz > /tmp/fix-datanet-ui.patch
          test "$(sha256sum /tmp/fix-datanet-ui.patch | cut -d' ' -f1)" = "33d1288e7c36d73fa515be46cca0be9ff3e6440d17512602ad5a35945428b4f7"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-datanet-ui.yml || true
          T0="$(git write-tree)"
          test "$T0" = "ca6fbf992cf37f76e616be38076ac468aaf91cd1" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix-datanet-ui.patch
          grep -q 'DataNet storage not connected yet' datanet/index.html
          grep -q 'V4413' datanet/index.html
          grep -q 'datanet-map' datanet/index.html
          grep -q 'opening_dates' datanet/index.html
          grep -q 'max_daily_qty' datanet/index.html
          grep -q '>Delete<' datanet/index.html
          ! grep -q '>DROP<' datanet/index.html
          T="$(git write-tree)"
          test "$T" = "2746607ae0467f5770262fb7048427a10c2bdfb9" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "datanet-ui: Country→City filters, vendor profile + menu fields, Delete; wire datanet schema + map feed; honest storage banner")"
          git update-ref refs/heads/grokbuild/datanet-ui "$C"
          git push origin grokbuild/datanet-ui
          echo "TIP $C"
