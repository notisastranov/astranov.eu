name: grokbuild 4421b (SN.map export; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4421b.b64", ".github/workflows/grokbuild-4421b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4421b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "b920632c9fe62d6dacdb11c397e75d16ca052960" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4421b.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "ebe21e8b1c42b25eadefc0780c5d7bb6d78097579ceb1bb738de943d29dc79b8"
          mkdir -p /tmp/f4421b && tar -xzf /tmp/f.tgz -C /tmp/f4421b
          test "$(wc -c < /tmp/f4421b/js/spacenet/app.js)" = "57322"
          grep -q 'openList: openList' /tmp/f4421b/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4421b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "4f571549862d0fe62c1f51aa630b351f6e379b86" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f4421b/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "30f8258a634fad3c2367da360c1a2f3c9438bb90" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4421b: export SN.map + SN.openList for suite/hold diagnostics.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
