name: grokbuild 4408b (fixture filter + Google PROFILE; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4408b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4408b as merge commit, assert trees, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin 22481f203b9c6c3a3a913323093829aec4a48938
          base64 -d .grokbuild/fix4408b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "8397f786dbf94ac384e0fe7025f9c7c4c98e784e512d91d8c3fe68cdb5ab6cc1"
          gunzip -c /tmp/f.gz > /tmp/fix4408b.patch
          test "$(sha256sum /tmp/fix4408b.patch | cut -d' ' -f1)" = "b6f83576727189614fd3b082280588fca63dcc950d5e5a411e64c7cb9c19c71e"
          git rm -rq .grokbuild || true
          # one path per git rm — a missing pathspec aborts the whole command
          git rm -f .github/workflows/grokbuild-4408.yml || true
          git rm -f .github/workflows/grokbuild-4408b.yml || true
          git rm -f .github/workflows/grokbuild-4408c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "361bd9ca5f9c8d2e03936888663f5c3c34c1fe14" || { echo "tree0 $T0"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4408b.patch
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          grep -q '^4408$' VERSION
          grep -q '__SN_4408' js/spacenet/app.js
          grep -q 'function openProfile' js/spacenet/app.js
          grep -q 'function scrubFixtureProfile' js/spacenet/app.js
          grep -q 'googleIdentity' js/spacenet/app.js
          grep -q 'V4297 / TESTER never in FIND roster' js/spacenet/app.js
          grep -q 'account panel' js/spacenet/auth.js
          grep -q 'sn_my_balance' js/spacenet/app.js
          test -f favicon.ico
          T="$(git write-tree)"
          test "$T" = "c5910bd8a533d5b0702b12e3428c8fac3825ad72" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 22481f203b9c6c3a3a913323093829aec4a48938 -m "merge main 4406 (22481f20) + 4408b: filter V4297/TESTER fixtures from search/pins/ticker/counts (code only, DB untouched); PROFILE auto-open binds to Google/Supabase identity (guest gets no TESTER profile); account panel + ledger star survive. Branch engine wins. Lockstep 4408")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
