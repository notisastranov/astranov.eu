name: grokbuild 4425 (PORTIONS honest; revert root to /room; lockstep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4425.b64", ".github/workflows/grokbuild-4425.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4425
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "34d616e109cba5317c747f03b6708597496ec6e1" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4425.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "ff03a374a8bbd2f63c6fc23b4711480e661e2da1af68d3a702f1655cc3ec654c"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "59277"
          test "$(wc -c < /tmp/f/js/spacenet/auth.js)" = "22841"
          test "$(wc -c < /tmp/f/js/spacenet/portions.js)" = "6341"
          test "$(cat /tmp/f/VERSION)" = "4425"
          grep -q '__SN_4425' /tmp/f/js/spacenet/app.js
          grep -q 'SpaceNet V4425' /tmp/f/index.html
          grep -q 'Zoom in to see parcels' /tmp/f/js/spacenet/portions.js
          grep -q 'No parcel data here' /tmp/f/js/spacenet/portions.js
          grep -q 'forced' /tmp/f/js/spacenet/portions.js
          grep -q '4425-preview' /tmp/f/vercel.json
          grep -q '/room/index.html' /tmp/f/vercel.json
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4425.yml || true
          T0="$(git write-tree)"
          test "$T0" = "e6c23660d8f7c9681947ae1e7a62fc7d7119781c" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js js/spacenet/portions.js; do
            cp "/tmp/f/$f" "$f"
            git add "$f"
          done
          T="$(git write-tree)"
          test "$T" = "1f531572bf13f4c1d872750d4ebf007ef7e1be0c" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (34d616e) + 4425: PORTIONS never silent (zoom/empty/error); revert astranov.eu/www root rewrite to /room/index.html (globe/starry room; awaits Notis confirm); lockstep 4425. Branch engine wins index/app/sw; spacenet host stays /index.html.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
