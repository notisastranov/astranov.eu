name: grokbuild 4388 (merge main 82c14c78 V4382; user wallet, address wraps; stamps 4388; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4388.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix104, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "da6e75915d30c7e1677cf6963ab812996b9c1150" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 82c14c787f359186a5d4da1d050fa57aad921d3e^{commit}
          base64 -d .grokbuild/fix104.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "49bbda8f563d78444f6477b8ea3a0ee59e1d15e94d10dd3616507bcd2ea5411c"
          gunzip -c /tmp/f.gz > /tmp/fix104.patch
          test "$(sha256sum /tmp/fix104.patch | cut -d' ' -f1)" = "1281039f6dc6ae760667fbbe6d73d0a98bb601e12caf204195ae1c5d5ce75f68"
          git rm -rq .grokbuild .github/workflows/grokbuild-4388.yml
          git apply --index /tmp/fix104.patch
          node --check js/spacenet/app.js
          grep -q '^4388$' VERSION
          T="$(git write-tree)"
          test "$T" = "dfa06033918f5fb11e4c31016dbf20d97f4c8895" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 82c14c787f359186a5d4da1d050fa57aad921d3e -m "Merge main (82c14c78: V4382 zoom ladder, five instruments, wheel-to-ladder, globe start without the city) into the branch engine. Took the MASTER_PROMPT levels-and-instruments block. Skipped the sn-4382 hide-all CSS (#in, JOBS/FIND/NODE/MIC, helper, island, ribbon), the forced instrument CSS, main's zoomSmooth / wheel / zoomend rewrite (the branch zoom engine wins), the radar and monitor re-creation (the branch has its own) and the Rhodes aim default. The wallet always opens the user's star wallet (the owner reaches POOL from a button inside it); a long shop address wraps in the card. Lockstep 4388")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
