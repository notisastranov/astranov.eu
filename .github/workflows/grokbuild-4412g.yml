name: grokbuild 4412g (await API full set, no client drop, warm; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412g.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412g
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412g.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "4ca861b716daf330433ece6a6d740ccd70f1907aaa2fea7f5658f149851ac16d"
          gunzip -c /tmp/f.gz > /tmp/fix4412g.patch
          test "$(sha256sum /tmp/fix4412g.patch | cut -d' ' -f1)" = "28130e34ad82e3dc4870b6c57feda1e461078bf75fcab29a47bd9e46331d1336"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412g.yml || true
          git rm -f .github/workflows/grokbuild-4412f.yml || true
          T0="$(git write-tree)"
          test "$T0" = "39c0b0cebeb91dc941d1c6a742f3e3548386554e" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412g.patch
          grep -q '__SN_4412G' js/spacenet/app.js
          grep -q 'never race API to' js/spacenet/app.js
          grep -q 'fromServer' js/spacenet/app.js
          grep -q 'function warmHunt' js/spacenet/app.js
          grep -q 'own 45s abort' js/spacenet/app.js
          grep -q 'soft 15s note' js/spacenet/app.js
          grep -q 'var VER = "4412"' sw.js
          test "$(cat VERSION)" = "4412"
          T="$(git write-tree)"
          test "$T" = "bd805ae8911d24519a7089d32cbbb0eea7c9a6f1" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412g: await API full set (no race-to-empty), trust server rows, warm cold path, fit after final. Keep 4412f.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
