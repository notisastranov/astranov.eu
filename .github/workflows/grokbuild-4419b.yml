name: grokbuild 4419b (merge main 7a66a1e5 + stamps; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4419b.b64", ".github/workflows/grokbuild-4419b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4419b as merge of main
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "7a66a1e5533f2eb0027fcaa559425a0ca6672e0b" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4419b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "4c2660dbfe62850317bc07e630cb8bfdfbbe80cd1a894ee98395270cb5aa7d67"
          gunzip -c /tmp/f.gz > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | cut -d' ' -f1)" = "7ee45959804744830e91ab307d159781eafd6ccac99a1ebd372d9947125d8938"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4419.yml .github/workflows/grokbuild-4419b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "9837f8eb22c7c39cf7c261c337e9b112de5442f0" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix.patch
          grep -q '__SN_4419' js/spacenet/app.js
          test "$(cat VERSION)" = "4419"
          T="$(git write-tree)"
          test "$T" = "670e8a29dc779146c9bca12d19255e994df3003e" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4419: merge main 7a66a1e5 (4419-real) into preview; keep 4418 GPS/drawer/no auto-profile; port pending driver offer; lockstep 4419.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
