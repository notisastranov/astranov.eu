name: grokbuild 4409c (WALLET slot + deterministic cull; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4409c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4409c
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          echo "main tip $MAIN_TIP"
          base64 -d .grokbuild/fix4409c.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "a9e21bfad5bb9eaddfc9ce0a959ded2784fbf4a65103c551c18ec68fb90e7cee"
          gunzip -c /tmp/f.gz > /tmp/fix4409c.patch
          test "$(sha256sum /tmp/fix4409c.patch | cut -d' ' -f1)" = "9ce00b8d2a7049a910df63e273585ff4ca30e64a84f4e5dcff9a783d19e8b226"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4409c.yml || true
          git rm -f .github/workflows/grokbuild-4409b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "34d56f24ef89f60d8c3218be38add83139a62c62" || { echo "tree0 $T0 want 34d56f24ef89f60d8c3218be38add83139a62c62"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4409c.patch
          grep -q '4409c: WALLET slot' js/spacenet/app.js
          grep -q '4409c: stable key first' js/spacenet/app.js
          grep -q 'top:96px!important' js/spacenet/app.js
          grep -q '"4409"' vercel.json
          grep -q '4409-real' vercel.json
          ! grep -q '"4408"' vercel.json
          T="$(git write-tree)"
          test "$T" = "cb6ce6123a6113d5c3af0c7e0f04e91d3f3c53f9" || { echo "tree $T want cb6ce6123a6113d5c3af0c7e0f04e91d3f3c53f9"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4409c: WALLET slot survives releaseChrome (top:96 CSS + placeRibbon re-assert); deterministic face-off (huntKey-first, latlng fallback). Keep 4408 remine + 4409 fixes. Lockstep 4409")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
          git log --oneline -3
