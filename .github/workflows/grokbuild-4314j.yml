name: grokbuild 4314j apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix16.py
          sha256sum -c .grokbuild/4314j.sha256
          node --check js/spacenet/app.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4314j.yml
          git add -A
          git commit -q -m "4314: driver/client re-list upserts by owner+kind+name and sn:people dedupes on load; JOBS chip after reload; run-offer finds own shops (never foreign); offer shows items + delivery = total; guest saves say device-only, no empty auth header (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
