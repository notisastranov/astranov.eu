name: grokbuild 4429b (vercel/VERSION lockstep 4429; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4429b.b64", ".github/workflows/grokbuild-4429b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4429b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4429b.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "e44a90496aa48020335e3d20842572818d97ae9cfbb5e7c0d670ad6259077b90"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          grep -q '4429-preview' /tmp/f/vercel.json
          test "$(cat /tmp/f/VERSION)" = "4429"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4429b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "915c500d7ad67cc990271941a274e9828ec5bf50" || { echo "tree0 $T0"; exit 1; }
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "d2809f1bb384ac1424dc27a7c99670694bc616d1" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4429b: lockstep X-Astranov-Build/Ship headers + VERSION to 4429.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
