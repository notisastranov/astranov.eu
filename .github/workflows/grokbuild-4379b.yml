name: grokbuild 4379b (reverse geocode falls back to Photon; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4379b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix90, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "0c40f11135debdce85e82de915e5f898200ff5c1" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix90.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "27f2e8722ff6f7cc5e0ca26ded73506e9245c0f4aaa471b57550d06441c2081d"
          gunzip -c /tmp/f.gz > /tmp/fix90.patch
          test "$(sha256sum /tmp/fix90.patch | cut -d' ' -f1)" = "eac4a74b09256dce68528edd2fd7c6d3c5b0be23ee057085c4400dea53658683"
          git rm -rq .grokbuild .github/workflows/grokbuild-4379b.yml
          git apply --index /tmp/fix90.patch
          node --check js/spacenet/app.js
          grep -q '^4379$' VERSION
          T="$(git write-tree)"
          test "$T" = "e8c748ed879e2cc31a6d8808ed46d762c2f3e75c" || { echo "tree $T"; exit 1; }
          git commit -q -m "4379b: /api/find reverse falls back to Photon when Nominatim returns nothing to the server, so the hold LIST card keeps its street / area title; stamps stay 4379"
          git push origin HEAD:grokbuild/4328-street-level-gps
