name: grokbuild 4389 (GO always labelled, attach named, full Nominatim shop count, category text is not a name, approx. address explained; stamps 4389; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4389.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix105, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "48fdb9f3f8b71687bdf6596bb210710162725c09" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix105.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "f43303abf82b23be68f928c96a1ba6ad7233a9d5893514db787374bf1143f994"
          gunzip -c /tmp/f.gz > /tmp/fix105.patch
          test "$(sha256sum /tmp/fix105.patch | cut -d' ' -f1)" = "5f8f56645a51cbb08417e958804ee5a9a94b670c81fe6401f813241d42124f49"
          git rm -rq .grokbuild .github/workflows/grokbuild-4389.yml
          git apply --index /tmp/fix105.patch
          node --check js/spacenet/app.js
          grep -q '^4389$' VERSION
          T="$(git write-tree)"
          test "$T" = "4d4e70f63922e74f04f4edea2cb85af78081f090" || { echo "tree $T"; exit 1; }
          git commit -q -m "4389: GO is always a labelled GO button (an empty line still opens the mic) and the attach button is named; with Overpass down a bounded Nominatim trade search pages on (exclude_place_ids) until it holds the asked count of really named shops (Heraklion supermarkets 5-13 -> 23); category text such as Meat and other food or Mini Shop is not a name; an approximate address reads (approx. address); lockstep 4389"
          git push origin HEAD:grokbuild/4328-street-level-gps
