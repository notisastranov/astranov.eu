name: grokbuild 4430b (hunt/GPS must not steal cursor aim; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4430b.b64", ".github/workflows/grokbuild-4430b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4430b
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4430b.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "e86f0135118245a1aee07301f2865ab7cb613fe7352cd3bef63686e352f1d9cb"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "273340"
          grep -q '__SN_4430b' /tmp/f/js/spacenet/app.js
          grep -q 'hunt result wins' /tmp/f/js/spacenet/app.js
          grep -q 'cancel in-flight GPS land' /tmp/f/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4430b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "8cca76f933a2fd923dbbd2836f28cce7b8148293" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "9a60089bebbdc91a5a18ec47b8a5dc6d3c4cddfe" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4430b: hunt/GPS must not steal aim (no land-before-search; showFound prefers hunt pin; land skips fly mid-zoom).")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
