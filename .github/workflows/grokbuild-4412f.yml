name: grokbuild 4412f (huntNearKm client seat + 12s api race; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412f.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412f
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412f.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "c8a15f49ef150ecee2a54c085884f7f63e2982abf45147f0148b97e048d4032d"
          gunzip -c /tmp/f.gz > /tmp/fix4412f.patch
          test "$(sha256sum /tmp/fix4412f.patch | cut -d' ' -f1)" = "d3759f479f708b901dedb6d0ec1d37c15c95ccf67377141b05d60d8b0d6d1189"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412f.yml || true
          git rm -f .github/workflows/grokbuild-4412e.yml || true
          T0="$(git write-tree)"
          test "$T0" = "1b049aea23ae7fadc2e91034a9f75a17ff2d409d" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412f.patch
          grep -q '__SN_4412F' js/spacenet/app.js
          grep -q 'huntRace(apiP, 12000)' js/spacenet/app.js
          grep -q 'huntNearKm()' js/spacenet/app.js
          grep -q '4412f: Crete/Heraklion hunts keep island span' js/spacenet/app.js
          grep -q 'var VER = "4412"' sw.js
          test "$(cat VERSION)" = "4412"
          T="$(git write-tree)"
          test "$T" = "39c0b0cebeb91dc941d1c6a742f3e3548386554e" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412f: huntNearKm for Crete/Heraklion seat filter + 12s api race so full shop set and Menir land on first paint. Keep 4412e.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
