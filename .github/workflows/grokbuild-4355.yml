name: grokbuild 4355 route steps, real driver, inset, hunt count + merge main V4342-V4345 (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4355.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit58; C1 fixes, merge V4342, merge V4343; assert trees; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          git merge-base --is-ancestor ad9d7254c506cf43a26c4b8b449be5d34ae98bf8 origin/main || { echo "main does not contain ad9d7254 (V4345)"; exit 1; }
          git merge-base --is-ancestor 6de19cf7b2b737d570d76cfaf08f1ea68acd6b03 origin/main
          git merge-base --is-ancestor 6e7b490f9d01c1ed10f5282ef02d53e5d8faf9f3 origin/main
          git merge-base --is-ancestor 60b137ab31748c012c6b5a4326487e4fe602f24e origin/main
          git merge-base --is-ancestor cc5301e2cd729524ad9444cb89dceb43156c3ef7 HEAD
          grep -q 'var VER = "4354"' js/spacenet/app.js
          test -f .grokbuild/kit58.p00.b64
          test -f .grokbuild/kit58.p07.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit58.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "4294e6b87a7f4fae60d0cf014f5c53c1f9cbba5069791a86abe7f59c7ef14235": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "16fc9fefa9eeeff6ee7c5480531976e655f93a6d88d7dd67dfb5c679010df75e": raise SystemExit("tar sha mismatch")
          Path("/tmp/k58").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall("/tmp/k58")
          PYKIT
          git rm -q -r --cached .grokbuild
          git rm -q --cached .github/workflows/grokbuild-4355.yml
          rm -rf .grokbuild .github/workflows/grokbuild-4355.yml
          git apply --check /tmp/k58/fix58.patch
          git apply --index /tmp/k58/fix58.patch
          test "$(git write-tree)" = "74d09ba8e4401300012b1886ba58f3c13895fed3"
          git commit -q -m "4355: the route card carries the real order steps READY · PICKUP · ON THE BIKE · DELIVERED · RECEIVED (done ticked, next bright, each advancing the order; ACCEPT opens it and no longer fakes READY); it names the actual assigned driver (signed-in driver, the offered one, else the nearest real one, never a Test Driver V4297 fixture); edit cards are a real inset (centred, <= 720 px, >= max(16px,4vw) margins), 72 px tile photos, the 42 % cap kept; the hunt pin count is in the DOM (data-hunt-pins / -state / -cached on <html> and the LIVE pill) and stays honest when listed shops land after the hunt; the in-place test stubs every write except its in-memory /api/space; lockstep stamp 4355"
          git merge --no-ff --no-commit 60b137ab31748c012c6b5a4326487e4fe602f24e || true
          python3 /tmp/k58/resolve4355.py
          git add VERSION api/version.js sw.js vercel.json index.html js/spacenet/app.js
          git apply --index /tmp/k58/post58.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git write-tree)" = "4c61fae6aa6c2fde7a4cadceb4c5690cab469ca8" || { echo "M1 tree $(git write-tree)"; exit 1; }
          git commit -q -m "Merge main (60b137ab, V4342): take the green check placing the order and closing, Dish / Price on the vendor card, rememberDish, city order bubbles and the cloud. Kept from the branch: 72 px photos, the real inset and 42 % cap (not 46vh), the delivery fee line, EDIT MY SHOP, ORDER as a second way, resolveDrop / askDropNear, the forced globe frame; an admin order does not mark READY itself, offers go to the real driver; no inline sn-handle-law script"
          test "$(git rev-parse HEAD^2)" = "60b137ab31748c012c6b5a4326487e4fe602f24e"
          git merge --no-ff --no-commit 6e7b490f9d01c1ed10f5282ef02d53e5d8faf9f3 || true
          python3 /tmp/k58/resolve4355b.py
          git add VERSION api/version.js sw.js vercel.json index.html js/spacenet/app.js
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' index.html js/spacenet/app.js sw.js vercel.json VERSION api/version.js; then echo 'markers left'; exit 1; fi
          python3 /tmp/k58/stamp4355.py
          git add -A
          for f in js/spacenet/app.js js/spacenet/auth.js sw.js api/version.js api/space.js api/find.js api/videos.js tests/pw_listing_inplace.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js tests/headed_wheel_xdotool.js tests/headed_tile_stress.js; do node --check $f; done
          grep -q '^4355$' VERSION
          if grep -q 'sn-handle-law' index.html; then echo 'inline handle-law script came back'; exit 1; fi
          test "$(git write-tree)" = "6ff555fb8da84bdf932d29fd29c5cb46ec12a425" || { echo "M2 tree $(git write-tree)"; git diff --cached --stat HEAD; exit 1; }
          git commit -q -m "Merge main (6e7b490f, V4343): take orders need a price, the order offer + route after ordering, the clickable pending / on the way / cancelled list, openJob, wrong-way warnings, fewer-lights road choice (asked through the same-origin /api/find proxy). Kept from the branch: the map init (custom wheel, tile self-heal, click / double-click, only a user zoom-out leaves the city), resolveDrop, READY as the vendor's step, pickDriver; stamps 4355"
          test "$(git rev-parse HEAD^2)" = "6e7b490f9d01c1ed10f5282ef02d53e5d8faf9f3"
          git merge --no-ff --no-commit 6de19cf7b2b737d570d76cfaf08f1ea68acd6b03 || true
          python3 /tmp/k58/resolve4355c.py
          python3 /tmp/k58/stamp4355.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' index.html js/spacenet/app.js sw.js vercel.json VERSION api/version.js; then echo 'markers left'; exit 1; fi
          for f in js/spacenet/app.js sw.js api/version.js; do node --check $f; done
          grep -qF -- 'function routeSteps(job)' js/spacenet/app.js
          grep -qF -- 'function markHunt(n, state)' js/spacenet/app.js
          grep -qF -- 'if (on) openRouteTile(id);' js/spacenet/app.js
          test "$(git write-tree)" = "06087ac6fc6ce96a5178a5210bc558d89b66245e" || { echo "M3 tree $(git write-tree)"; git diff --cached --stat HEAD; exit 1; }
          git commit -q -m "Merge main (6de19cf7, V4344): take the login lock, the neon route (casing, glow, core) and the selected-driver glow, frameView after a ride nudge. Kept from the branch: the delayed single click and double-click centring, the number badge on pins (faceIcon gets both), the bright route line still opens the ROUTE card with the order steps; stamps 4355"
          test "$(git rev-parse HEAD^2)" = "6de19cf7b2b737d570d76cfaf08f1ea68acd6b03"
          git merge --no-ff --no-commit ad9d7254c506cf43a26c4b8b449be5d34ae98bf8 || true
          python3 /tmp/k58/resolve4355d.py
          python3 /tmp/k58/stamp4355.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' index.html js/spacenet/app.js sw.js vercel.json VERSION api/version.js; then echo 'markers left'; exit 1; fi
          for f in js/spacenet/app.js sw.js api/version.js api/research.js; do node --check $f; done
          grep -q '^4355$' VERSION
          if grep -q 'sn-handle-law' index.html; then echo 'inline handle-law script came back'; exit 1; fi
          test "$(git write-tree)" = "8167c978be416de63a140929d39e2828ba1f188c" || { echo "M4 tree $(git write-tree)"; git diff --cached --stat HEAD; exit 1; }
          git commit -q -m "Merge main (ad9d7254, V4345): take the global research tiles and feed (api/research.js), the research reading card and big estimate. Kept from the branch: the HUD rects for callouts, 72 px photos, the real inset and 42 % cap for edit cards, #line visible (main hides it), the brief tap-zoom defaults; stamps 4355"
          test "$(git rev-parse HEAD^2)" = "ad9d7254c506cf43a26c4b8b449be5d34ae98bf8"
          git log --format='%h %p %s' -6 | cut -c1-110
          sleep 75
          git push origin HEAD:grokbuild/4328-street-level-gps
