name: grokbuild 4412c (prepend Sitia/Menir before 40-cap; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412c
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412c.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "16a28f05976f6839eabddf3c6dd74241084a3e115691a98de5ea9650e6376562"
          gunzip -c /tmp/f.gz > /tmp/fix4412c.patch
          test "$(sha256sum /tmp/fix4412c.patch | cut -d' ' -f1)" = "50abd1e43180218c5d66d05c4264e885ff1b28908f73bbee21086f42c80c09d5"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412c.yml || true
          git rm -f .github/workflows/grokbuild-4412b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "7fecf7b6d4121a53c14a3f457948e54c010b21d0" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412c.patch
          grep -q 'prepend Sitia/Menir' lib/http/find.js
          grep -q 'var VER = "4412"' sw.js
          test "$(cat VERSION)" = "4412"
          T="$(git write-tree)"
          test "$T" = "8bc5ff30a8a7b63acbebc0d1f82d167883102e9d" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412c: prepend Sitia/Menir Nominatim terms before general shop expansion so HUNT_CAP 40 cannot crowd them out. Keep 4412b.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
