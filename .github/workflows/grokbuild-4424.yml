name: grokbuild 4424 (merge main 34d616e land portions + parcels page; lockstep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4424.b64", ".github/workflows/grokbuild-4424.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4424
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "34d616e109cba5317c747f03b6708597496ec6e1" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4424.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "a214ca54c08d4ef974d3a4d470b46285e5fa46c9c89c2a0b840064384fa8bd55"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "59277"
          test "$(wc -c < /tmp/f/js/spacenet/auth.js)" = "22841"
          test "$(wc -c < /tmp/f/js/spacenet/portions.js)" = "4658"
          test "$(wc -c < /tmp/f/lib/http/parcels.js)" = "4426"
          test "$(cat /tmp/f/VERSION)" = "4424"
          grep -q '__SN_4424' /tmp/f/js/spacenet/app.js
          grep -q 'window.__SN_MAP = map' /tmp/f/js/spacenet/app.js
          grep -q 'SpaceNet V4424' /tmp/f/index.html
          grep -q 'portions.js?v=4424' /tmp/f/index.html
          grep -q 'Zoom in to see all parcels' /tmp/f/lib/http/parcels.js
          grep -q 'resultOffset' /tmp/f/lib/http/parcels.js
          grep -q 'Zoom in to see all parcels' /tmp/f/js/spacenet/portions.js
          grep -q '"parcels"' /tmp/f/api/\[...path\].js
          grep -q '4424-preview' /tmp/f/vercel.json
          grep -q '"/index.html"' /tmp/f/vercel.json
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4424.yml || true
          T0="$(git write-tree)"
          test "$T0" = "7cdff068cbd30d5922c61e6b2ca7f4956623e7af" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet lib/http api
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js js/spacenet/portions.js lib/http/parcels.js "api/[...path].js"; do
            cp "/tmp/f/$f" "$f"
            git add "$f"
          done
          T="$(git write-tree)"
          test "$T" = "4de071ec5d9c3ec2426c1e58217a74690579095f" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (34d616e) + 4424: land portions + /api/parcels paging (honest zoom-in); root /index.html kept as main (awaits Notis confirm); lockstep 4424. Branch engine wins index/app/sw.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
