name: grokbuild 4311 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Merge main 4310, fix, restamp, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          git merge -q --no-edit -X theirs f901d6586801fd17a65b404b52777bbb40903125
          python3 .grokbuild/fix4.py
          bash .grokbuild/stamp.sh 4311
          sha256sum -c .grokbuild/4311.sha256
          for f in js/spacenet/app.js api/find.js api/ai.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4311.yml
          git add -A
          git commit -q -m "4311: Talk pins named cities without GPS + Overpass fallback + stamp align (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
