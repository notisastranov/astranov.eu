name: grokbuild 4367 (merge main 0a025833 keeping branch tree, stamps 4367; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4367.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix69, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "8c1c585b917449f7b245d722697c6bcfc6e62fe0" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 0a025833ad367cc3df6e67107d21a66d27cae3cb^{commit}
          base64 -d .grokbuild/fix69.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "14f657504a483906a83e39be91df6dbafb42a7cf6c1b271b3d90aa5b879bdccf"
          gunzip -c /tmp/f.gz > /tmp/fix69.patch
          test "$(sha256sum /tmp/fix69.patch | cut -d' ' -f1)" = "082f8c1ad618fd4b9ebcd969cec18b809d100ce2e532989c3940f028fd464372"
          git rm -rq .grokbuild .github/workflows/grokbuild-4367.yml
          git apply --index /tmp/fix69.patch
          node --check js/spacenet/app.js
          grep -q '^4367$' VERSION
          T="$(git write-tree)"
          test "$T" = "7cfef2614f086f4e4d8d187f69a42363a077c29f" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 0a025833ad367cc3df6e67107d21a66d27cae3cb -m "Merge main (0a025833: bf5e4cc/27bb1c7 revert to V4344 + stamps 4365) keeping the branch tree (branch descends 4344 and carries every fix; main revert = 0715d9e4 code + stamps only); 4367: signed-in button shows the identity, stale YouTube token no longer 401s on boot, crisp 10 px grip; lockstep 4367")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
