name: grokbuild 4428c (intro must not fight zoom; prefer aim over bad hit; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4428c.b64", ".github/workflows/grokbuild-4428c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4428c
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4428c.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "6112258fec0a3e3bdf676d610cdd026fb04a3c42c80cf4c2c07c2b24dde92c6f"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "264274"
          grep -q 'never clamp dist once aimed' /tmp/f/js/spacenet/app.js
          grep -q 'km > 25' /tmp/f/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4428c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "e07e0f97a4798882130332767e7ff581d7cf0ad0" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "c6df4fb69dc0b4d5fa2fcce11e0b493be8090a5a" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4428c: intro must not clamp dist/skip face-hold after aim; zoomAnchor prefers aim over >25km bad globeHit.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
