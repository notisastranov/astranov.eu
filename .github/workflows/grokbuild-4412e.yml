name: grokbuild 4412e (fast Menir priority + parallel nominatim wave; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4412e.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4412e
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          base64 -d .grokbuild/fix4412e.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "0f34638e5a58cadfea06aec359abe5735639454039bd37b80319755a9b129b2d"
          gunzip -c /tmp/f.gz > /tmp/fix4412e.patch
          test "$(sha256sum /tmp/fix4412e.patch | cut -d' ' -f1)" = "cec9c3d0195a285d9b4f36575fa24c570a74b4d1e778aecbba43c6a3cf04e248"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4412e.yml || true
          git rm -f .github/workflows/grokbuild-4412d.yml || true
          T0="$(git write-tree)"
          test "$T0" = "6cfd15772661e756d4e9c726fda9ef32e2fd9ec5" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4412e.patch
          grep -q '4412e' lib/http/find.js
          grep -q 'Promise.all' lib/http/find.js
          grep -q 'want = 24' lib/http/find.js
          grep -q 'var VER = "4412"' sw.js
          test "$(cat VERSION)" = "4412"
          T="$(git write-tree)"
          test "$T" = "1b049aea23ae7fadc2e91034a9f75a17ff2d409d" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4412e: one Menir priority fetch + parallel nominatim wave so shops hunts finish under UI wait; keep Menir reinject. Keep 4412d.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
