name: grokbuild 4380 (merge main 631ccb04 V4375; globe commands, globe pins, fixtures hidden, ribbon from stamp, no IP you, A hidden, wallet stars; stamps 4380; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4380.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix91, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "ebeb66755634167e4c058c6fd6b362b6fd7d8eef" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 631ccb041e53a8d0f3f95238f9e0956ec893fd49^{commit}
          base64 -d .grokbuild/fix91.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "3e7149393ce18c1686842ff56c15adfe879dc196a7ffeebbdc32beaa6fc21706"
          gunzip -c /tmp/f.gz > /tmp/fix91.patch
          test "$(sha256sum /tmp/fix91.patch | cut -d' ' -f1)" = "ef91ebc29e839460caa12f1ac03f63344b0daf105dc052c166d9972f806dee87"
          git rm -rq .grokbuild .github/workflows/grokbuild-4380.yml
          git apply --index /tmp/fix91.patch
          node --check js/spacenet/app.js
          grep -q '^4380$' VERSION
          T="$(git write-tree)"
          test "$T" = "497024589ff39691674cbc41307db15c933b55c7" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 631ccb041e53a8d0f3f95238f9e0956ec893fd49 -m "Merge main (631ccb04: V4375 picture on you, bigger controls) into the branch engine; took you.png / the YOU picture for signed-in users, the control sizes and hidden A / FIND / NODE / LATEST buttons; kept the branch pins, labels and driver faces over main's larger pins and second driver layer. Globe: a hunt or fly-to typed on the globe draws an arc, flies the camera and opens the map; real named pins and the arc draw on the globe; plumber hunts at once; near me uses GPS or the last real fix; dating answers at once. Test fixtures (V4297, TESTER CLIENT, 0000000000) never paint. Ribbon reads the build stamp. The IP city is never you. Wallet reads in stars. Lockstep 4380")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
