name: grokbuild 4335 query replace, field=FIND=pins, twins, vendor address/photo, wheel anchor (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4335.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main; decode kit38; apply fix38 + stamp 4335; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "b2b228dd8755f6f0a6b1b006313b4bca13292c84" || { echo "main moved"; exit 1; }
          if ! git merge-base --is-ancestor "$MAIN" HEAD; then
            git merge origin/main -m "merge main under 4335 preview" -X ours
          fi
          git merge-base --is-ancestor "$MAIN" HEAD
          grep -q 'sn-architect' index.html
          grep -q 'function bootTick' js/spacenet/app.js
          test -f .grokbuild/kit38.p00.hex
          python3 - <<'PYHEX'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io
          raw = bytes.fromhex("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit38.p*.hex"))))
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "af778f14ab5e2609d0aeb662e8b2e29137f98a659a37b441a4806d44a8cd7e66": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "5e7b49357a53228cb8f2afc7283fae093aab8525992a6fe7dad14ac78021a38c": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYHEX
          python3 .grokbuild/k/fix38_client.py js/spacenet/app.js
          python3 .grokbuild/k/fix38_api.py api/find.js
          bash .grokbuild/k/stamp4335.sh
          printf '4335\n' > VERSION
          cp .grokbuild/k/pw_wheel_real.js tests/pw_wheel_real.js
          cp .grokbuild/k/pw_hunt_replace.js tests/pw_hunt_replace.js
          grep -q 'app.js?v=4335' index.html
          grep -q 'auth.js?v=4335' index.html
          grep -q 'name="astranov-build" content="4335"' index.html
          grep -q 'id="ver">V4335' index.html
          grep -q 'var VER = "4335"' js/spacenet/app.js
          grep -q '__SN_4335 = true' js/spacenet/app.js
          grep -q 'var VER = "4335"' sw.js
          grep -q 'sn-shell-4335' sw.js
          grep -q 'latest: "4335"' api/version.js
          grep -q '4335-real' vercel.json
          grep -qx '4335' VERSION
          grep -q 'function fieldShops' js/spacenet/app.js
          grep -q 'function renderFind' js/spacenet/app.js
          grep -q 'function pickHit' js/spacenet/app.js
          grep -q 'frameCam = { yaw' js/spacenet/app.js
          grep -q 'function mergeTwins' js/spacenet/app.js
          grep -q 'function fanOut' js/spacenet/app.js
          grep -q 'function addrOf' js/spacenet/app.js
          grep -q 'function photoOf' js/spacenet/app.js
          grep -q 'sn:overpass-off' js/spacenet/app.js
          grep -q 'setZoomAround' js/spacenet/app.js
          grep -q 'ResizeObserver' js/spacenet/app.js
          grep -q '0 AV€ · guest' js/spacenet/app.js
          grep -q 'Hold 3 seconds.' js/spacenet/app.js
          grep -q 'projectFrame' js/spacenet/app.js
          grep -q 'mode: "reverse"' api/find.js
          grep -q 'phase4' tests/pw_wheel_real.js
          grep -q 'HUNT_REPLACE' tests/pw_hunt_replace.js
          if grep -q '4334' index.html sw.js VERSION api/version.js vercel.json; then echo 'stale 4334 stamp'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check sw.js
          node --check api/find.js
          node --check tests/pw_wheel_real.js
          node --check tests/pw_hunt_replace.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4335.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4335.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js api/version.js api/find.js tests/pw_wheel_real.js tests/pw_hunt_replace.js
          git status --short | head -40
          git commit -q -m "4335: every query rebuilds one field (pins = FIND = LIVE), pizza/supermarket synonyms + menu match, no cross-city leaks, Augoustinos twins merged + pin fan-out, vendor address/photo (listing, OSM, reverse ≈), guest wallet, Overpass session backoff, wheel anchor per gesture on the drawn frame, tiles follow resizes (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
