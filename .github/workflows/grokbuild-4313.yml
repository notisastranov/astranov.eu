name: grokbuild 4313 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, restamp, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix6r.py
          bash .grokbuild/stamp.sh 4313
          sha256sum -c .grokbuild/4313.sha256
          for f in js/spacenet/app.js api/find.js api/ai.js api/space.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4313.yml
          git add -A
          git commit -q -m "4313: Talk pins named cities without GPS (Athens, Rhodes) + place listings + Overpass fallback + stamp align (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
