name: grokbuild 4332 handoff+hunt+inplace+wallet (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4332.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main; decode kit; apply; stamp 4332; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "ef3f2856d71b1f257aa6bfaf4733e784459e96ba" || { echo "main moved"; exit 1; }
          git merge origin/main -m "merge main under 4332 preview" -X ours || {
            git checkout --ours js/spacenet/app.js api/find.js || true
            git checkout --theirs index.html vercel.json sw.js VERSION api/version.js || true
            git add -A
            git -c core.editor=true merge --continue || git commit --no-edit || true
          }
          grep -q 'function activeSeat' js/spacenet/app.js
          grep -q 'findOwnRoleTwin' js/spacenet/app.js
          test -f .grokbuild/fix34.p0.b64
          cat .grokbuild/fix34.p0.b64 .grokbuild/fix34.p1.b64 .grokbuild/fix34.p2.b64 | tr -d '\n' > .grokbuild/fix34_client.py.gz.b64.safe
          cat .grokbuild/stamp4332.a.hex .grokbuild/stamp4332.b.hex | xxd -r -p > .grokbuild/stamp4332.sh
          cat .grokbuild/pw_wheel_emed.p0.b64 .grokbuild/pw_wheel_emed.p1.b64 .grokbuild/pw_wheel_emed.p2.b64 | tr -d '\n' | base64 -d > .grokbuild/pw_wheel_emed.js
          test "$(sha256sum .grokbuild/pw_wheel_emed.js | awk '{print $1}')" = "c06f6734d1c59db035c8dc500f7571fd99aebe0be87f2a6ee928f86eb8133cb3"
          chmod +x .grokbuild/stamp4332.sh
          python3 - <<'PYFIX'
          import gzip, base64, hashlib
          from pathlib import Path
          p = Path(".grokbuild/fix34_client.py.gz.b64.safe")
          blob = p.read_text().strip().replace("g_ml", "$" + "<")
          raw = gzip.decompress(base64.b64decode(blob))
          want = "7ebe5f51b71413dc1f51f43a0391ff6049d0cf7b3b79f47abb9e3dba9cc92408"
          got = hashlib.sha256(raw).hexdigest()
          print("fix34 sha", got)
          if got != want:
              raise SystemExit("fix34 sha mismatch after unmangle")
          Path(".grokbuild/fix34_client.py").write_bytes(raw)
          print("ok decoded fix34_client.py")
          PYFIX
          test "$(sha256sum .grokbuild/fix34_client.py | awk '{print $1}')" = "7ebe5f51b71413dc1f51f43a0391ff6049d0cf7b3b79f47abb9e3dba9cc92408"
          python3 .grokbuild/fix34_client.py
          python3 - <<'PYB'
          import gzip, hashlib
          from pathlib import Path
          hx = []
          for i in range(0, 16):
              f = Path(f".grokbuild/fix34b.h{i}.hex")
              if not f.exists():
                  break
              hx.append(f.read_text().strip())
          if not hx:
              raise SystemExit("fix34b hex parts missing")
          gz = bytes.fromhex("".join(hx))
          raw = gzip.decompress(gz)
          got = hashlib.sha256(raw).hexdigest()
          print("fix34b sha", got)
          if got != "ff0a7a207cb87ad91423c5ecae077b98ed530bc03ba8be6f291b8ec74913fa1f":
              raise SystemExit("fix34b sha mismatch")
          Path(".grokbuild/fix34b_client.py").write_bytes(raw)
          PYB
          python3 .grokbuild/fix34b_client.py
          bash .grokbuild/stamp4332.sh
          printf '4332\n' > VERSION
          mkdir -p tests
          cp .grokbuild/pw_wheel_emed.js tests/pw_wheel_emed.js || true
          grep -q 'app.js?v=4332' index.html
          grep -q 'var VER = "4332"' js/spacenet/app.js
          grep -q 'Approximate location (IP)' js/spacenet/app.js
          grep -q 'revealWhenTiled' js/spacenet/app.js
          grep -q 'talkLock' js/spacenet/app.js
          grep -q 'JSON.parse(menu)' js/spacenet/app.js
          grep -q 'parseInPlace' js/spacenet/app.js
          grep -q '__snHuntRaw' js/spacenet/app.js
          grep -q '0 AV€ · guest' js/spacenet/app.js
          grep -q 'spaceP.catch' js/spacenet/app.js
          grep -q '4332-real' vercel.json
          node --check js/spacenet/app.js
          node --check api/find.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4332.yml || true
          git rm -q -f .github/workflows/grokbuild-4331.yml 2>/dev/null || true
          git add -A
          git status --short | head -40
          git commit -q -m "4332: tile handoff; hunt fallback; in-place land; guest wallet; Enter; GPS/IP (preview, do not merge)"
          export GIT_TERMINAL_PROMPT=0
          git -c http.version=HTTP/1.1 push origin HEAD:grokbuild/4328-street-level-gps
