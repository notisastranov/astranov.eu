name: grokbuild 4314f apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix12.py
          sha256sum -c .grokbuild/4314f.sha256
          node --check js/spacenet/app.js
          node --check api/space.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4314f.yml
          git add -A
          git commit -q -m "4314: globe wheel/pinch zooms toward the cursor; a globe landing eases to the nearest listed cluster within 150 km or stays with tiles and an honest hint (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
