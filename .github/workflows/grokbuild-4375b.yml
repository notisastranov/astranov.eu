name: grokbuild 4375b (order-copied vendors stay off the public field and the IP fly-to; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4375b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix81, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "0f708f690b5928060ebfd32b542bbc4082deda93" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix81.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "f029501979fdd1362b814b3b97f1aeaadebbc8a96b1a35d11301fde21641cecd"
          gunzip -c /tmp/f.gz > /tmp/fix81.patch
          test "$(sha256sum /tmp/fix81.patch | cut -d' ' -f1)" = "114b06e3dd5d6cd4420ac18a09d355eb8ca428cb6d192530203461da3d346c4c"
          git rm -rq .grokbuild .github/workflows/grokbuild-4375b.yml
          git apply --index /tmp/fix81.patch
          node --check js/spacenet/app.js
          grep -q '^4375$' VERSION
          T="$(git write-tree)"
          test "$T" = "f336aa9427452626fe719b051c635f93470a41e8" || { echo "tree $T"; exit 1; }
          git commit -q -m "4375b: a vendor copied out of an order (Pizzarium test job) is not a public listing: off the guest field and never the IP-start fly-to; admin and owner still see it; stamps stay 4375"
          git push origin HEAD:grokbuild/4328-street-level-gps
