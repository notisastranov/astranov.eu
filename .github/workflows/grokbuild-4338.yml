name: grokbuild 4338 no city blink, numbered readable FIND pins (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4338.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main; decode kit41; apply fix41 + stamp 4338; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "b2b228dd8755f6f0a6b1b006313b4bca13292c84" || { echo "main moved"; exit 1; }
          if ! git merge-base --is-ancestor "$MAIN" HEAD; then
            git merge origin/main -m "merge main under 4338 preview" -X ours
          fi
          git merge-base --is-ancestor "$MAIN" HEAD
          grep -q 'sn-architect' index.html
          grep -q 'var VER = "4337"' js/spacenet/app.js
          test -f .grokbuild/kit41.p00.hex
          python3 - <<'PYHEX'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io
          raw = bytes.fromhex("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit41.p*.hex"))))
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "cc328e5f4177f828cf27e7c7111c581c43b93c96689ee0f9ec2376d66af9268c": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "ab2c074f4c0a44b98d13d37598191e64121b6e84c2d9aa22bdf5f7bcd2e454fb": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYHEX
          python3 .grokbuild/k/fix41_client.py js/spacenet/app.js
          bash .grokbuild/k/stamp4338.sh
          printf '4338\n' > VERSION
          cp .grokbuild/k/tests41/headed_wheel_xdotool.js tests/headed_wheel_xdotool.js
          cp .grokbuild/k/tests41/pw_hunt_replace.js tests/pw_hunt_replace.js
          grep -q 'app.js?v=4338' index.html
          grep -q 'auth.js?v=4338' index.html
          grep -q 'name="astranov-build" content="4338"' index.html
          grep -q 'id="ver">V4338' index.html
          grep -q 'var VER = "4338"' js/spacenet/app.js
          grep -q '__SN_4338 = true' js/spacenet/app.js
          grep -q 'var VER = "4338"' sw.js
          grep -q 'sn-shell-4338' sw.js
          grep -q 'TREE LOCK 4338' sw.js
          grep -q 'latest: "4338"' api/version.js
          grep -q '4338-real' vercel.json
          grep -qx '4338' VERSION
          grep -q 'function solveCursor' js/spacenet/app.js
          grep -q 'globeHeld' js/spacenet/app.js
          grep -q 'debug=wheel' js/spacenet/app.js
          grep -q 'function fitHunt' js/spacenet/app.js
          grep -q 'function mapVisBox' js/spacenet/app.js
          grep -q 'function huntPending' js/spacenet/app.js
          grep -q 'function huntOrigin' js/spacenet/app.js
          grep -q 'function safeReload' js/spacenet/app.js
          grep -q 'function streetKey' js/spacenet/app.js
          grep -q 'Power · offers on' js/spacenet/app.js
          grep -q 'progMoveUntil' js/spacenet/app.js
          grep -q 'sn-pick.nothumb' js/spacenet/app.js
          grep -q 'function cityWheel' js/spacenet/app.js
          grep -q 'function wheelLog' js/spacenet/app.js
          grep -q 'function placeXhair' js/spacenet/app.js
          grep -q 'function snapDrawn' js/spacenet/app.js
          grep -q 'function declutterPins' js/spacenet/app.js
          grep -q 'function nameField' js/spacenet/app.js
          grep -q 'function geocodeFast' js/spacenet/app.js
          grep -q 'function placePowerTag' js/spacenet/app.js
          grep -q 'scrollWheelZoom: false' js/spacenet/app.js
          grep -q 'basemaps.cartocdn.com' js/spacenet/app.js
          grep -q 'var wasShown = ' js/spacenet/app.js
          grep -q 'var MAP_PAPER = ' js/spacenet/app.js
          grep -q 'function findOrder' js/spacenet/app.js
          grep -q 'var DECL_SLOTS' js/spacenet/app.js
          grep -q 'sn-ph-no' js/spacenet/app.js
          grep -q 'class="sn-no"' js/spacenet/app.js
          grep -q 'sn-lead' js/spacenet/app.js
          grep -q 'no globe frame' tests/headed_wheel_xdotool.js
          grep -q 'every pin shows its FIND row number' tests/headed_wheel_xdotool.js
          grep -q 'type: "sn-sw"' sw.js
          if grep -q 'c.navigate(' sw.js; then echo 'sw still navigates clients'; exit 1; fi
          grep -q 'HEADED ALL PASS' tests/headed_wheel_xdotool.js
          grep -q 'Athens: map centre within 0.2' tests/pw_hunt_replace.js
          if grep -qE 'v=4337|"4337"|sn-shell-4337|4337-real|V4337|__SN_4337|TREE LOCK 4337' index.html sw.js api/version.js vercel.json js/spacenet/app.js; then echo 'stale 4337 stamp'; exit 1; fi
          if grep -qx '4337' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check sw.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4338.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4338.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js api/version.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js
          git status --short | head -40
          git commit -q -m "4338: an open city map never blinks back to the globe (no hide/wait when the map is already showing; tiles in flight show map paper), FIND pins carry a number badge equal to their FIND row and a readable name: crowded faces move to a free slot with a leader line to the real spot, no overlaps; headed test samples every frame (pixels <=25 ms + rAF) across fits and Rhodes to Athens and asserts zero globe frames (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
