name: grokbuild 4323 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Merge main 4322, resolve, fix, restamp 4323, verify, drop kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "d8b447f44ecdb95e19f548784241b0b8c91d62cf" || { echo "main moved past 4322; remine before restamping"; exit 1; }
          git merge -q --no-edit "$MAIN" || true
          python3 .grokbuild/resolve.py
          python3 .grokbuild/fix18.py
          bash .grokbuild/stamp2.sh 4323
          python3 .grokbuild/verify.py
          for f in js/spacenet/app.js api/find.js api/ai.js api/space.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4322.yml
          git add -A
          git commit -q -m "4323: merge main 4322; keep talk-city + tester/order honesty; offer X closes; HERE Apply never creates orders; driver YOU for pickup; orphan jobs dismissible; LIVE counts real open only; stamp lockstep (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
