name: grokbuild 4422 (Syntagma+suite items 2-6; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4422.b64", ".github/workflows/grokbuild-4422.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4422
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f9466e672eb59d311befd8578f88f1a6fe73cbb6" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4422.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "4dff10a99b7f8f68737955e2c3b3582594783c0ee570a6e690a2ff68a99fbf51"
          mkdir -p /tmp/f4422 && tar -xzf /tmp/f.tgz -C /tmp/f4422
          test "$(wc -c < /tmp/f4422/js/spacenet/app.js)" = "59250"
          test "$(cat /tmp/f4422/VERSION)" = "4422"
          grep -q '__SN_4422' /tmp/f4422/js/spacenet/app.js
          grep -q 'landmark' /tmp/f4422/js/spacenet/app.js
          grep -q 'SpaceNet V4422' /tmp/f4422/index.html
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4422.yml || true
          T0="$(git write-tree)"
          test "$T0" = "39622ba03ce20c8b504b954d5f40b961e5c8ae2b" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f4422/VERSION VERSION
          cp /tmp/f4422/index.html index.html
          cp /tmp/f4422/sw.js sw.js
          cp /tmp/f4422/vercel.json vercel.json
          cp /tmp/f4422/js/spacenet/app.js js/spacenet/app.js
          git add VERSION index.html sw.js vercel.json js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "2cff731dbb7b73fe4fb0d081ef0abb116780dd03" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4422: Syntagma Athens street zoom; hunt Greece-only; CALL toast; order HOLD; lockstep.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
