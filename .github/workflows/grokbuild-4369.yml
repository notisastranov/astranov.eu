name: grokbuild 4369 (grip follows the card edge, Overpass mirrors alternate; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4369.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix71, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "0906136cd76fd5bf4d085767fbb84b3472b84099" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix71.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "664c3220fbc962fb4809be14de0a642e0403f4882028f8e72a9e6765e1a4e6a6"
          gunzip -c /tmp/f.gz > /tmp/fix71.patch
          test "$(sha256sum /tmp/fix71.patch | cut -d' ' -f1)" = "d59a972e3b714e43576763dd6cd30af269eaa8cc7df5f241a64270b457b4e566"
          git rm -rq .grokbuild .github/workflows/grokbuild-4369.yml
          git apply --index /tmp/fix71.patch
          node --check js/spacenet/app.js
          grep -q '^4369$' VERSION
          T="$(git write-tree)"
          test "$T" = "2cd6f28c075f9615cf889d551fe45f21eb8850d4" || { echo "tree $T"; exit 1; }
          git commit -q -m "4369: the dock grip follows the card edge every frame while the sheet springs (the card top rose over a grip placed once, leaving 8 visible rows); land-then-hunt shares one Overpass budget so its 2 tries use mirror 0 then mirror 1; lockstep 4369"
          git push origin HEAD:grokbuild/4328-street-level-gps
