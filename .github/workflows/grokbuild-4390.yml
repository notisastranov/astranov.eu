name: grokbuild 4390 (merge main c5deee9e V4383; readable pin labels; stamps 4390; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4390.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix106, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "63344c8012f410bbb3f92855f92d8fc70225838c" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e c5deee9e2bc89bdd6704d7d138b40a98b07cdf59^{commit}
          base64 -d .grokbuild/fix106.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "f5a754a000c9fafb8b51cd903f3ef539cab2ef74b40c5d6450eb57d5b0e3123c"
          gunzip -c /tmp/f.gz > /tmp/fix106.patch
          test "$(sha256sum /tmp/fix106.patch | cut -d' ' -f1)" = "5b2f8364bc531190f8991379d32e4cfa0b6d11be2e808244d4244c2e636854d2"
          git rm -rq .grokbuild .github/workflows/grokbuild-4390.yml
          git apply --index /tmp/fix106.patch
          node --check js/spacenet/app.js
          grep -q '^4390$' VERSION
          T="$(git write-tree)"
          test "$T" = "f274dbb46db83caf089dca4bdfdd5d5aa5072811" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p c5deee9e2bc89bdd6704d7d138b40a98b07cdf59 -m "Merge main (c5deee9e: V4383 10px handles law, sw/api version 4382 stamps) into the branch engine. Took nothing in code: the branch has no handle-hiding law and its handles already render at 10px; main literals superseded by branch lockstep (api/version reads VERSION). No hide-all block. Pin labels readable: two lines up to 112px, short first-word label when crowded, full name in title/aria. Lockstep 4390")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
