name: grokbuild 4363 (merge main 5dcae8c2, locate, 10px grip, stamps 4363; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4363.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix65, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "a33d95d35a57ebdf43590762ebafc4818e845fa7" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 5dcae8c26f34237674efdc0a6ccbb2b7e4d771ff^{commit}
          base64 -d .grokbuild/fix65.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "7442169813701698071945e48c8b0d7d8778248f1c7c931c51772924657b79e5"
          gunzip -c /tmp/f.gz > /tmp/fix65.patch
          test "$(sha256sum /tmp/fix65.patch | cut -d' ' -f1)" = "3b62ed6f5c5d9794af8d356d57315a5669a6dd116a29f7b0e3c93b0cea960aec"
          git rm -rq .grokbuild .github/workflows/grokbuild-4363.yml
          git apply --index /tmp/fix65.patch
          node --check js/spacenet/app.js
          grep -q '^4363$' VERSION
          T="$(git write-tree)"
          test "$T" = "7c13761951f7abec45d462f1296614526ceebec3" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 5dcae8c26f34237674efdc0a6ccbb2b7e4d771ff -m "Merge main (5dcae8c2, 4360-real incl. 3e91c78) keeping the branch app.js / index / sw (tickNews stub, !holdOk guard); 4363: locate / where is / zoom to use the land path (GR_CITY then /api/find), never the AI; dock grip 10 px tall; lockstep 4363")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
