name: Invoke supabase vercel-push
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tree lock (no overlay scripts)
        run: |
          set -e
          if grep -E 'spacenet/(earth-|money-|pay-|fill-|talk-|land-|pizza-|auth-[0-9]|sn-shell-)' index.html; then
            echo "TREE LOCK fail: overlay in index.html" >&2
            exit 1
          fi
          n=$(grep -c 'script src="/js/spacenet/' index.html || true)
          if [ "$n" -gt 2 ]; then
            echo "TREE LOCK fail: $n spacenet scripts (max 2: app.js auth.js)" >&2
            exit 1
          fi
          echo "TREE LOCK ok"
          if ! grep -q 'sb-anon' api/space.js; then
            echo "ANON LOCK fail: api/space.js must require lib/sb-anon" >&2
            exit 1
          fi
          if ! grep -q 'public-config' lib/sb-anon.js; then
            echo "ANON LOCK fail: lib/sb-anon.js must fall back to edge public-config" >&2
            exit 1
          fi
          node -e "require('./api/sms.js'); require('./api/space.js'); require('./lib/sb-anon.js');"
      - name: Invoke (keys stay in Supabase)
        run: |
          curl -sS --max-time 150 -X POST "https://lkoatrkhuigdolnjsbie.supabase.co/functions/v1/vercel-push" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
          echo
