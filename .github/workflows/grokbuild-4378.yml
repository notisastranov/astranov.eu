name: grokbuild 4378 (empty cards wrap in the card range, true hunt radius in the text, quiet Enter-release guard, LIST card titled with the place; stamps 4378; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4378.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix87, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "b722d3cde3c711620f016601fac515f6723249d4" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix87.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "3b020d18f570f322aac2e69bbce134a15c50bf4e6ffc5a07fd16497ca3c360db"
          gunzip -c /tmp/f.gz > /tmp/fix87.patch
          test "$(sha256sum /tmp/fix87.patch | cut -d' ' -f1)" = "0b5eec741015144025ee54badecd40938594480b029c5839b9e7c746f6359e35"
          git rm -rq .grokbuild .github/workflows/grokbuild-4378.yml
          git apply --index /tmp/fix87.patch
          node --check js/spacenet/app.js
          grep -q '^4378$' VERSION
          T="$(git write-tree)"
          test "$T" = "68da9e39f3cc0b79d3718fb9ad52e30b012129b6" || { echo "tree $T"; exit 1; }
          git commit -q -m "4378: empty and message cards keep a 280-340 px width and wrap whole words; the empty FIND text names the radius really searched (10 km near, 40 km city; client city cap now 40 like the server); __snSubmits no longer logs the guard's routine Enter-release keyup; the hold LIST card is titled with the street / area under the hold point (reverse geocode via /api/find), Here until then; lockstep 4378"
          git push origin HEAD:grokbuild/4328-street-level-gps
