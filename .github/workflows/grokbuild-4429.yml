name: grokbuild 4429 (real-input handoff z6-7 + cursor aim + view watchdog + Esc YOU; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4429.b64", ".github/workflows/grokbuild-4429.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4429
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4429.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "3680dccaa2c48250c331080a94b44f06ee907273f6891f1272d0a303cf8de040"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "268277"
          grep -q 'handoffZoom' /tmp/f/js/spacenet/app.js
          grep -q '__SN_4429' /tmp/f/js/spacenet/app.js
          grep -q '__SN_ESC_ME4429' /tmp/f/js/spacenet/auth.js
          grep -q 'V4429' /tmp/f/index.html
          grep -q 'sn-shell-4429' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4429.yml || true
          T0="$(git write-tree)"
          test "$T0" = "c6df4fb69dc0b4d5fa2fcce11e0b493be8090a5a" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          git add index.html sw.js js/spacenet/app.js js/spacenet/auth.js
          T="$(git write-tree)"
          test "$T" = "915c500d7ad67cc990271941a274e9828ec5bf50" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4429: real-input handoff at globe-matched z6-7 (+1 z/notch); cursor hit wins over GPS Athens; view visibility watchdog/heal; Esc closes YOU/PROFILE/LIST (capture); lockstep 4429.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
