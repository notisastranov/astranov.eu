name: grokbuild 4409b (vercel stamp lockstep 4409; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4409b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4409b stamps
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          echo "main tip $MAIN_TIP"
          base64 -d .grokbuild/fix4409b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "b1c5624ff6e0a06e691880ddf11c9644d66c164f6872f89f695ee2ef16fe2130"
          gunzip -c /tmp/f.gz > /tmp/fix4409b.patch
          test "$(sha256sum /tmp/fix4409b.patch | cut -d' ' -f1)" = "13d4b2d3bce5288a7f4c38460c427e7b3704d2044a6f628b02bea7d722387da0"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4409b.yml || true
          git rm -f .github/workflows/grokbuild-4409.yml || true
          T0="$(git write-tree)"
          test "$T0" = "d8e457ba96f235f08023f82ae83d3a126eae4af1" || { echo "tree0 $T0 want d8e457ba96f235f08023f82ae83d3a126eae4af1"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4409b.patch
          grep -q '"4409"' vercel.json
          grep -q '4409-real' vercel.json
          ! grep -q '"4408"' vercel.json
          ! grep -q '4408-real' vercel.json
          T="$(git write-tree)"
          test "$T" = "34d56f24ef89f60d8c3218be38add83139a62c62" || { echo "tree $T want 34d56f24ef89f60d8c3218be38add83139a62c62"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4409b: vercel X-Astranov-Build/Ship lockstep 4409/4409-real (missed in 4409 kit). Branch only. Lockstep 4409")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
