name: grokbuild 4409 (fit chrome, wallet slot, hold still, deterministic cull; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4409.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4409 as merge commit, assert trees, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          echo "main tip $MAIN_TIP"
          base64 -d .grokbuild/fix4409.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "ac45cb6e8a8aedd83b5cdd056c212fdeac7ebd5b1fda9eb96890b6357bfdbf89"
          gunzip -c /tmp/f.gz > /tmp/fix4409.patch
          test "$(sha256sum /tmp/fix4409.patch | cut -d' ' -f1)" = "6d2de53e8d643ab5f5dce7f955ca7100dd2de57a6d2c288e088e4dd6aeefd5e0"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4409.yml || true
          git rm -f .github/workflows/grokbuild-4408.yml || true
          git rm -f .github/workflows/grokbuild-4408b.yml || true
          git rm -f .github/workflows/grokbuild-4408c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "c5910bd8a533d5b0702b12e3428c8fac3825ad72" || { echo "tree0 $T0 want c5910bd8a533d5b0702b12e3428c8fac3825ad72"; git log --oneline -5; exit 1; }
          git apply --index /tmp/fix4409.patch
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          grep -q '^4409$' VERSION
          grep -q '__SN_4409' js/spacenet/app.js
          grep -q '4409: a hold opens the card without moving' js/spacenet/app.js
          grep -q 'fold HUD chrome into the visible box' js/spacenet/app.js
          grep -q 'WALLET caption owns its own slot' js/spacenet/app.js
          grep -q 'projected face boxes' js/spacenet/app.js
          grep -q 'stable order for the same seat' js/spacenet/app.js
          grep -q 'account panel' js/spacenet/auth.js
          grep -q 'sn_my_balance' js/spacenet/app.js
          test -f favicon.ico
          T="$(git write-tree)"
          test "$T" = "d8e457ba96f235f08023f82ae83d3a126eae4af1" || { echo "tree $T want d8e457ba96f235f08023f82ae83d3a126eae4af1"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4409: search fitBounds pads chrome at every width; place-label veil + chrome in declutter; WALLET caption own slot; deterministic cull/cluster; hold opens card without pan. Keep 4408 remine passes. Lockstep 4409")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
