name: grokbuild 4434 (map wheel lock + tile keep + HUD + SW keep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4434.b64", ".github/workflows/grokbuild-4434.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4434
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4434.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "9e394fad5283ae20891a818545ba4b87f22f1a44de86415dc7d4388f11a5f4e5"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "300927"
          grep -q '__SN_4434' /tmp/f/js/spacenet/app.js
          grep -q 'never re-hit the globe' /tmp/f/js/spacenet/app.js
          grep -q 'ensureBackLayer' /tmp/f/js/spacenet/app.js
          grep -q 'setZoomAround(L.point' /tmp/f/js/spacenet/app.js
          grep -q 'sn-4434-hud' /tmp/f/index.html
          grep -q 'content="4434"' /tmp/f/index.html
          grep -q 'sn-shell-4434' /tmp/f/sw.js
          grep -q 'keep the current registration' /tmp/f/sw.js || grep -q 'keep this version' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4434.yml || true
          T0="$(git write-tree)"
          test "$T0" = "f6bd9bc499ba2a840005758ffbe9765a2c970414" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "e91b0e683b275a809861007a246fe7f89ce690f0" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4434: map wheel keeps locked globe anchor (setZoomAround containerPoint + panBy <=3px; no Leaflet scrollWheelZoom; no re-hit); OSM backdrop + keep prior tiles; HUD line above drawer; one SW registration, old caches only; lockstep 4434.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
