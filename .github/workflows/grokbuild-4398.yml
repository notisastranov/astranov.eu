name: grokbuild 4398 (trade+place hunt, merge main 4388; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4398.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix115, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "549deb0ed33198f627829d541a50e5baa8f050ec" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e 2fa791618facd90bfeb396a3bb2e3d82a9ab64c8^{commit}
          base64 -d .grokbuild/fix115.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "69b28715e9303680543028e90270b4d459920f86d4a1587830194a462dded336"
          gunzip -c /tmp/f.gz > /tmp/fix115.patch
          test "$(sha256sum /tmp/fix115.patch | cut -d' ' -f1)" = "cf2cf980bed1ffb18f4da9d84a162041c5e234c52fdddf3dba64625190fd5b6a"
          git rm -rq .grokbuild .github/workflows/grokbuild-4398.yml
          git apply --index /tmp/fix115.patch
          node --check js/spacenet/app.js
          grep -q '^4398$' VERSION
          T="$(git write-tree)"
          test "$T" = "52fd1e2cb7752045f2ba0bc470868ad8012d95c0" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 2fa791618facd90bfeb396a3bb2e3d82a9ab64c8 -m "4398: \"supermarket Heraklion\" / \"Heraklion supermarkets\" land on the place and hunt there; plural trade words hunt at the seat; crew/host/datanet commands on the command line. Merge main 2fa79161 (4388 DataNet and Host pages); branch engine wins. Lockstep 4398")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
