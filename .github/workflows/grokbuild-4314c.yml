name: grokbuild 4314c apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix9.py
          sha256sum -c .grokbuild/4314c.sha256
          node --check js/spacenet/app.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4314c.yml
          git add -A
          git commit -q -m "4314: place-only asks land via the place path; no stale FIND sheet over a newer ask (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
