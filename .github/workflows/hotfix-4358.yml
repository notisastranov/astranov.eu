name: grokbuild hotfix 4358 (restore index.html; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/hotfix-index-4358"]
    paths: [".grokbuild/**", ".github/workflows/hotfix-4358.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/hotfix-index-4358
          fetch-depth: 0
      - name: Apply fixH, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "6b1926e74333455041c7c72a9c160fb6d77f204a" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fixH.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "7cc251fb06c5199cc7f1277bcf6828b70637da71a04a0d154d8f92ac57e5bfef"
          gunzip -c /tmp/f.gz > /tmp/fixH.patch
          test "$(sha256sum /tmp/fixH.patch | cut -d' ' -f1)" = "45da44e0bd829759c94731622bcd289cadb5bf8f30f5067ff2e29bdbf4cb25c9"
          git rm -rq .grokbuild .github/workflows/hotfix-4358.yml
          git apply --index /tmp/fixH.patch
          for f in js/spacenet/app.js sw.js api/version.js; do node --check $f; done
          grep -q '</html>' index.html
          if grep -q 'truncated for this message' index.html; then exit 1; fi
          test "$(git write-tree)" = "06016514b8a8c0685d4e5e4676cf2a5fd48959f3" || { echo "tree $(git write-tree)"; exit 1; }
          git commit -q -m "4358 hotfix: restore the full index.html from 4356 (7df85da8) over the truncated 6b1926e (no </html>, no app/auth scripts, no #dock); keep 71ea963's 10px drag handles; tickNews stub so the frame loop paints the globe; lockstep 4358"
          git push origin HEAD:grokbuild/hotfix-index-4358
