name: grokbuild 4379 (merge main 48d007f7 V4374 keyless OSM + top/island/me CSS; stamps 4379 incl. headers; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4379.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix89, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "f8048d11e51e157e86c95f83792b9081f9847635" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 48d007f79f1dac15407e22c2c9384630cce265df^{commit}
          base64 -d .grokbuild/fix89.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "36da0b667f5a6a943c257dd1f578ce546d83b00a85b5dc8365dc94c597444c2e"
          gunzip -c /tmp/f.gz > /tmp/fix89.patch
          test "$(sha256sum /tmp/fix89.patch | cut -d' ' -f1)" = "adb132d0166b500857032a436aedeb0e05e96cf45e86beb6292e1affa895baa8"
          git rm -rq .grokbuild .github/workflows/grokbuild-4379.yml
          git apply --index /tmp/fix89.patch
          node --check js/spacenet/app.js
          grep -q '^4379$' VERSION
          T="$(git write-tree)"
          test "$T" = "80704c847d69a4ab4631136fca795ac1765c111a" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 48d007f79f1dac15407e22c2c9384630cce265df -m "Merge main (48d007f7: V4374 keyless OpenStreetMap streets) into the branch engine; kept the branch keyless map looks (OSM / openstreetmap.de, Esri satellite, CSS dark, key-wall detect) over main's OSM-only tileSpec; ported main's sn-4374 top / island / tasks / YOU-button CSS; lockstep 4379 including the X-Astranov-Build / Ship headers")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
