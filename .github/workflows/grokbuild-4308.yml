name: grokbuild 4308 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Merge main 4307, fix, restamp, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          git merge -q --no-edit -X theirs e9d8396503b9b937b3675a345064a65445aa183d
          python3 .grokbuild/fix2.py
          bash .grokbuild/stamp.sh 4308
          sha256sum -c .grokbuild/4308.sha256
          for f in js/spacenet/app.js api/find.js api/ai.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4308.yml
          git add -A
          git commit -q -m "4308: Talk pins named cities without GPS + Overpass fallback + stamp align (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
