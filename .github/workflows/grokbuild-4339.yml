name: grokbuild 4339 merge main 4330, hunts + LIVE count + LATEST from VERSION + sheet grip + session keep (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4339.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Merge main 4330; decode kit42; apply fix42 + stamp 4339; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved"; exit 1; }
          if ! git merge-base --is-ancestor "$MAIN" HEAD; then
            git merge origin/main -m "merge main 4330 under 4339 preview" -X ours
          fi
          git merge-base --is-ancestor "$MAIN" HEAD
          git log --oneline -3
          grep -q 'sn-architect' index.html
          grep -q 'var VER = "4338"' js/spacenet/app.js
          test -f .grokbuild/kit42.p00.hex
          python3 - <<'PYHEX'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io
          raw = bytes.fromhex("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit42.p*.hex"))))
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "89473c9ad2bc4b992df5bad83be654fda1149391adde64882eedb813e66d8c4c": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "364ee907d8f16a0076ec3e1c8c49615ecf37ba9d70643db51c8cc1600271470b": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYHEX
          python3 .grokbuild/k/fix42_client.py
          bash .grokbuild/k/stamp4339.sh
          cp .grokbuild/k/tests42/headed_wheel_xdotool.js tests/headed_wheel_xdotool.js
          cp .grokbuild/k/tests42/pw_hunt_replace.js tests/pw_hunt_replace.js
          grep -q 'app.js?v=4339' index.html
          grep -q 'auth.js?v=4339' index.html
          grep -q 'name="astranov-build" content="4339"' index.html
          grep -q 'id="ver">V4339' index.html
          grep -q 'var VER = "4339"' js/spacenet/app.js
          grep -q '__SN_4339 = true' js/spacenet/app.js
          grep -q 'location.href = "/?v=4339&' js/spacenet/app.js
          grep -q 'var VER = "4339"' sw.js
          grep -q 'sn-shell-4339' sw.js
          grep -q 'TREE LOCK 4339' sw.js
          grep -q '4339-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4339"' vercel.json
          grep -qx '4339' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          if grep -qE 'latest: "[0-9]' api/version.js; then echo 'hardcoded latest'; exit 1; fi
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4339"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          if grep -q 'sn-handle-law' index.html; then echo '4330 setInterval law still in index'; exit 1; fi
          if grep -q 'setInterval(law' index.html; then echo '4330 setInterval law still in index'; exit 1; fi
          if grep -q '#sn-topchrome-drag,#cli-drag{display:block!important' index.html js/spacenet/app.js; then echo '4330 handle css still forced'; exit 1; fi
          grep -q 'function armGrip' js/spacenet/app.js
          grep -q 'cli-drag.sn-grip.on' js/spacenet/app.js
          grep -q 'var liveNet = 0' js/spacenet/app.js
          grep -q 'var unseated = ' js/spacenet/app.js
          grep -q 'keepK = \["sn:user"' js/spacenet/app.js
          grep -q 'sign-in return in flight' js/spacenet/app.js
          grep -q 'limit=" + (lim || 16)' js/spacenet/app.js
          grep -q 'function hits(r)' js/spacenet/app.js
          grep -q 'function refresh()' js/spacenet/auth.js
          grep -q 'sn:refresh' js/spacenet/auth.js
          grep -q 'btn.setAttribute("aria-label"' js/spacenet/auth.js
          grep -q 'function solveCursor' js/spacenet/app.js
          grep -q 'globeHeld' js/spacenet/app.js
          grep -q 'function fitHunt' js/spacenet/app.js
          grep -q 'function huntPending' js/spacenet/app.js
          grep -q 'function safeReload' js/spacenet/app.js
          grep -q 'function geocodeFast' js/spacenet/app.js
          grep -q 'function huntSeatOk' js/spacenet/app.js
          grep -q 'function declutterPins' js/spacenet/app.js
          grep -q 'var wasShown = ' js/spacenet/app.js
          grep -q 'var MAP_PAPER = ' js/spacenet/app.js
          grep -q 'function findOrder' js/spacenet/app.js
          grep -q 'var DECL_SLOTS' js/spacenet/app.js
          grep -q 'class="sn-no"' js/spacenet/app.js
          grep -q 'function isTestFixture' js/spacenet/app.js
          grep -q 'function testView' js/spacenet/app.js
          grep -q 'type: "sn-sw"' sw.js
          if grep -q 'c.navigate(' sw.js; then echo 'sw still navigates clients'; exit 1; fi
          grep -q 'HEADED ALL PASS' tests/headed_wheel_xdotool.js
          grep -q 'athens → bare supermarket' tests/headed_wheel_xdotool.js
          grep -q 'xdotool drag down shrinks the sheet' tests/headed_wheel_xdotool.js
          grep -q "Athens → 'supermarket': >= 9 real pins" tests/pw_hunt_replace.js
          grep -q 'stored session shape restores on reload' tests/pw_hunt_replace.js
          if grep -qE 'v=4338|"4338"|sn-shell-4338|4338-real|V4338|__SN_4338|TREE LOCK 4338' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4338 stamp'; exit 1; fi
          if grep -qE 'v=4330"|V4330|4330-real|content="4330"' index.html vercel.json; then echo 'stale 4330 stamp from main'; exit 1; fi
          if grep -qx '4338' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4339.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4339.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js js/spacenet/auth.js api/version.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js
          git status --short | head -40
          git commit -q -m "4339 on main 4330: hunts land fast with real named pins (no IP seat, place clears, bare query hunts the landed place, 16 Nominatim rows), LIVE counts the real public network when only an IP guess exists, LATEST reads VERSION via /api/version, the dock handle is a real sheet grip (96px..42vh, rides the sheet top, clear of LIVE; top handle and the 2 s setInterval law removed), sign-in kept across reload and SPACENET reset (refresh token, aria-label follows state), FIND badges reserved in declutter; tests: Athens then bare supermarket >= 9, grip drag, session shape, TESTER hidden (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
