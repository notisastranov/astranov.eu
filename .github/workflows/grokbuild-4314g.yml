name: grokbuild 4314g apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4307-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4307-talk-city-pins
          fetch-depth: 0
      - name: Fix, verify sha256, drop the kit, commit
        run: |
          set -e
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          python3 .grokbuild/fix13.py
          sha256sum -c .grokbuild/4314g.sha256
          node --check js/spacenet/app.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4314g.yml
          git add -A
          git commit -q -m "4314: a bare city/place word in Talk (Athina, Rodos, Αθήνα, Nairobi) lands via the named-place path before Grok; Grok only when no confident geocode (preview, do not merge)"
          git push origin HEAD:grokbuild/4307-talk-city-pins
