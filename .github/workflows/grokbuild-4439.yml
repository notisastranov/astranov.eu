name: grokbuild 4439 (hold decided on release; wheel lock break 32 px + lock audit; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4439.b64", ".github/workflows/grokbuild-4439.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4439
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4439.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "2f47471c02539bcd512a5cede5181fe0d066563b5ccfe4aaf6d78e543d614234"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "311385"
          grep -q '__SN_4439' /tmp/f/js/spacenet/app.js
          grep -q '__SN_ESC_EARLY4439' /tmp/f/js/spacenet/app.js
          grep -q 'WHEEL_LOCK_MAX_MS' /tmp/f/js/spacenet/app.js
          grep -q 'HOLD_GRACE_MS' /tmp/f/js/spacenet/app.js
          grep -q 'WHEEL_BREAK_PX = 32' /tmp/f/js/spacenet/app.js
          grep -q 'content="4439"' /tmp/f/index.html
          grep -q 'sn-shell-4439' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4439.yml || true
          T0="$(git write-tree)"
          test "$T0" = "f4319135243a7cf649e3dc41e29c6c713977fbae" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "0a4589c382b6f9aef4ecfbdef3f3d034dc16e214" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4439: globe/map hold decided on release too (>= HOLD_MS-250 ms still press opens LIST; timer lagged behind a 1.5 s release on a busy globe frame); wheel lock break 12->32 px so a ~20 px re-aim between n1 and the burst keeps the n1 anchor; LOCKLOG clear entries carry from/to client px + distance and ?debug=1 shows locks/clears/lastClear; 4438 Esc and 4437 zoom unchanged; lockstep 4439.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
