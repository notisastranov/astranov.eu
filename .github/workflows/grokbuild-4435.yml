name: grokbuild 4435 (LIST above search bar + SW cache fill; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4435.b64", ".github/workflows/grokbuild-4435.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4435
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4435.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "6ec871022ddb20f575df00a4dffbafe77909294bd35179af905696fb6fc63dbd"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "301969"
          grep -q '__SN_4435' /tmp/f/js/spacenet/app.js
          grep -q 'placeSheet' /tmp/f/js/spacenet/app.js
          grep -q 'sn-4435-sheet' /tmp/f/index.html
          grep -q 'content="4435"' /tmp/f/index.html
          grep -q 'sn-shell-4435' /tmp/f/sw.js
          grep -q 'do not include /index.html' /tmp/f/sw.js
          grep -q 'fillCache' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4435.yml || true
          T0="$(git write-tree)"
          test "$T0" = "e91b0e683b275a809861007a246fe7f89ce690f0" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "ceec46140232c2e38c0d3b5f91780eca430fde26" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4435: LIST sheet sits above the floating search bar (VENDOR/CLIENT/DRIVER visible); SW install fills sn-shell-4435 per-asset (no addAll abort on /index.html 308); lockstep 4435.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
