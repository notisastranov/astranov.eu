name: grokbuild 4381 (precise fresh fix for near me, hunt ids + 15 s reply, tester strip admin-only; stamps 4381; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4381.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix96, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "bcb71c33c27bedbc8ebae6641eb7a8afbf77986e" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix96.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "1d5431c05dc63ee18d0ff664d6ba53210a75e1dafb63666631cb87da7d8790d1"
          gunzip -c /tmp/f.gz > /tmp/fix96.patch
          test "$(sha256sum /tmp/fix96.patch | cut -d' ' -f1)" = "ba1c6bb603267f0103e0c6848229cdd11f666192f0d953180a0dce0e1ab6a7f0"
          git rm -rq .grokbuild .github/workflows/grokbuild-4381.yml
          git apply --index /tmp/fix96.patch
          node --check js/spacenet/app.js
          grep -q '^4381$' VERSION
          T="$(git write-tree)"
          test "$T" = "65c46f3bdfc96a70cf524da9e7b3c787dd24d188" || { echo "tree $T"; exit 1; }
          git commit -q -m "4381: near me needs a precise (<= 2 km accuracy) fix under 30 min old, else location not shared; coarse network fixes (IP-derived, e.g. Ashburn) are never stored as a fix; each hunt carries an id and an older hunt never renders or speaks; every hunt answers within 15 s (pins or an honest 0); the TESTER strip shows only for admins or ?testview=1; lockstep 4381"
          git push origin HEAD:grokbuild/4328-street-level-gps
