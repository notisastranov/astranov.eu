name: grokbuild 4382 (merge main ebf26b7b V4377; helper ported, ribbon and YOU kept, owner-only shop tools, no phantom CHARGED, fixtures and broken images hidden, stars; stamps 4382; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4382.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix97, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "4f4420a1204eb5eedb9f90cfa043f6a02ecd71cf" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e ebf26b7b5be5102783a5b328d61b23c420202079^{commit}
          base64 -d .grokbuild/fix97.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "f6c382b8c8d4668ce056a2c59f194646fb922bf2dbfaea32219b53252004f79f"
          gunzip -c /tmp/f.gz > /tmp/fix97.patch
          test "$(sha256sum /tmp/fix97.patch | cut -d' ' -f1)" = "56ddfaf2a1b89cbade847225a5060b8be1b08253a3da1d15ee4528d55151e50e"
          git rm -rq .grokbuild .github/workflows/grokbuild-4382.yml
          git apply --index /tmp/fix97.patch
          node --check js/spacenet/app.js
          grep -q '^4382$' VERSION
          T="$(git write-tree)"
          test "$T" = "e30c2938a68ad100d9f8926baba43784e54b74ca" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p ebf26b7b5be5102783a5b328d61b23c420202079 -m "Merge main (ebf26b7b: V4376 enter first + flying helper, V4377 helper blends into the sky) into the branch engine. Took the winged helper (signed-in) with Scan / Monitor / Wallet / Streets, its radar and device strip, the scan / monitor / wallet / streets / globe / support line commands, body.sn-in, the Tell the helper field and MASTER_PROMPT. Skipped main hiding the ribbon, #ver, YOU, GPS, wallet and the guest field, the ENTER-only button, the 22 px pins and the second driver layer. Fixes: shop EDIT MENU / DELETE / price only for the shop owner; CHARGED only lists real orders of this account; fixtures incl. any 0000000000 label never reach FIND or pins (client-side); a failed image hides instead of a broken frame; order and offer prices read in stars. Lockstep 4382 (api/version and sw from VERSION)")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
