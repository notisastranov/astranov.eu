name: grokbuild 4328 fix29 drop mute (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4328.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Decode fix29; drop fee / mute Power / APPLY-left; restamp; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "bebfcb0961282720f416d2dd5e235c72eb5b30c0" || { echo "main moved past 4327; remine before restamping"; exit 1; }
          grep -q 'var VER = "4328"' js/spacenet/app.js
          grep -q 'goToPlaceAsk' js/spacenet/app.js
          grep -q 'function aimAt' js/spacenet/app.js
          cd .grokbuild
          : > fix29_offer_drop.py
          for f in $(ls fix29.part*.b64 | sort); do
            base64 -d "$f" >> fix29_offer_drop.py
          done
          wc -c fix29_offer_drop.py
          test "$(sha256sum fix29_offer_drop.py | awk '{print $1}')" = "e4dcd31051a405105c4363d60d3886e4eb878e82b7af38dbafe67703a094487e"
          cd ..
          python3 .grokbuild/fix29_offer_drop.py
          bash .grokbuild/stamp4328.sh
          grep -q 'function resolveDrop' js/spacenet/app.js
          grep -q 'sn:jobs-muted' js/spacenet/app.js
          grep -q 'sn:offer-x:' js/spacenet/app.js
          grep -q 'sheet-apply" data-act="hide".*JOBS' index.html
          node --check js/spacenet/app.js
          git rm -q -r .grokbuild .github/workflows/grokbuild-4328.yml || true
          git add -A
          git status --short | head -40
          git commit -q -m "4328b: drop fee from landed city (never IP when >50km); mute offers/JOBS across Power; APPLY left X right on JOBS/BUILD; no stage lines on offer (preview, do not merge)"
          git push origin HEAD:grokbuild/4328-street-level-gps
