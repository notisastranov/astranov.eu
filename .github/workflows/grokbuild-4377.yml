name: grokbuild 4377 (merge main 8670374c V4373 robot icon / city pin / globe figure; keyless tiles + key-wall detect, YOU WHERE GPS only, trade hunts, no city shop cards; stamps 4377; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4377.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix84, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "09accef415ae393e0d115dc98ef6a6c4ceb07cf0" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 8670374c34e75dd9be798900af4c39b8ead3a857^{commit}
          base64 -d .grokbuild/fix84.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "ba29305a27cd47e8f5b4a93a76907793cf4e03bc7be2aa153d270fd82208e0a6"
          gunzip -c /tmp/f.gz > /tmp/fix84.patch
          test "$(sha256sum /tmp/fix84.patch | cut -d' ' -f1)" = "394f2733f055c76a648b6627230c40f97ce6915e520f2d2447e604a812acc247"
          git rm -rq .grokbuild .github/workflows/grokbuild-4377.yml
          git apply --index /tmp/fix84.patch
          node --check js/spacenet/app.js
          grep -q '^4377$' VERSION
          T="$(git write-tree)"
          test "$T" = "5835ffee344b45d2d3c58fd9d2166552efeb56be" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 8670374c34e75dd9be798900af4c39b8ead3a857 -m "Merge main (8670374c: V4371-V4373 ZoomBall internal, vendor hours/schedule, robot icon / city pin / globe figure / YOU sheet) into the branch engine; map looks are keyless only (OSM / openstreetmap.de, Esri satellite, CSS dark) and a grey key-wall tile is detected even on 200 and swapped to openstreetmap.de; YOU WHERE shows the GPS fix or location not shared; trade words hunt instead of geocoding; a city row never renders as a shop card; roads and trails never answer a hunt; lockstep 4377")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
