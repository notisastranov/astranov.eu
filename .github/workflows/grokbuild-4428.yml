name: grokbuild 4428 (smooth per-notch zoom; burst heal; cursor anchor; LIST ✕; lockstep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4428.b64", ".github/workflows/grokbuild-4428.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4428
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4428.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "48d61f2d1cc2c702d48b498869c9e162fef8ffe8236dc602c0fcffc9bf59dea6"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "262890"
          test "$(wc -c < /tmp/f/index.html)" = "39802"
          test "$(cat /tmp/f/VERSION)" = "4428"
          grep -q '__SN_4428' /tmp/f/js/spacenet/app.js
          grep -q 'nudgeZoom' /tmp/f/js/spacenet/app.js
          grep -q 'CITY_ENTER_DIST' /tmp/f/js/spacenet/app.js
          grep -q 'ensureTiles' /tmp/f/js/spacenet/app.js
          grep -q 'r2 > 0.92' /tmp/f/js/spacenet/app.js
          grep -q '✕' /tmp/f/js/spacenet/app.js
          grep -q 'sn-4428-sheet' /tmp/f/index.html
          grep -q '4428-preview' /tmp/f/vercel.json
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4428.yml || true
          T0="$(git write-tree)"
          test "$T0" = "b00eb02b2e2f4e44da64a39b1e09f54ac9d711c9" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js; do
            cp "/tmp/f/$f" "$f"
            git add "$f"
          done
          T="$(git write-tree)"
          test "$T" = "f72d2101a887a7e9e40fddfae9d85d79925009f1" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4428: smooth per-notch zoom (no tier skip); frozen cursor zoomAnchor + limb refuse; city handoff heal/tiles; LIST APPLY+✕; lockstep 4428.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
