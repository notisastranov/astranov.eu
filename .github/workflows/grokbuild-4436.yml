name: grokbuild 4436 (network-first HTML + one SW register; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4436.b64", ".github/workflows/grokbuild-4436.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4436
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4436.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "45d0a0c53a86751a19de3c96a3ef79ff6c6d6437b2092f338e1dd201a291f7b0"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "302096"
          grep -q '__SN_4436' /tmp/f/js/spacenet/app.js
          grep -q '__SN_ESC4436' /tmp/f/js/spacenet/app.js
          grep -q 'maybeReload' /tmp/f/index.html
          grep -q 'content="4436"' /tmp/f/index.html
          grep -q 'sn-shell-4436' /tmp/f/sw.js
          grep -q 'isHtmlShell' /tmp/f/sw.js
          grep -q 'neverCache' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4436.yml || true
          T0="$(git write-tree)"
          test "$T0" = "ceec46140232c2e38c0d3b5f91780eca430fde26" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "b29db6c127dd0655e0067fe11f93eb5693dfe1de" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4436: HTML/navigations network-first (cache only offline); /api/version and sw.js never cached; ?v= assets cache-first; one SW register (?v=4436); reload at most once if SW ver is newer; lockstep 4436.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
