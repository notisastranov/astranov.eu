name: grokbuild 4414 (merge main 4407 auth + lockstep 4414; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4414.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4414
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "44278049ea88c4ae3e22e607295b19b2039c7eff" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4414.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "a30358a786bcaf26af8596289065f0f0de4f37b73c5cd9502772345c461cfd38"
          gunzip -c /tmp/f.gz > /tmp/fix4414.patch
          test "$(sha256sum /tmp/fix4414.patch | cut -d' ' -f1)" = "7d1be57e4cd1cc6b59c6e1c9771d00058058de67a01c513a6a0fd9524168f0c6"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4414.yml || true
          git rm -f .github/workflows/grokbuild-4413b.yml || true
          git rm -f .github/workflows/grokbuild-4413.yml || true
          T0="$(git write-tree)"
          test "$T0" = "894c8c05ce6f041c1a057516f9550abdb4c52d4f" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix4414.patch
          grep -q '__SN_4414' js/spacenet/app.js
          grep -q 'SET ASTRANOV PASSWORD' js/spacenet/auth.js
          grep -q 'Google or an Astranov account' js/spacenet/auth.js || grep -q 'Astranov account that is not Google' js/spacenet/auth.js
          grep -q 'id="sn-burger"' index.html
          grep -q 'var VER = "4414"' sw.js
          test "$(cat VERSION)" = "4414"
          grep -q 'sn:shortcuts' js/spacenet/app.js
          grep -q 'try { bindBurger(); }' js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "5444b367bab785b494d364ec712ca3cbdbb7644a" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main ($(git rev-parse --short $MAIN_TIP)) + 4414: lockstep stamps; keep main 4407 auth.js (Google/Astranov password) + datanet/servernet/yachts auth. Branch engine wins index/app/sw. Keep 4413b burger.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin grokbuild/4328-street-level-gps
          echo "TIP $C"
