name: grokbuild 4343 dot double click centres on the dot, cap outer box <= 42 % of the map, weather once per place per session, /VERSION text/plain (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4343.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit46; apply fix46 + stamp 4343; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved past 785011f6: merge it first (rebuild the kit)"; exit 1; }
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor 5ec3c6c6661ec99610bcf909604a0ac1eedb6323 HEAD
          git log --oneline -3
          grep -q 'var VER = "4342"' js/spacenet/app.js
          test -f .grokbuild/kit46.p00.b64
          test -f .grokbuild/kit46.p05.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit46.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "d31a503ff76aaeff9d06e2033b9151aec5aec873343546b48f5601fbb70d1845": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "d076f0048caf948dea679607f9a075e993413cb396386643e4fe19cbf840b6a6": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYKIT
          git apply --check .grokbuild/k/fix46.patch
          git apply .grokbuild/k/fix46.patch
          python3 .grokbuild/k/stamp4343.py
          grep -q 'app.js?v=4343' index.html
          grep -q 'auth.js?v=4343' index.html
          grep -q 'leaflet.js?v=4343' index.html
          grep -q 'name="astranov-build" content="4343"' index.html
          grep -q 'id="ver">V4343' index.html
          grep -q 'var VER = "4343"' js/spacenet/app.js
          test "$(grep -c '__SN_4343 = true' js/spacenet/app.js)" = "2"
          grep -q 'location.href = "/?v=4343&' js/spacenet/app.js
          grep -q 'var VER = "4343"' sw.js
          grep -q 'sn-shell-4343' sw.js
          grep -q 'TREE LOCK 4343' sw.js
          grep -q 'SpaceNet SW 4343' sw.js
          grep -q '4343-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4343"' vercel.json
          grep -qx '4343' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4343"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          grep -qF -- 'dotHit ? { lat: +brief.c.lat' js/spacenet/app.js
          grep -qF -- 'window.__snLastDbl' js/spacenet/app.js
          grep -qF -- 'function mapH()' js/spacenet/app.js
          grep -qF -- 'Math.floor(mapH() * 0.42) - below() - ABOVE' js/spacenet/app.js
          grep -qF -- 'Math.round(area() * 0.28)' js/spacenet/app.js
          grep -qF -- 'function wxFor(el, p)' js/spacenet/app.js
          grep -qF -- 'sessionStorage.getItem("sn:wx")' js/spacenet/app.js
          grep -qF -- 's2.back = Date.now()' js/spacenet/app.js
          grep -qF -- 'function briefAt' js/spacenet/app.js
          grep -qF -- 'function area()' js/spacenet/app.js
          grep -qF -- 'vendors on SpaceNet' js/spacenet/app.js
          grep -qF -- 'amenity|shop|healthcare' js/spacenet/app.js
          grep -qF -- 'listing needs LOGIN' js/spacenet/app.js
          grep -qF -- 'function gpsArrived' js/spacenet/app.js
          grep -qF -- '"source": "/VERSION"' vercel.json
          grep -qF -- '{"key": "Content-Type", "value": "text/plain; charset=utf-8"}' vercel.json
          grep -qF -- 'HEADED 4343 ALL PASS' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-crete' tests/headed_boot_gps_keys.js
          grep -qF -- 'weather: a reload in the same tab' tests/headed_boot_gps_keys.js
          grep -qF -- 'STAMP || "4343"' tests/headed_wheel_xdotool.js
          grep -qF -- 'process.env.STAMP || "4343"' tests/pw_hunt_replace.js
          if grep -qE 'v=4342|"4342"|sn-shell-4342|4342-real|V4342|__SN_4342|TREE LOCK 4342|SW 4342' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4342 stamp'; exit 1; fi
          if grep -qx '4342' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          node --check tests/headed_boot_gps_keys.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4343.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4343.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js
          git status --short | head -40
          git commit -q -m "4343: a double click on a drawn dot (Rhodes) centres the z10 island view on the dot's own coordinates, anywhere else on the exact pick (the surface pick under a dot was 0.1-0.4 deg off at globe scale); at the cap the outer box (grip strip + card + bottom strip / LIVE / dock) is at most 42 % of the map, rest 28 % of ribbon to dock; header weather at most once per 0.5 deg place per session (memory + sessionStorage, 30 min), back-off after a 429, silent on failure; /VERSION served text/plain; charset=utf-8 inline; tests updated (preview, do not merge)"
          # let the deploys of the kit commits finish first, so the preview alias ends on this commit
          sleep 75
          git push origin HEAD:grokbuild/4328-street-level-gps
