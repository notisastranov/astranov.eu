name: grokbuild 4365 (chat waits 45 s with a thinking state; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4365.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix67, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "d2f8c1c912db1079a2ea7943e00067f4a84c891e" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix67.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "87717e4bfff6f62aea8b9158a343df43f1e3c9896b12eb8afbfac0b6a9ddd0c1"
          gunzip -c /tmp/f.gz > /tmp/fix67.patch
          test "$(sha256sum /tmp/fix67.patch | cut -d' ' -f1)" = "ade1059050835820d1426f217391775db931b95433878dd51c972242a4da4a31"
          git rm -rq .grokbuild .github/workflows/grokbuild-4365.yml
          git apply --index /tmp/fix67.patch
          node --check js/spacenet/app.js
          grep -q '^4365$' VERSION
          T="$(git write-tree)"
          test "$T" = "f79b43b5704079a7308ed66f21663a16f16f7e0f" || { echo "tree $T"; exit 1; }
          git commit -q -m "4365: chat waits up to 45 s for /api/ai (~27 s today) with a visible thinking… N s state, renders the late answer if it is still the newest talk, honest timeout text after 45 s; talk never shows the empty-roster line; lockstep 4365"
          git push origin HEAD:grokbuild/4328-street-level-gps
