name: grokbuild 4437 (wheel lock holds n1 anchor across pauses; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4437.b64", ".github/workflows/grokbuild-4437.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4437
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4437.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "082b61a386bd4dd6888bdcc8993aed44aafd47c89f09e6a3b7cf6e8453ebf34b"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "304876"
          grep -q '__SN_4437' /tmp/f/js/spacenet/app.js
          grep -q 'WHEEL_LOCK_MAX_MS' /tmp/f/js/spacenet/app.js
          grep -q '__SN_LOCKMOVE4437' /tmp/f/js/spacenet/app.js
          grep -q 'content="4437"' /tmp/f/index.html
          grep -q 'sn-shell-4437' /tmp/f/sw.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4437.yml || true
          T0="$(git write-tree)"
          test "$T0" = "b29db6c127dd0655e0067fe11f93eb5693dfe1de" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "aef1fb10808ca894d8d9a8e214a4c22a7cbbbbc0" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4437: wheel lock keeps the n1 anchor for the whole gesture — idle no longer drops it (only a >12px cursor move, drag or explicit fly); globe holds the anchor under the cursor at every tier; map no-lock wheel uses the latlng under the cursor; lockstep 4437.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
