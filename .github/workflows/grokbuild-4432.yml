name: grokbuild 4432 (wheel lock + analytical zoom-about; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4432.b64", ".github/workflows/grokbuild-4432.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4432
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4432.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "72ccf28bbe3097bb1700086e2e0d71260d41709848ceb04a7e1baa21983645b9"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "288488"
          grep -q '__SN_4432' /tmp/f/js/spacenet/app.js
          grep -q 'analytical yaw/pitch' /tmp/f/js/spacenet/app.js
          grep -q 'wheelLock' /tmp/f/js/spacenet/app.js
          grep -q 'sn-shell-4432' /tmp/f/sw.js
          grep -q 'content="4432"' /tmp/f/index.html
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4432.yml || true
          T0="$(git write-tree)"
          test "$T0" = "97f72f2e828d92bb4677b4f4627c2744bbdd066e" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          git add js/spacenet/app.js js/spacenet/auth.js index.html sw.js vercel.json VERSION
          T="$(git write-tree)"
          test "$T" = "6e03fd41ef6f0a147fde278d12436abab04d4c55" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4432: lock wheel-anchor (no re-hit); analytical keepUnderCursor; Leaflet setZoomAround handoff; HUD=live center; lockstep 4432.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
