name: grokbuild 4306 apply (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4306-talk-city-pins"]
    paths: [".grokbuild/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4306-talk-city-pins
      - name: Apply patch, verify sha256, drop the kit, commit
        run: |
          set -e
          test -f .grokbuild/4306.patch
          python3 .grokbuild/find4306.py api/find.js
          git apply --recount --ignore-whitespace --whitespace=nowarn .grokbuild/4306.patch
          grep -v 'supabase/migrations' .grokbuild/4306.sha256 > /tmp/strict.sha256
          sha256sum -c /tmp/strict.sha256
          sha256sum -c .grokbuild/4306.sha256 || echo 'migration sha differs (checked separately)'
          for f in js/spacenet/app.js api/find.js api/ai.js sw.js api/version.js; do node --check "$f"; done
          git rm -q -r .grokbuild .github/workflows/grokbuild-4306.yml
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git add -A
          git commit -q -m "4306: Talk pins named cities without GPS + Overpass fallback + stamp align (preview, do not merge)"
          git push origin HEAD:grokbuild/4306-talk-city-pins
