name: grokbuild 4391 (ribbon SIGN IN for guests, pin label collision guard; stamps 4391; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4391.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix107, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "7f9d9b8ff3adfa302a32f3be1381184b98b80f7f" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix107.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "57469cf592d00f017671ac6a4ac7e676317ba71ae09b5f30d2ab861cdb548815"
          gunzip -c /tmp/f.gz > /tmp/fix107.patch
          test "$(sha256sum /tmp/fix107.patch | cut -d' ' -f1)" = "8cf9c01910951bba8ec4550ad98a59110ba79d7fa41445804874975aed770703"
          git rm -rq .grokbuild .github/workflows/grokbuild-4391.yml
          git apply --index /tmp/fix107.patch
          node --check js/spacenet/app.js
          grep -q '^4391$' VERSION
          T="$(git write-tree)"
          test "$T" = "35565b2b6cdbded9125461f52ea78b9058f0b49b" || { echo "tree $T"; exit 1; }
          git commit -q -m "4391: a signed-out visitor sees SIGN IN in the ribbon (opens the existing Google sign-in, no auto prompt); a pin label that still touches another marker is hidden (higher number yields, name stays in the tooltip). Lockstep 4391"
          git push origin HEAD:grokbuild/4328-street-level-gps
