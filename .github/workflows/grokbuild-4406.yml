name: grokbuild 4406 (fixes; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4406.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix124, assert trees, merge commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "a7a215af0054e8c5994f7ab7eb56e9d72146a390" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          base64 -d .grokbuild/fix124.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "086e54c7d9067be7192d4a5b12b13628a769a6d5753051f8b0c955db55858e67"
          gunzip -c /tmp/f.gz > /tmp/fix124.patch
          test "$(sha256sum /tmp/fix124.patch | cut -d' ' -f1)" = "a39e4205f0862c42934b643d2db64d0352d0da6396c2b3c99f56cbbea4bb2659"
          git rm -rq .grokbuild .github/workflows/grokbuild-4406.yml
          T0="$(git write-tree)"
          test "$T0" = "6fabd82d69aca5d3416f127c5244f81bcbeb7bf7" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix124.patch
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          grep -q '^4406$' VERSION
          T="$(git write-tree)"
          test "$T" = "415950e92813f3c2e969fd94a4af97b2e589e39a" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -m "4406: ribbon chips stacked with gaps (hunt chip under WALLET, wraps short of the globe); labels hidden on any pin bbox+2px, other leaders, or own leader across a name; zooming never re-hunts or empties a hunt (only a real 15 km drag or a new search); same query+place gives the same set per session (memo) and converges across sessions (24 h union). Lockstep 4406")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
