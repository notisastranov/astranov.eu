name: grokbuild 4431 (zoom-about-cursor + HUD/sheet/hold/menu/MIC; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4431.b64", ".github/workflows/grokbuild-4431.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4431
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4431.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "3de7d8293fac63e4ea69563ca849096b247179ed1f67fa06d7661867d297b6e5"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "281631"
          grep -q 'keepUnderCursor' /tmp/f/js/spacenet/app.js
          grep -q '__SN_4431' /tmp/f/js/spacenet/app.js
          grep -q 'sn-4431-layout' /tmp/f/index.html
          grep -q 'sn-shell-4431' /tmp/f/sw.js
          grep -q '4431-preview' /tmp/f/vercel.json
          ! grep -q 'Command the HUD' /tmp/f/index.html
          test "$(cat /tmp/f/VERSION)" = "4431"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4431.yml || true
          T0="$(git write-tree)"
          test "$T0" = "9a60089bebbdc91a5a18ec47b8a5dc6d3c4cddfe" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/index.html index.html
          cp /tmp/f/sw.js sw.js
          cp /tmp/f/vercel.json vercel.json
          cp /tmp/f/VERSION VERSION
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          cp /tmp/f/js/spacenet/auth.js js/spacenet/auth.js
          git add index.html sw.js vercel.json VERSION js/spacenet/app.js js/spacenet/auth.js
          T="$(git write-tree)"
          test "$T" = "e83430da436b26196d4563db09756f16dbfc6bdb" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4431: zoom-about-cursor (window wheel + keepUnderCursor; never fall back to screen center); HUD above drawer; LIST above START; hold 1500ms/14px; MIC+clip below ribbon; menu one-click; ?debug=1; lockstep 4431.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
