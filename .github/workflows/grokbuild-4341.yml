name: grokbuild 4341 grip grows from rest + map held, IP view in under 5 s, callouts off the ring and HUD, GPS prefix, guest menu copy, LIVE network count (branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4341.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit44; apply fix44 + tests44 + stamp 4341; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved past 785011f6: merge it first (rebuild the kit)"; exit 1; }
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor 834613797112a32bb52625d3f70e90679323a11e HEAD
          git log --oneline -3
          grep -q 'var VER = "4340"' js/spacenet/app.js
          grep -q 'IP_CITY_Z = 11' js/spacenet/app.js
          test -f .grokbuild/kit44.p00.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit44.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "b0a83bf3384bbdec2ac0ce376a6c983f1b21a6d3e4d60b0e390fcb8ce0484b79": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "faa6acdd611f126efb0c0c79a52b2b9647ed53b609304c33c11d99de6f3289f7": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYKIT
          python3 .grokbuild/k/fix44_client.py
          git apply --check .grokbuild/k/tests44.patch
          git apply .grokbuild/k/tests44.patch
          python3 .grokbuild/k/stamp4341.py
          grep -q 'app.js?v=4341' index.html
          grep -q 'auth.js?v=4341' index.html
          grep -q 'leaflet.js?v=4341' index.html
          grep -q 'name="astranov-build" content="4341"' index.html
          grep -q 'id="ver">V4341' index.html
          grep -q 'var VER = "4341"' js/spacenet/app.js
          test "$(grep -c '__SN_4341 = true' js/spacenet/app.js)" = "2"
          grep -q 'location.href = "/?v=4341&' js/spacenet/app.js
          grep -q 'var VER = "4341"' sw.js
          grep -q 'sn-shell-4341' sw.js
          grep -q 'TREE LOCK 4341' sw.js
          grep -q 'SpaceNet SW 4341' sw.js
          grep -q '4341-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4341"' vercel.json
          grep -qx '4341' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4341"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          grep -q 'var INTRO_MS = 4500, INTRO_MIN = 1500' js/spacenet/app.js
          grep -q 'function ipLookup()' js/spacenet/app.js
          grep -q 'ipFallback("timeout"); }, 2500)' js/spacenet/app.js
          grep -q 'pt.name && pt.name !== "GPS"' js/spacenet/app.js
          grep -q 'Tap one to see the menu' js/spacenet/app.js
          grep -q 'var RING = view.scale \* 1.12 + 4' js/spacenet/app.js
          grep -q 'function hudRects()' js/spacenet/app.js
          grep -q 'vendors = liveNet;' js/spacenet/app.js
          grep -q 'max-height:30vh!important;padding:0' js/spacenet/app.js
          grep -q '#sn-tasks .card{max-height:42vh!important}' js/spacenet/app.js
          grep -q 'function rest() { return Math.round(window.innerHeight \* 0.30); }' js/spacenet/app.js
          grep -q 'never refit under a grip drag' js/spacenet/app.js
          grep -q 'map.setView(d.c, d.z, { animate: false })' js/spacenet/app.js
          grep -q 'IP_CITY_Z = 11' js/spacenet/app.js
          grep -q 'function gpsArrived' js/spacenet/app.js
          grep -q 'var STRIP = 28, ABOVE = 24' js/spacenet/app.js
          grep -q 'var tq = ++talkSeq' js/spacenet/app.js
          grep -q 'function isTestFixture' js/spacenet/app.js
          grep -q 'type: "sn-sw"' sw.js
          if grep -q 'c.navigate(' sw.js; then echo 'sw still navigates clients'; exit 1; fi
          grep -q 'HEADED 4341 ALL PASS' tests/headed_boot_gps_keys.js
          grep -q 'm._loaded ? m.getCenter() : null' tests/headed_boot_gps_keys.js
          grep -q 'STAMP || "4341"' tests/headed_wheel_xdotool.js
          grep -q 'within 5 s' tests/pw_hunt_replace.js
          if grep -qE 'v=4340|"4340"|sn-shell-4340|4340-real|V4340|__SN_4340|TREE LOCK 4340|SW 4340' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4340 stamp'; exit 1; fi
          if grep -qx '4340' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          node --check tests/headed_boot_gps_keys.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4341.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4341.yml
          git add -u
          git add VERSION index.html vercel.json sw.js js/spacenet/app.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js
          git status --short | head -40
          git commit -q -m "4341: the sheet rests at 30vh and grows from rest to the 42vh cap with rubber-band resistance at both ends; the map is held under a grip drag (no refit, no invalidateSize, centre restored, 0 px); an IP-only boot lands on the IP city view in about 2 s (IP lookup in parallel with the GPS ask, zoom as soon as a location answers); NEWS/CALENDAR callouts clear the globe glow ring and the HUD at 1280x800 and 1920x1200; no 'GPS · GPS' status; a guest reads 'Tap one to see the menu'; unseated LIVE counts the real network only; tests: guarded state() in headed_boot_gps_keys, 0 px map checks, load-view callouts at two windows (preview, do not merge)"
          # let the deploys of the kit commits finish first, so the preview alias ends on this commit
          sleep 75
          git push origin HEAD:grokbuild/4328-street-level-gps
