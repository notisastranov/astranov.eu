name: grokbuild 4420b (form cards above drawer, no max-content scroll; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4420b.b64", ".github/workflows/grokbuild-4420b.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4420b as merge of main
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "7a66a1e5533f2eb0027fcaa559425a0ca6672e0b" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4420b.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "0dc44ad054f73837fd86f29d59da38b68a49a8d5b8e50fc5da73383958899e48"
          gunzip -c /tmp/f.gz > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | cut -d' ' -f1)" = "ccde9b845d99158c3f0ad5ffb7e95683bca0bf3554204c803d1df4a8dcb4f592"
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4420b.yml || true
          T0="$(git write-tree)"
          test "$T0" = "793b81f8de50fbf8c1c980cc4424aac08e889cc1" || { echo "tree0 $T0"; exit 1; }
          git apply --index /tmp/fix.patch
          grep -q 'fitFormSheet' js/spacenet/app.js
          test "$(cat VERSION)" = "4420"
          T="$(git write-tree)"
          test "$T" = "b016d914e84dca9d5181bad4ce116a09150ece88" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4420b: form/vendor cards fill margins above START; no max-content double scroll; fitFormSheet ≤42%.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
