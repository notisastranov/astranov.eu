name: grokbuild 4396 (collision pass frozen under a pointer; merge main 08348856; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4396.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix113, assert tree, commit, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "803da96dc3c11dcb693f1480513a5ac5d5de92ad" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e 083488561284b2bd67cf4a22b1bb5d5ba9280af6^{commit}
          base64 -d .grokbuild/fix113.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "a96a64bbc304bd499e0ac1ca98b41bb92299922dd741c78ba00e1641c6219cb1"
          gunzip -c /tmp/f.gz > /tmp/fix113.patch
          test "$(sha256sum /tmp/fix113.patch | cut -d' ' -f1)" = "ac1a13398ba686e4ce041266a57fbf6fa11c6d5c83c07a89e8c5f79bad0665f0"
          git rm -rq .grokbuild .github/workflows/grokbuild-4396.yml
          git apply --index /tmp/fix113.patch
          node --check js/spacenet/app.js
          grep -q '^4396$' VERSION
          T="$(git write-tree)"
          test "$T" = "0862d5ea3857fe98641f77dd9cd48e58dac6f3d3" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 083488561284b2bd67cf4a22b1bb5d5ba9280af6 -m "4396: merge main 08348856 (4387 device ledger / crew; branch engine and stamps win). The collision pass never moves a pin or label while a pointer is down on the map, while a mouse hovers a pin, or for 1.5 s after either ends: it is deferred and runs once afterwards. __snDeclBusy/__snDeclAt/__snDeclFrozen for tests. Lockstep 4396")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
