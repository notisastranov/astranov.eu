name: grokbuild 4426 (restore #g globe shell; merge main midnight; lockstep; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4426.b64", ".github/workflows/grokbuild-4426.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4426
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4426.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "e8a7a2c31c7b6096298e171e8cb678c2fe1bd22c71868435b0abd0b1cc5a0c4b"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "253362"
          test "$(wc -c < /tmp/f/index.html)" = "36725"
          test "$(cat /tmp/f/VERSION)" = "4426"
          grep -q 'id="g"' /tmp/f/index.html
          grep -q 'id="city"' /tmp/f/index.html
          grep -q 'id="in"' /tmp/f/index.html
          grep -q '__SN_4426' /tmp/f/js/spacenet/app.js
          grep -q '#g canvas missing' /tmp/f/js/spacenet/app.js
          grep -q '4426-preview' /tmp/f/vercel.json
          grep -q '/room/index.html' /tmp/f/vercel.json
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4426.yml || true
          T0="$(git write-tree)"
          test "$T0" = "1f531572bf13f4c1d872750d4ebf007ef7e1be0c" || { echo "tree0 $T0"; exit 1; }
          # Drop overlay junk main already deleted (tree lock)
          for f in \
            js/spacenet/_4251_probe.js js/spacenet/_sn4251_gz0.js js/spacenet/_sn4251_gz1.js js/spacenet/_sn4251_gz2.js js/spacenet/_sn4251_gz3.js \
            js/spacenet/gz4252-0.js js/spacenet/gz4252.js \
            js/spacenet/gz8-0.js js/spacenet/gz8-1.js js/spacenet/gz8-2.js js/spacenet/gz8-3.js js/spacenet/gz8-4.js js/spacenet/gz8-5.js js/spacenet/gz8-6.js js/spacenet/gz8-7.js \
            js/spacenet/stamp-4249-0.js js/spacenet/stamp-4249-1.js js/spacenet/stamp-4249-2.js js/spacenet/stamp-4249-orch.js \
            js/spacenet/stamp-4250-0a.js js/spacenet/stamp-4250-0b.js js/spacenet/stamp-4250-1.js js/spacenet/stamp-4250-orch.js \
            js/spacenet/portions.js; do
            git rm -f "$f" 2>/dev/null || true
          done
          mkdir -p js/spacenet lib/http
          for f in VERSION index.html sw.js vercel.json js/spacenet/app.js js/spacenet/auth.js lib/http/parcels.js; do
            cp "/tmp/f/$f" "$f"
            git add "$f"
          done
          T="$(git write-tree)"
          test "$T" = "1ea3df209974bd3a42eeb1e969e5b53ba64367b2" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4426: restore #g globe shell so midnight app.js boots (was silent return without canvas); honest boot error if #g missing; drop overlay probes; keep astranov.eu→/room rewrite (awaits Notis); lockstep 4426.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
