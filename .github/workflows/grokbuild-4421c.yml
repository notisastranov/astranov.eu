name: grokbuild 4421c (hold wins over pin; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4421c.b64", ".github/workflows/grokbuild-4421c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4421c
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f9466e672eb59d311befd8578f88f1a6fe73cbb6" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4421c.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "ee23f21988099c0f4c632213b6df86e7f6a1d4ce4400ccc4653dd7109da6e564"
          mkdir -p /tmp/f4421c && tar -xzf /tmp/f.tgz -C /tmp/f4421c
          test "$(wc -c < /tmp/f4421c/js/spacenet/app.js)" = "57534"
          grep -q 'hold menu wins over pin' /tmp/f4421c/js/spacenet/app.js
          grep -q 'HOLD_MS = 1500' /tmp/f4421c/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4421c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "30f8258a634fad3c2367da360c1a2f3c9438bb90" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f4421c/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "39622ba03ce20c8b504b954d5f40b961e5c8ae2b" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "4421c: hold LIST wins over shop pin click (land+sea 1.5s).")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
