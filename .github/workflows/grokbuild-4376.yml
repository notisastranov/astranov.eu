name: grokbuild 4376 (merge main 1f8876e1 V4370 menus fit the text; one-source hunt, server near/radius, town centre, kept input; stamps 4376; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4376.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix82, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "5dbf4732c6209577f11406a9844513adb0f35a47" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 1f8876e1952cfb440ef7b1c0f482f97855016987^{commit}
          base64 -d .grokbuild/fix82.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "159179ad23fe380d9232297b48ce9aa5cccbbfc997ec57aa5b3276fa8388ebe6"
          gunzip -c /tmp/f.gz > /tmp/fix82.patch
          test "$(sha256sum /tmp/fix82.patch | cut -d' ' -f1)" = "3c0b4a7ecc4f17379045d68141625385f3480300061a790cac3ddf7d0f3b0581"
          git rm -rq .grokbuild .github/workflows/grokbuild-4376.yml
          git apply --index /tmp/fix82.patch
          node --check js/spacenet/app.js
          grep -q '^4376$' VERSION
          T="$(git write-tree)"
          test "$T" = "bbcd73f0a570f691655480d32069aa5407c120be" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 1f8876e1952cfb440ef7b1c0f482f97855016987 -m "Merge main (1f8876e1: ab5159d V4370 menus fit the text) into the branch engine; a hunt takes its pins from one source (server hunt + real listings; browser races only when the server is empty; nearby Overpass rows never join); the server honours near=1 and radius (5 km, 10 under 3) and centres a city on its town node; the sent line stays in the box selected, double submits dropped; lockstep 4376")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
