name: grokbuild 4361 (merge main 1309d71a, stamps 4361; branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4361.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix63, assert tree, merge commit with main, drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          test "$(git rev-parse HEAD~1)" = "c8ec5bcb2c044ac66c1c1be0b7cb8863b54e1650" || { echo "unexpected parent"; git log --oneline -3; exit 1; }
          git fetch -q origin main
          git cat-file -e 1309d71a882b4bfdb225876cf0ecb729bf744339^{commit}
          base64 -d .grokbuild/fix63.b64 > /tmp/f.gz
          test "$(sha256sum /tmp/f.gz | cut -d' ' -f1)" = "17d10660b55619b897b4bee19ba4d7b8eb6f72b891c6bbc7ae74c8371b57541e"
          gunzip -c /tmp/f.gz > /tmp/fix63.patch
          test "$(sha256sum /tmp/fix63.patch | cut -d' ' -f1)" = "8abd41e4c6ab0d814bb9705ee0824eaec6e595583a2775f9a28b0d5a2b4756e2"
          git rm -rq .grokbuild .github/workflows/grokbuild-4361.yml
          git apply --index /tmp/fix63.patch
          node --check js/spacenet/app.js
          grep -q '^4361$' VERSION
          T="$(git write-tree)"
          test "$T" = "df5e48b26ac196c7c9b80ea7fdc365efec9ee657" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p 1309d71a882b4bfdb225876cf0ecb729bf744339 -m "Merge main (1309d71a, 4358-real restored index + stamps) into the preview: conflicts keep the branch app.js / sw / index / vercel / api path (tickNews stub, stepCam !holdOk guard, wheel dive, 10px handles); lockstep 4361")"
          git push origin "$C:refs/heads/grokbuild/4328-street-level-gps"
