name: grokbuild 4352 tile stress waits for every tile before judging pixels (test-only fix, branch only, self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/**", ".github/workflows/grokbuild-4352.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Check main; decode kit55; apply fix55 + stamp 4352; assert; drop kit
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch -q origin main
          MAIN=$(git rev-parse origin/main)
          echo "main tip $MAIN"
          test "$MAIN" = "785011f6c15d4e9bc8c3656b2a10ed89fb35c3d3" || { echo "main moved past 785011f6: merge it first (rebuild the kit)"; exit 1; }
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor 6358155688164b918a9d5e7191b86dd8aaca5b9c HEAD
          git log --oneline -3
          grep -q 'var VER = "4351"' js/spacenet/app.js
          test -f .grokbuild/kit55.p00.b64
          test -f .grokbuild/kit55.p01.b64
          python3 - <<'PYKIT'
          from pathlib import Path
          import hashlib, gzip, glob, tarfile, io, base64
          raw = base64.b64decode("".join(Path(p).read_text().strip() for p in sorted(glob.glob(".grokbuild/kit55.p*.b64"))), validate=True)
          g = hashlib.sha256(raw).hexdigest(); print("tgz", g, len(raw))
          if g != "4c1d279687865365ffd92a5ca94f95a3b1c79e95947bad50ea5a7dee4953ee13": raise SystemExit("tgz sha mismatch")
          body = gzip.decompress(raw); s = hashlib.sha256(body).hexdigest(); print("tar", s, len(body))
          if s != "4b76f39885b9bd766e373d8030a074e10abb5237e2506119394046d7c70d262b": raise SystemExit("tar sha mismatch")
          Path(".grokbuild/k").mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(body)) as t:
              for m in t.getmembers():
                  if m.name.startswith("/") or ".." in m.name: raise SystemExit("bad member " + m.name)
              t.extractall(".grokbuild/k")
          PYKIT
          git apply --check .grokbuild/k/fix55.patch
          git apply .grokbuild/k/fix55.patch
          python3 .grokbuild/k/stamp4352.py
          grep -q 'app.js?v=4352' index.html
          grep -q 'auth.js?v=4352' index.html
          grep -q 'leaflet.js?v=4352' index.html
          grep -q 'name="astranov-build" content="4352"' index.html
          grep -q 'id="ver">V4352' index.html
          grep -q 'var VER = "4352"' js/spacenet/app.js
          test "$(grep -c '__SN_4352 = true' js/spacenet/app.js)" = "2"
          grep -q 'location.href = "/?v=4352&' js/spacenet/app.js
          grep -q 'var VER = "4352"' sw.js
          grep -q 'sn-shell-4352' sw.js
          grep -q 'TREE LOCK 4352' sw.js
          grep -q 'SpaceNet SW 4352' sw.js
          grep -q '4352-real' vercel.json
          grep -q '"X-Astranov-Build", "value": "4352"' vercel.json
          grep -qx '4352' VERSION
          grep -q 'path.join(process.cwd(), "VERSION")' api/version.js
          node -e 'const h=require("./api/version.js");h({method:"GET"},{setHeader(){},status(c){return {json(j){if(c!==200||j.latest!=="4352"){console.error("version.js",c,j);process.exit(1)}console.log("api/version ->",j)},end(){}}}})'
          grep -qF -- 'function drawSiteLabels(list)' js/spacenet/app.js
          grep -qF -- 'drawSiteLabels(sitesDrawn)' js/spacenet/app.js
          grep -qF -- 'function dotAt(sx, sy)' js/spacenet/app.js
          grep -qF -- 'aim = snap ? { lat: snap.lat, lng: snap.lng }' js/spacenet/app.js
          grep -qF -- 'n: "ISTANBUL"' js/spacenet/app.js
          grep -qF -- 'window.__snLastDbl' js/spacenet/app.js
          grep -qF -- 'function mapH()' js/spacenet/app.js
          grep -qF -- 'Math.floor(mapH() * 0.42) - below() - ABOVE' js/spacenet/app.js
          grep -qF -- 'Math.round(area() * 0.28)' js/spacenet/app.js
          grep -qF -- 'function wxFor(el, p)' js/spacenet/app.js
          grep -qF -- 'localStorage.getItem("sn:wx")' js/spacenet/app.js
          grep -qF -- 'WX_SETTLE = 8000' js/spacenet/app.js
          grep -qF -- 'if (s.last && now - s.last < WX_TTL) return;' js/spacenet/app.js
          grep -qF -- 'if (seatKind !== "gps" && now - wxSeen.t < WX_SETTLE) return;' js/spacenet/app.js
          test "$(grep -c 'api.open-meteo.com' js/spacenet/app.js)" = "1"
          grep -qF -- 'var WX = { c: {}, back: 0, n: 0 };' api/ai.js
          grep -qF -- "'https://api.open-meteo.com/v1/forecast?latitude=' + rl + '&longitude=' + rg +" api/ai.js
          test "$(grep -c 'api.open-meteo.com' api/ai.js)" = "1"
          grep -qF -- 's2.back = Date.now()' js/spacenet/app.js
          grep -qF -- 'function briefAt' js/spacenet/app.js
          grep -qF -- 'function area()' js/spacenet/app.js
          grep -qF -- 'vendors on SpaceNet' js/spacenet/app.js
          grep -qF -- 'amenity|shop|healthcare' js/spacenet/app.js
          grep -qF -- 'listing needs LOGIN' js/spacenet/app.js
          grep -qF -- 'function gpsArrived' js/spacenet/app.js
          grep -qF -- '"source": "/VERSION"' vercel.json
          grep -qF -- '{"key": "Content-Type", "value": "text/plain; charset=utf-8"}' vercel.json
          grep -qF -- 'HEADED 4352 ALL PASS' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-crete' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-crete-guest' tests/headed_boot_gps_keys.js
          grep -qF -- 'dbl46-guest-crete-after' tests/headed_boot_gps_keys.js
          grep -qF -- 'for (const Z of [8, 10, 13])' tests/headed_boot_gps_keys.js
          grep -qF -- 'function mapDbl(lat, lng)' js/spacenet/app.js
          grep -qF -- 'map.on("dblclick", function (ev) {' js/spacenet/app.js
          grep -qF -- 'doubleClickZoom: false' js/spacenet/app.js
          grep -qF -- 'var nz = z0 < 10 ? 10 : Math.min(maxZ, z0 + 1);' js/spacenet/app.js
          grep -qF -- 'dz = Math.max(dz, Math.ceil(zEqG * 2) / 2);' js/spacenet/app.js
          grep -qF -- 'function ringAt(lat, lng)' js/spacenet/app.js
          grep -qF -- 'globeZoomEq: function ()' js/spacenet/app.js
          grep -qF -- 'function mapClickBlock(oe, down, now)' js/spacenet/app.js
          grep -qF -- 'var CLICK_DISMISS_MS = 280;' js/spacenet/app.js
          grep -qF -- 'var PIN_CARDS = ["vendor", "client", "driver", "brief"];' js/spacenet/app.js
          grep -qF -- 'map.on("click", function (ev) {' js/spacenet/app.js
          grep -qF -- 'if (clickT) { clearTimeout(clickT); clickT = 0; }' js/spacenet/app.js
          grep -qF -- 'sheetSeq++;' js/spacenet/app.js
          grep -qF -- 'clickDismissMs: CLICK_DISMISS_MS' js/spacenet/app.js
          grep -qF -- 'k47("guest-pixel-1050-300-closed")' tests/headed_boot_gps_keys.js
          grep -qF -- 'var DBL_MS = 650, DBL_PX = 16;' js/spacenet/app.js
          grep -qF -- 'function dblTap(x, y, now, lat, lng, src)' js/spacenet/app.js
          grep -qF -- 'if (Date.now() - dblDoneAt < 700) return; /* 4348' js/spacenet/app.js
          grep -qF -- 'dblTap(e.clientX, e.clientY, Date.now(), ll.lat, ll.lng, "grip")' js/spacenet/app.js
          grep -qF -- 'function stashCard()' js/spacenet/app.js
          grep -qF -- 'function cardBack(why)' js/spacenet/app.js
          grep -qF -- 'cardBack("x")' js/spacenet/app.js
          grep -qF -- 'stashCard();' js/spacenet/app.js
          grep -qF -- 'function pickSave(root, key)' js/spacenet/app.js
          grep -qF -- 'pickLoad($("sn-sheet-card"), vKey(s))' js/spacenet/app.js
          test "$(grep -c 'pickSpent(vKey(vendor));' js/spacenet/app.js)" = "2"
          grep -qF -- 'k48("agent-1000-250-slow-400ms-card")' tests/headed_boot_gps_keys.js || grep -qF -- 'dbl48("agent-1000-250-slow-400ms-card"' tests/headed_boot_gps_keys.js
          grep -qF -- 'slow400: "click --repeat 2 --delay 400 1"' tests/headed_boot_gps_keys.js
          grep -qF -- "LIST's red X puts PIZZAGIO back exactly" tests/headed_boot_gps_keys.js
          grep -qF -- 'card-edge-grip-strip-slow-400ms' tests/headed_boot_gps_keys.js
          grep -qF -- 'function takeCard()' js/spacenet/app.js
          grep -qF -- 'function restoreCard(b, why, quiet)' js/spacenet/app.js
          grep -qF -- 'restoreCard(db.b, "double", true)' js/spacenet/app.js
          grep -qF -- 'dblBack = { b: kb, t: now, seq: sheetSeq };' js/spacenet/app.js
          grep -qF -- 'window.__snAddrFill' js/spacenet/app.js
          grep -qF -- 'var addrEl = addrSpans[addrSpans.length - 1] || null;' js/spacenet/app.js
          grep -qF -- 'function fabs()' js/spacenet/app.js
          grep -qF -- 'window.__snGrip.fabs()' js/spacenet/app.js
          grep -qF -- 'no button of the open card is covered' tests/headed_boot_gps_keys.js
          grep -qF -- 'agent-1000-250-slow-500ms-card-picks' tests/headed_boot_gps_keys.js
          grep -qF -- 'a stashed card whose address lookup landed while LIST was over it comes back with the address' tests/headed_boot_gps_keys.js
          grep -qF -- 'the GPS and ME buttons go back to their places when the card closes' tests/headed_boot_gps_keys.js
          grep -qF -- 'function overpassVia(data, ctrl)' js/spacenet/app.js
          test "$(grep -c 'return overpassVia(data, ctrl).then(function (j) {' js/spacenet/app.js)" = "2"
          if grep -qF -- 'overpass-api.de/api/interpreter' js/spacenet/app.js; then echo 'the page still calls overpass-api.de itself'; exit 1; fi
          grep -qF -- 'if (String(n.op || "") === "overpass") {' api/find.js
          grep -qF -- 'function healTick()' js/spacenet/app.js
          grep -qF -- 'if (++tileSt.osmRun >= 8) {' js/spacenet/app.js
          grep -qF -- 'tileState: function ()' js/spacenet/app.js
          grep -qF -- 'TILE STRESS' tests/headed_tile_stress.js
          grep -qF -- 'var ALT_URL = "https://tile.openstreetmap.de/{z}/{x}/{y}.png";' js/spacenet/app.js
          grep -qF -- 't.src = "https://tile.openstreetmap.de/" + c.z' js/spacenet/app.js
          if grep -qF -- 'cartocdn' js/spacenet/app.js; then echo 'the map still falls back to CARTO (API KEY REQUIRED tiles)'; exit 1; fi
          grep -qF -- 'g1.top < 0.9' tests/headed_tile_stress.js
          grep -qF -- 'd.vis >= 6 && d.ok === d.vis && d.loading === 0' tests/headed_tile_stress.js
          grep -qF -- 'const h1f = await waitDom((d) => d.vis >= 8 && d.alt === d.vis && d.ok === d.vis && d.loading === 0, 12000)' tests/headed_tile_stress.js
          grep -qF -- 'const h2f = await waitDom((d) => d.vis >= 8 && d.ok === d.vis && d.loading === 0, 12000)' tests/headed_tile_stress.js
          grep -qF -- 'window.__snRevGate' tests/headed_boot_gps_keys.js
          grep -qF -- '4350: no request goes straight to an Overpass server' tests/pw_hunt_replace.js
          grep -qF -- 'a double click on empty map with a vendor card open KEEPS the card' tests/headed_boot_gps_keys.js
          grep -qF -- 'clicking another pin switches the card' tests/headed_boot_gps_keys.js
          if grep -qF -- 'if (t - lastTap < 320) closeCity();' js/spacenet/app.js; then echo 'map double tap still closes the map'; exit 1; fi
          grep -qF -- 'Network.requestWillBeSent' tests/headed_boot_gps_keys.js
          grep -qF -- 'Network.requestWillBeSent' tests/pw_hunt_replace.js
          grep -qF -- 'Athens point on the map container centre within 1.5 px' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-athens-label' tests/headed_boot_gps_keys.js
          grep -qF -- 'globe-dblclick-istanbul-dot' tests/headed_boot_gps_keys.js
          grep -qF -- 'D.realPx <= 20' tests/headed_boot_gps_keys.js
          grep -qF -- 'weather: a reload in the same tab' tests/headed_boot_gps_keys.js
          grep -qF -- 'STAMP || "4352"' tests/headed_wheel_xdotool.js
          grep -qF -- 'process.env.STAMP || "4352"' tests/pw_hunt_replace.js
          if grep -qE 'v=4351|"4351"|sn-shell-4351|4351-real|V4351|__SN_4351|TREE LOCK 4351|SW 4351' index.html sw.js api/version.js vercel.json js/spacenet/app.js js/spacenet/auth.js; then echo 'stale 4351 stamp'; exit 1; fi
          if grep -qx '4351' VERSION; then echo 'stale VERSION'; exit 1; fi
          python3 -c "import json;json.load(open('vercel.json'))"
          node --check js/spacenet/app.js
          node --check js/spacenet/auth.js
          node --check sw.js
          node --check api/version.js
          node --check api/ai.js
          node --check tests/headed_wheel_xdotool.js
          node --check tests/pw_hunt_replace.js
          node --check tests/headed_boot_gps_keys.js
          node --check api/find.js
          node --check tests/headed_tile_stress.js
          git rm -q -r --cached .grokbuild || true
          git rm -q .github/workflows/grokbuild-4352.yml || true
          rm -rf .grokbuild .github/workflows/grokbuild-4352.yml
          git add -u
          git add VERSION index.html vercel.json sw.js api/ai.js api/find.js js/spacenet/app.js tests/headed_wheel_xdotool.js tests/pw_hunt_replace.js tests/headed_boot_gps_keys.js tests/headed_tile_stress.js
          git status --short | head -40
          git commit -q -m "4352: the tile stress waits for every visible tile (and its fade-in) before judging the pixels after the layer switch (H1) and after the tile hosts come back (H2): the 4351 live run at 1920 grabbed with 1-5 of 45 tiles faded in; test-only, app unchanged apart from the lockstep stamp (preview, do not merge)"
          # let the deploys of the kit commits finish first, so the preview alias ends on this commit
          sleep 75
          git push origin HEAD:grokbuild/4328-street-level-gps
