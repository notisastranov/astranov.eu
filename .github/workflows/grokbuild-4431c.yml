name: grokbuild 4431c (menu open on pointerdown capture; self-deleting)
on:
  push:
    branches: ["grokbuild/4328-street-level-gps"]
    paths: [".grokbuild/fix4431c.b64", ".github/workflows/grokbuild-4431c.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grokbuild/4328-street-level-gps
          fetch-depth: 0
      - name: Apply fix4431c
        run: |
          set -euo pipefail
          git config user.name "Grok Bot"
          git config user.email "grok@astranov.eu"
          git fetch origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          test "$MAIN_TIP" = "f1f7bddd821dbbf034635637f9d5c02ac9665f09" || { echo "main moved: $MAIN_TIP"; exit 1; }
          base64 -d .grokbuild/fix4431c.b64 > /tmp/f.tgz
          test "$(sha256sum /tmp/f.tgz | cut -d' ' -f1)" = "c5c70ab7baecd479a045bdb41a15e7c67f07b14bc6ab937e76997a9ecd742e99"
          mkdir -p /tmp/f && tar -xzf /tmp/f.tgz -C /tmp/f
          test "$(wc -c < /tmp/f/js/spacenet/app.js)" = "282307"
          grep -q '4431c: open on pointerdown' /tmp/f/js/spacenet/app.js
          grep -q '__SN_4431c' /tmp/f/js/spacenet/app.js
          git rm -rq .grokbuild || true
          git rm -f .github/workflows/grokbuild-4431c.yml || true
          T0="$(git write-tree)"
          test "$T0" = "a07d84dc59e8c428c5a570aba30a8f9699e65033" || { echo "tree0 $T0"; exit 1; }
          mkdir -p js/spacenet
          cp /tmp/f/js/spacenet/app.js js/spacenet/app.js
          git add js/spacenet/app.js
          T="$(git write-tree)"
          test "$T" = "7e7c3a832b2b9a90697f51bcfd091a903ef04e30" || { echo "tree $T"; exit 1; }
          C="$(git commit-tree "$T" -p HEAD -p "$MAIN_TIP" -m "merge main (f1f7bddd) + 4431c: ☰ opens on pointerdown capture so click-outside cannot close the same gesture.")"
          git update-ref refs/heads/grokbuild/4328-street-level-gps "$C"
          git push origin HEAD:grokbuild/4328-street-level-gps
          echo "TIP $C"
