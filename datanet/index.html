<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DataNet</title>
<style>
html,body{margin:0;background:#02040a;color:#e8fbff;font:15px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 16px 72px}
h1{font:800 22px/1 system-ui;letter-spacing:.14em;margin:8px 0}
p.sub{color:#9fd4ea;margin:0 0 16px}
#gate{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.box{width:100%;max-width:380px;background:#041018;border:1px solid rgba(77,240,255,.55);border-radius:16px;padding:24px}
label{display:block;margin:12px 0 4px;font:700 11px/1 system-ui;letter-spacing:.08em;color:#7ee9ff;text-transform:uppercase}
input,button{height:40px;border-radius:10px;border:1px solid rgba(77,240,255,.55);background:#021018;color:#e8fbff;font:600 14px system-ui}
input{width:100%;padding:0 10px;box-sizing:border-box}
button{padding:0 14px;cursor:pointer;background:#0a2030}
button:hover{background:#123040}
.acts{display:flex;gap:8px;margin-top:16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:0;margin:8px 0 12px;border-bottom:1px solid rgba(77,240,255,.25)}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;border-radius:0;color:#9fd4ea;height:auto;padding:10px 16px;letter-spacing:.08em;text-transform:uppercase;font:700 12px/1 system-ui}
.tab.on{color:#7ee9ff;border-bottom-color:#4df0ff}
.sheet{width:100%;border-collapse:collapse;background:#041018;border:1px solid rgba(77,240,255,.2)}
.sheet th,.sheet td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(77,240,255,.15);vertical-align:middle}
.sheet th{background:#061820;color:#7ee9ff;font:700 11px/1 system-ui;letter-spacing:.06em;text-transform:uppercase}
.sheet tr.on td{background:rgba(77,240,255,.06)}
.sheet input{height:32px;border-color:transparent;background:transparent}
.sheet input:focus{border-color:rgba(77,240,255,.55);background:#021018;outline:none}
.x{height:28px;padding:0 8px}
.menu-h{margin:18px 0 8px;font:800 13px/1 system-ui;letter-spacing:.08em;color:#7ee9ff}
#app{display:none}
</style>
</head>
<body>
<div id="gate">
  <h1>DATANET</h1>
  <p class="sub">Shop menus live here. This is not the globe.</p>
  <form class="box" id="login">
    <button type="button" id="google" style="width:100%">GOOGLE</button>
    <label>Astranov email</label>
    <input id="who" type="email" autocomplete="username" placeholder="you@astranov.eu"/>
    <label>Astranov password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="password"/>
    <div class="acts"><button type="submit" style="flex:1">SIGN IN</button></div>
    <p id="login-msg" class="sub" style="min-height:1.2em"></p>
    <p class="sub">Google creates and verifies the id. No SMS and no confirmation mail. Then set the Astranov password. An existing password signs in here.</p>
  </form>
</div>
<main id="app">
  <div class="head">
    <div>
      <h1>DATANET <span id="ver" style="letter-spacing:.04em;color:#7ee9ff;font-size:13px">V4407</span></h1>
      <p class="sub" id="whoami"></p>
    </div>
    <button type="button" id="out">Sign out</button>
  </div>
  <div class="acts">
    <input id="newpass" type="password" placeholder="Set Astranov password" autocomplete="new-password" style="max-width:260px"/>
    <button type="button" id="setpass">SET PASSWORD</button>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" data-tab="vendor">Vendor</button>
    <button type="button" class="tab" data-tab="user">User</button>
    <button type="button" class="tab" data-tab="driver">Delivery driver</button>
  </div>
  <div id="sheet"></div>
</main>
<script src="/js/spacenet/auth.js?v=4407"></script>
<script>
var whoNow = null;
var KEY = "dn:ledger";
var amp = String.fromCharCode(38);
function esc(s) {
  return String(s == null ? "" : s).split(amp).join(amp + "amp;").split("<").join(amp + "lt;").split(">").join(amp + "gt;").split('"').join(amp + "quot;");
}
function blankVendor() {
  return { id: "v" + Date.now().toString(36), name: "", address: "", phone: "", status: "live", lat: 36.44305, lng: 28.2279, menu: [] };
}
function blankUser() {
  return { id: "u" + Date.now().toString(36), name: "", address: "", phone: "", role: "client", lat: 36.4492, lng: 28.2334 };
}
function blankDriver() {
  return { id: "d" + Date.now().toString(36), name: "", address: "", phone: "", free: "yes", fleet: "yes", lat: 36.4444, lng: 28.2292 };
}
function seedFrom(j) {
  var vendors = ((j && j.shops) || []).map(function (s) {
    return {
      id: s.id || ("v" + Date.now().toString(36)),
      name: s.name || "",
      address: s.address || "",
      phone: s.phone || "",
      status: s.status || "live",
      lat: s.lat,
      lng: s.lng,
      menu: (s.menu || []).map(function (m) {
        return { name: m.name || "", price: m.price || "", vol: m.vol || "", kg: m.kg == null ? "" : String(m.kg), temp: m.temp || "" };
      })
    };
  });
  var users = [];
  if (j && j.client) users.push({ id: j.client.id || "u1", name: j.client.name || "", address: j.client.address || "", phone: j.client.phone || "", role: j.client.role || "client", lat: j.client.lat, lng: j.client.lng });
  var drivers = [];
  if (j && j.driver) drivers.push({ id: j.driver.id || "d1", name: j.driver.name || "", address: j.driver.address || "", phone: j.driver.phone || "", free: j.driver.free ? "yes" : "no", fleet: j.driver.fleet ? "yes" : "no", lat: j.driver.lat, lng: j.driver.lng });
  if (!vendors.length) vendors.push(blankVendor());
  if (!users.length) users.push(blankUser());
  if (!drivers.length) drivers.push(blankDriver());
  return { vendors: vendors, users: users, drivers: drivers, pick: 0 };
}
function read() {
  try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; }
}
function write(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
var data = read();
var tab = "vendor";
var cols = {
  vendor: [["name","Name"],["address","Address"],["phone","Phone"],["status","Status"],["lat","Lat"],["lng","Lng"]],
  user: [["name","Name"],["address","Address"],["phone","Phone"],["role","Role"],["lat","Lat"],["lng","Lng"]],
  driver: [["name","Name"],["address","Base"],["phone","Phone"],["free","Free"],["fleet","Fleet"],["lat","Lat"],["lng","Lng"]]
};
var listKey = { vendor: "vendors", user: "users", driver: "drivers" };
function list() { return data[listKey[tab]]; }
function cell(i, k, val) {
  return "<input data-i='" + i + "' data-k='" + k + "' value=\"" + esc(val) + "\"/>";
}
function paint() {
  var box = document.getElementById("sheet");
  var rows = list();
  var c = cols[tab];
  var html = "<table class='sheet'><thead><tr>";
  c.forEach(function (col) { html += "<th>" + col[1] + "</th>"; });
  html += "<th></th></tr></thead><tbody>";
  rows.forEach(function (r, i) {
    html += "<tr data-pick='" + i + "'" + (tab === "vendor" && data.pick === i ? " class='on'" : "") + ">";
    c.forEach(function (col) { html += "<td>" + cell(i, col[0], r[col[0]] == null ? "" : r[col[0]]) + "</td>"; });
    html += "<td><button type='button' class='x' data-del='" + i + "'>DROP</button></td></tr>";
  });
  html += "</tbody></table><div class='acts'><button type='button' id='add'>+ Add " + (tab === "vendor" ? "vendor" : tab === "user" ? "user" : "driver") + "</button></div>";
  if (tab === "vendor") {
    var v = rows[data.pick] || rows[0];
    html += "<div class='menu-h'>MENU" + (v && v.name ? " · " + esc(v.name) : "") + "</div>";
    html += "<table class='sheet'><thead><tr><th>Item</th><th>Price</th><th>Volume</th><th>Kilos</th><th>Temp</th><th></th></tr></thead><tbody>";
    ((v && v.menu) || []).forEach(function (m, mi) {
      html += "<tr>";
      ["name","price","vol","kg","temp"].forEach(function (k) {
        html += "<td><input data-mi='" + mi + "' data-mk='" + k + "' value=\"" + esc(m[k]) + "\"/></td>";
      });
      html += "<td><button type='button' class='x' data-mdrop='" + mi + "'>DROP</button></td></tr>";
    });
    html += "</tbody></table><div class='acts'><button type='button' id='add-item'>+ Add item</button></div>";
  }
  box.innerHTML = html;
}
function bind() {
  var box = document.getElementById("sheet");
  box.onchange = function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var rows = list();
    if (t.getAttribute("data-i") != null) {
      rows[+t.getAttribute("data-i")][t.getAttribute("data-k")] = t.value;
      write(data);
      if (tab === "vendor" && t.getAttribute("data-k") === "name") paint();
    }
    if (t.getAttribute("data-mi") != null) {
      var v = rows[data.pick] || rows[0];
      if (!v) return;
      v.menu[+t.getAttribute("data-mi")][t.getAttribute("data-mk")] = t.value;
      write(data);
    }
  };
  box.onclick = function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var rows = list();
    if (t.getAttribute("data-del") != null) {
      var i = +t.getAttribute("data-del");
      rows.splice(i, 1);
      if (tab === "vendor" && data.pick >= rows.length) data.pick = Math.max(0, rows.length - 1);
      write(data);
      paint();
      return;
    }
    if (tab === "vendor" && t.tagName !== "INPUT" && t.tagName !== "BUTTON") {
      var tr = t.closest ? t.closest("[data-pick]") : null;
      if (tr) {
        data.pick = +tr.getAttribute("data-pick");
        write(data);
        paint();
      }
    }
    if (t.getAttribute("data-mdrop") != null) {
      var v = rows[data.pick] || rows[0];
      if (v) v.menu.splice(+t.getAttribute("data-mdrop"), 1);
      write(data);
      paint();
    }
    if (t.id === "add") {
      rows.push(tab === "vendor" ? blankVendor() : tab === "user" ? blankUser() : blankDriver());
      if (tab === "vendor") data.pick = rows.length - 1;
      write(data);
      paint();
    }
    if (t.id === "add-item") {
      var v2 = rows[data.pick] || rows[0];
      if (!v2) return;
      v2.menu = v2.menu || [];
      v2.menu.push({ name: "", price: "", vol: "", kg: "", temp: "" });
      write(data);
      paint();
    }
  };
}
function show(logged) {
  document.getElementById("gate").style.display = logged ? "none" : "flex";
  document.getElementById("app").style.display = logged ? "block" : "none";
  if (logged) {
    var who = (whoNow && (whoNow.email || whoNow.name)) || "";
    document.getElementById("whoami").textContent = who ? ("Signed in · " + who) : "Spreadsheet ledger";
    paint();
  }
}
function say(s) { var el = document.getElementById("login-msg"); if (el) el.textContent = s || ""; }
document.getElementById("google").onclick = function () {
  if (!window.SNAuth) { say("Account service did not load."); return; }
  SNAuth.google();
};
document.getElementById("login").onsubmit = function (e) {
  e.preventDefault();
  if (!window.SNAuth) { say("Account service did not load."); return; }
  say("Checking the account…");
  SNAuth.password(document.getElementById("who").value, document.getElementById("pw").value).then(function (res) {
    if (!res || !res.ok) { say((res && res.error) || "Sign-in refused."); return; }
    whoNow = res.user;
    say("");
    show(true);
  });
};
document.getElementById("setpass").onclick = function () {
  if (!window.SNAuth) return;
  SNAuth.setPassword(document.getElementById("newpass").value).then(function (res) {
    document.getElementById("whoami").textContent = (res && res.ok) ? "Astranov password set." : ((res && res.error) || "Password was not set.");
  });
};
document.getElementById("out").onclick = function () {
  if (window.SNAuth) SNAuth.out();
  whoNow = null;
  show(false);
};
document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    tab = b.getAttribute("data-tab");
    paint();
  };
});
bind();
function reveal() { show(!!(whoNow && whoNow.email)); }
if (window.SNAuth) SNAuth.session().then(function (u) { whoNow = u; if (data) reveal(); });
if (data) reveal();
else {
  fetch("/datanet/menus.json").then(function (r) { return r.json(); }).then(function (j) {
    data = seedFrom(j);
    write(data);
    reveal();
  }).catch(function () {
    data = seedFrom(null);
    write(data);
    reveal();
  });
}
</script>
</body>
</html>
