<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DataNet</title>
<style>
html,body{margin:0;background:#02040a;color:#e8fbff;font:16px/1.4 system-ui}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
h1{font:800 22px/1 system-ui;letter-spacing:.14em;margin:8px 0}
p{color:#9fd4ea}
a{color:#7ee9ff}
label{display:block;margin:8px 0 0;font:700 11px/1 system-ui;letter-spacing:.06em;color:#7ee9ff}
input,button,select{height:40px;border-radius:10px;border:1px solid rgba(77,240,255,.55);background:#041018;color:#e8fbff;font:600 14px system-ui}
input,select{width:100%;padding:0 10px;box-sizing:border-box}
button{padding:0 14px}
.row{display:grid;grid-template-columns:1.4fr .6fr .6fr .5fr .6fr auto;gap:6px;margin-top:8px}
.shop{border-top:1px solid rgba(77,240,255,.25);padding:12px 0}
.shop h2{margin:0;font:800 16px system-ui}
.acts{display:flex;gap:8px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>DATANET</h1>
<p>Shop menus live here. This is not the globe.</p>
<form id="shop">
<label>SHOP</label>
<input id="shop-name" placeholder="Shop name" required/>
<label>ADDRESS</label>
<input id="shop-address" placeholder="Street and number"/>
<div class="acts"><button type="submit">ADD SHOP</button></div>
</form>
<div id="shops"></div>
</main>
<script>
var KEY = "dn:shops";
var SEED = null;
function read() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { return []; }
}
function write(rows) {
  localStorage.setItem(KEY, JSON.stringify(rows));
  paint();
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&","<":"<",">":">","\"":"""}[c]; }); }
function paint() {
  var box = document.getElementById("shops");
  var rows = read();
  box.innerHTML = rows.map(function (s, si) {
    var menu = (s.menu || []).map(function (m, mi) {
      return "<p>" + esc(m.name) + " · " + esc(m.price) + " · " + esc(m.vol || "") + " · " + esc(m.kg || "") + " kg · " + esc(m.temp || "") +
        " <button type='button' data-drop='" + si + ":" + mi + "'>DROP</button></p>";
    }).join("") || "<p>No items yet.</p>";
    return "<section class='shop'><h2>" + esc(s.name) + "</h2><p>" + esc(s.address || "") + "</p>" + menu +
      "<div class='row'>" +
      "<input data-k='name' data-shop='" + si + "' placeholder='Item'/>" +
      "<input data-k='price' data-shop='" + si + "' placeholder='Price'/>" +
      "<input data-k='vol' data-shop='" + si + "' placeholder='Volume'/>" +
      "<input data-k='kg' data-shop='" + si + "' placeholder='Kilos'/>" +
      "<input data-k='temp' data-shop='" + si + "' placeholder='Temp'/>" +
      "<button type='button' data-add='" + si + "'>ADD</button></div></section>";
  }).join("");
}
function field(shop, key) {
  var el = document.querySelector("[data-shop='" + shop + "'][data-k='" + key + "']");
  return el ? el.value.trim() : "";
}
document.getElementById("shops").onclick = function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var rows = read();
  if (t.getAttribute("data-add") != null) {
    var i = Number(t.getAttribute("data-add"));
    var item = { name: field(i, "name"), price: field(i, "price"), vol: field(i, "vol"), kg: field(i, "kg"), temp: field(i, "temp") };
    if (!item.name) return;
    rows[i].menu = rows[i].menu || [];
    rows[i].menu.push(item);
    write(rows);
  }
  if (t.getAttribute("data-drop")) {
    var parts = t.getAttribute("data-drop").split(":");
    rows[Number(parts[0])].menu.splice(Number(parts[1]), 1);
    write(rows);
  }
};
document.getElementById("shop").onsubmit = function (e) {
  e.preventDefault();
  var rows = read();
  rows.unshift({
    id: "s" + Date.now().toString(36),
    name: document.getElementById("shop-name").value.trim(),
    address: document.getElementById("shop-address").value.trim(),
    lat: 36.44305,
    lng: 28.2279,
    status: "live",
    menu: []
  });
  document.getElementById("shop-name").value = "";
  document.getElementById("shop-address").value = "";
  write(rows);
};
fetch("/datanet/menus.json").then(function (r) { return r.json(); }).then(function (j) {
  SEED = j;
  if (!read().length && j && j.shops) write(j.shops);
  else paint();
}).catch(function () { paint(); });
</script>
</body>
</html>
