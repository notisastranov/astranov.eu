<script>
(function(){
  var VER="4204";
  var going=false;
  function go(v){ if(going) return; going=true; v=String(v||VER).replace(/[^\d]/g,"")||VER; location.replace("/boot?v="+v+"&t="+Date.now()+"&wipe=1"); }
  function nuclear(e){
    if(e){ if(e.target&&e.target.closest&&e.target.closest("#sn-money")) return; e.preventDefault(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }
    var line=document.getElementById("line"); if(line) line.textContent="Wiping caches · loading latest…";
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(err){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(err){}
    Promise.all(tasks).then(function(){
      return fetch("/VERSION?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
        var m=String(t||"").match(/(\d{4,})/); go(m?m[1]:VER);
      }).catch(function(){ go(VER); });
    }).catch(function(){ go(VER); });
    setTimeout(function(){ go(VER); }, 1800);
  }
  window.SNReboot=nuclear;
  var brand=document.getElementById("island");
  if(brand && !brand.__snNuke){ brand.__snNuke=true; brand.addEventListener("click", nuclear, true); }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__snDeferred=e; });
  try{
    if(navigator.serviceWorker){
      navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){});
      navigator.serviceWorker.addEventListener("message", function(ev){
        if(ev.data && ev.data.type==="SN_RELOAD") go(ev.data.v || VER);
      });
    }
  }catch(e){}
})();
</script>
