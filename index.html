<script>
(function(){
  var VER="4236";
  var going=false;
  function go(){ if(going) return; going=true; location.replace("/?v="+VER+"&t="+Date.now()); }
  function nuclear(e){
    if(e){ if(e.target&&e.target.closest&&e.target.closest("#sn-money")) return; e.preventDefault(); }
    var line=document.getElementById("line"); if(line) line.textContent="Wiping caches · loading 4236…";
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(err){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(err){}
    Promise.all(tasks).then(function(){ go(); }).catch(function(){ go(); });
    setTimeout(go, 1600);
  }
  window.SNReboot=nuclear;
  var brand=document.getElementById("island");
  if(brand){
    var hold=0;
    brand.addEventListener("pointerdown", function(){
      hold=setTimeout(function(){ hold=0; nuclear(); }, 1200);
    });
    brand.addEventListener("pointerup", function(){ if(hold){ clearTimeout(hold); hold=0; } });
    brand.addEventListener("pointercancel", function(){ if(hold){ clearTimeout(hold); hold=0; } });
  }
  try{ if(navigator.serviceWorker) navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){}); }catch(e){}
})();
</script>
