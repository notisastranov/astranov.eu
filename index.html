<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4447"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4447"/>
<style>
:root{
  --bg:#02040a; --fg:#e8fbff; --muted:#8ec8d8; --accent:#4df0ff;
  --safe-t:max(6px, env(safe-area-inset-top));
  --safe-b:max(6px, env(safe-area-inset-bottom));
  --safe-l:max(10px, env(safe-area-inset-left));
  --safe-r:max(10px, env(safe-area-inset-right));
  --drawer-h:70px;
  --sheet-h:0px;
  --top-row:36px;
  --search-h:34px;
  --ctrl:36px;
  --gap:8px;
  --radar:52px;
  --radar-gap:16px;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#city{position:fixed;inset:0;background:var(--bg);z-index:0}
#city{display:none;z-index:2}
#city.on{display:block}
#g{position:fixed;inset:0;width:100%;height:100%;background:#02040a;z-index:1;touch-action:none}
button,input{font-family:inherit}
button{cursor:pointer}

/* Top row: burger · ASTRANOV.EU · money — compact, restrained glow */
#top{
  position:fixed;z-index:50;top:0;left:0;right:0;
  height:calc(var(--safe-t) + var(--top-row));
  display:grid;grid-template-columns:var(--ctrl) minmax(36px,1fr) max-content minmax(30px,1fr) minmax(var(--ctrl),auto);align-items:center;gap:4px;
  padding:0 var(--safe-r) 2px var(--safe-l);pointer-events:none;box-sizing:border-box;
}
#top > *{pointer-events:auto}
#sn-burger{
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;font:700 18px/1 system-ui;
  box-shadow:0 0 6px rgba(77,240,255,.16);padding:0;
}
#sn-burger[aria-expanded="true"]{background:#1a3cff;color:#fff;border-color:#1a3cff}
#logo{
  justify-self:center;border:0;background:transparent;color:#4df0ff;
  font:800 13px/1 system-ui;letter-spacing:.16em;padding:6px 2px;white-space:nowrap;
  text-shadow:none;
}
#sn-money{
  min-width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;display:inline-flex;flex-direction:row;
  align-items:center;justify-content:center;padding:0 8px;gap:0;
  box-shadow:0 0 6px rgba(77,240,255,.16);white-space:nowrap;
  font:800 11px/1 system-ui;letter-spacing:.04em;text-shadow:none;
}
#sn-money .lbl{display:none!important}
#sn-money .tgt{font:inherit;letter-spacing:inherit;line-height:1;display:block}

/* Power under burger · Support under money — no overlap */
#sn-power{
  position:fixed;z-index:51;left:var(--safe-l);top:calc(var(--safe-t) + var(--top-row) + var(--gap));
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;padding:0;
  border:1px solid #ff3b3b;background:#c41414;color:#fff;font:800 18px/1 system-ui;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(255,60,60,.35);
}
#sn-power.on{
  border-color:#4df0ff;background:#1a3cff;color:#e8fbff;
  box-shadow:0 0 12px rgba(77,240,255,.55);animation:sn-pulse 1.4s ease-in-out infinite;
}
#sn-power.off{border-color:#ff3b3b;background:#c41414;color:#fff;box-shadow:0 0 8px rgba(255,60,60,.35);animation:none}
#sn-support{
  position:fixed;z-index:51;right:var(--safe-r);top:calc(var(--safe-t) + var(--top-row) + var(--gap));
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;padding:0;
  border:1px solid rgba(255,120,120,.75);background:rgba(22,4,6,.94);color:#ffb4b4;
  font:700 14px/1 system-ui;display:flex;align-items:center;justify-content:center;gap:0;
  box-shadow:0 0 6px rgba(255,80,80,.22);
}
#sn-support svg,#sn-power svg{width:22px;height:22px}
#sn-offer-pay,#sn-level{
  position:fixed;z-index:44;top:calc(var(--safe-t) + var(--top-row) + 6px);left:50%;
  transform:translateX(-50%);white-space:nowrap;pointer-events:none;color:#4df0ff;
  background:rgba(4,14,28,.94);border:1px solid rgba(77,240,255,.36);border-radius:10px;padding:4px 12px;
}
#sn-offer-pay{font:800 clamp(22px,6vw,46px)/1.1 system-ui;font-variant-numeric:tabular-nums}
#sn-level{font:700 12px system-ui}
#sn-offer-time{font-variant-numeric:tabular-nums;color:#7ee9ff}
.offer-actions{display:flex;gap:10px;margin:12px 0 0;align-items:stretch}
.offer-actions .decline,.offer-actions .accept{
  flex:1;height:44px;border-radius:10px;font:800 13px/1 system-ui;letter-spacing:.08em;border:1px solid;
}
.offer-actions .decline{background:rgba(120,10,10,.92);color:#ffb4b4;border-color:#ff3b3b}
.offer-actions .accept{background:#1a3cff;color:#e8fbff;border-color:#4df0ff;box-shadow:0 0 12px rgba(77,240,255,.4)}
.hop{margin:10px 0;padding:10px;border-radius:12px;border:1px solid rgba(126,233,255,.28);background:rgba(4,16,28,.9);text-align:left}
.hop b{display:block;font:800 12px system-ui;letter-spacing:.1em;color:#7ee9ff;margin:0 0 8px}
.hop .pair{display:flex;gap:8px}
.hop .pair button{flex:1;height:40px;border-radius:8px;border:1px solid rgba(126,233,255,.3);background:rgba(4,14,28,.95);color:#d7f6ff;font:800 11px system-ui}
.hop .pair button.on{background:#1a3cff;border-color:#4df0ff;color:#fff}
.hop.done{border-color:rgba(126,255,154,.45)}

/* Search + mic live in the drawer header — not top chrome */
#search{
  position:relative;z-index:1;flex:none;display:flex;gap:6px;min-width:0;
  margin:0;padding:0 10px 8px;box-sizing:border-box;width:100%;
  pointer-events:auto;touch-action:manipulation;
}
#q{
  flex:1;min-width:0;height:var(--search-h);border-radius:10px;border:1px solid rgba(77,240,255,.35);
  background:rgba(4,14,28,.92);color:var(--fg);padding:0 10px;font-size:14px;outline:none;
}
#mic{
  width:var(--search-h);height:var(--search-h);border-radius:10px;border:1px solid rgba(77,240,255,.35);
  background:rgba(4,14,28,.92);color:var(--accent);font-size:15px;flex:none;
}

/* Radar — under top row only; stays clear of money and drawer */
#sn-radar{
  position:relative;justify-self:center;
  width:30px;height:30px;border-radius:50%;pointer-events:none;overflow:hidden;
  border:1px solid rgba(77,240,255,.4);
  background:radial-gradient(circle,rgba(4,14,28,.78) 0 58%,transparent 59%);
  box-shadow:inset 0 0 10px rgba(77,240,255,.14);
}
#sn-radar-sweep{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle,transparent 46%,rgba(77,240,255,.16) 47% 48%,transparent 49%),
    conic-gradient(from 0deg,transparent 0 72%,rgba(77,240,255,.55) 100%);
  animation:sn-sweep 2.8s linear infinite;
}
#sn-radar.hot{border-color:rgba(126,255,154,.55)}
#sn-radar.hot #sn-radar-sweep{
  background:
    radial-gradient(circle,transparent 46%,rgba(126,255,154,.2) 47% 48%,transparent 49%),
    conic-gradient(from 0deg,transparent 0 72%,rgba(126,255,154,.6) 100%);
}
#sn-radar-blips{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1}
#sn-radar-blips i{
  position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;
  background:#4df0ff;box-shadow:0 0 5px #4df0ff;opacity:.85;
}
@keyframes sn-sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#sn-radar-sweep{animation:none}}

#menu{
  position:fixed;z-index:55;left:var(--safe-l);
  top:calc(var(--safe-t) + var(--top-row) + 6px);
  display:flex;flex-direction:column;gap:4px;width:min(220px, calc(100vw - 20px));
  padding:6px;border-radius:12px;background:rgba(4,14,28,.97);
  border:1px solid rgba(77,240,255,.28);box-shadow:0 8px 22px rgba(0,0,0,.4);
}
#menu[hidden]{display:none}
#menu button{
  display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;
  border-radius:8px;border:1px solid rgba(126,233,255,.22);background:rgba(4,16,28,.9);
  color:#e8fbff;font:700 11px/1 system-ui;letter-spacing:.05em;text-align:left;
}
#gps.armed{border-color:#fff;color:#041018;background:#4df0ff}
@keyframes sn-pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,240,255,.4)}50%{box-shadow:0 0 0 5px rgba(77,240,255,0)}}

#sn-me{
  position:fixed!important;z-index:52!important;
  left:var(--safe-l)!important;right:auto!important;top:auto!important;
  bottom:calc(var(--safe-b) + var(--drawer-h) + var(--gap))!important;
  width:var(--ctrl)!important;height:var(--ctrl)!important;padding:0!important;border-radius:999px!important;
  border:1px solid rgba(77,240,255,.7)!important;background:rgba(4,16,28,.94)!important;
  color:#4df0ff!important;display:flex!important;align-items:center;justify-content:center;
  box-shadow:0 0 6px rgba(77,240,255,.16);overflow:hidden;
}
#sn-me .ph,#sn-me img{width:var(--ctrl);height:var(--ctrl);object-fit:cover;display:flex;align-items:center;justify-content:center;font:800 12px system-ui;color:#4df0ff}
#gps{
  position:fixed!important;z-index:52!important;
  right:var(--safe-r)!important;left:auto!important;top:auto!important;
  bottom:calc(var(--safe-b) + var(--drawer-h) + var(--gap))!important;
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;font:800 9px/1 system-ui;letter-spacing:.06em;
  box-shadow:0 0 6px rgba(77,240,255,.16);padding:0;
}

/* Drawer: drag pill + search/mic header + scrollable sheet */
#drawer{
  position:fixed;z-index:45;left:0;right:0;bottom:0;
  height:var(--drawer-h);
  display:flex;flex-direction:column;
  background:rgba(4,14,28,.96);border-top:1px solid rgba(77,240,255,.28);
  box-shadow:0 -6px 18px rgba(0,0,0,.35);touch-action:pan-x;
}
.sn-exch,.sn-txns,.sn-now{margin:0 0 12px}
.sn-exch h3,.sn-txns h3{margin:8px 0 6px;font:800 11px system-ui;letter-spacing:.14em;color:#7ee9ff}
.sn-exch-row{display:flex;gap:8px;margin:0 0 6px;align-items:flex-start}
.sn-exch-row b{flex:none;width:36px;font:800 10px/1.4 system-ui;letter-spacing:.08em;color:#4df0ff}
.sn-exch-row.a b{color:#9ad7e8}
.sn-exch-row span{flex:1;font:500 13px/1.35 system-ui;color:#d7f6ff}
.sn-txn{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid rgba(77,240,255,.12)}
.sn-txn b{font:700 13px/1.3 system-ui;color:#e8fbff}
.sn-txn span{font:500 11px/1.3 ui-monospace,monospace;color:var(--muted)}
.lean-task{padding-top:4px}
#handle{
  flex:none;height:22px;min-height:22px;border:0;background:transparent;color:transparent;
  font-size:0;line-height:0;cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;user-select:none;padding:0;
}
#handle::before{
  content:"";width:36px;height:3px;border-radius:3px;background:rgba(126,176,255,.85);display:block;
  box-shadow:none;
}
#handle .lab{display:none!important}
#sheet{
  flex:1;min-height:0;overflow:auto;padding:0 10px calc(10px + var(--safe-b));
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior:contain;
}
/* No floating instruction/status banners */
#toast,#line{display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important}

/* Compat sheets used by app.js openSheet / jobs / support */
#sn-sheet,#sn-tasks{
  position:fixed;inset:0;z-index:70;display:none;pointer-events:none;background:transparent;
}
#sn-sheet.on,#sn-tasks.on{display:block;pointer-events:none}
#sn-sheet .card,#sn-tasks .card,#sn-sheet-card{
  pointer-events:auto;
  position:absolute;left:50%;top:max(72px, calc(var(--safe-t) + 64px));
  transform:translateX(-50%);width:min(420px,94vw);max-height:min(70vh, calc(100vh - 140px));
  overflow:auto;padding:12px;border-radius:16px;
  background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.45);
  box-shadow:0 16px 40px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;
}
#sn-support-sheet{
  position:fixed;z-index:72;display:none;width:min(360px,94vw);padding:12px;border-radius:16px;
  background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.45);
}
#sn-support-sheet.on{display:block}
.sheet-bar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sheet-ttl{flex:1;font:800 12px system-ui;letter-spacing:.14em;color:#7ee9ff}
.sheet-x,.sheet-go{
  min-height:34px;padding:6px 10px;border-radius:8px;border:1px solid rgba(126,233,255,.35);
  background:rgba(4,16,28,.9);color:#e8fbff;font:700 12px/1.25 system-ui;
}
.sheet-go{display:inline-flex;align-items:center;justify-content:center;max-width:100%;margin:4px 4px 0 0;text-align:center;text-decoration:none;box-sizing:border-box}
.sheet-actions{display:flex;flex-wrap:wrap;gap:6px}
.sheet-actions .sheet-go{margin:0}
.listing-options{margin-top:10px;color:#7ee9ff;font:600 12px system-ui}
.listing-options summary{cursor:pointer;padding:6px 0}
.sheet-go.primary{background:#4df0ff;color:#041018;border-color:#4df0ff}
.pill{
  display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:10px;border-radius:12px;
  border:1px solid rgba(126,233,255,.28);background:rgba(4,16,28,.9);color:#e8fbff;text-align:left;
}
.pill .ph{
  width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(77,240,255,.45);font:800 14px system-ui;color:#4df0ff;flex:none;
}
.pill b{display:block;font:800 14px/1.2 system-ui}
.pill span{display:block;font:500 12px/1.3 system-ui;color:var(--muted)}
.stage{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.stage b{font:800 10px system-ui;letter-spacing:.08em;color:#6a8ea0;padding:4px 6px;border-radius:6px;border:1px solid rgba(126,233,255,.2)}
.stage b.on{color:#041018;background:#4df0ff;border-color:#4df0ff}

.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row b{flex:1;font:700 15px/1.3 system-ui}
.row span{color:var(--muted);font:600 13px ui-monospace,monospace}
.plus,.go{height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:#d7f6ff;font:800 13px system-ui}
.plus{width:40px;padding:0;font-size:22px;color:#041018;background:#4df0ff;border-color:#4df0ff}
.go{display:block;width:100%;margin:8px 0 0}
.go.primary{background:#4df0ff;color:#041018;border-color:#4df0ff}
.go.bad{color:#ffb4b4;border-color:rgba(255,90,90,.7)}
.go.ok{color:#041018;background:#7dff9a;border-color:#7dff9a}
.price{
  margin:12px 0 6px;font:800 56px/1 system-ui;color:#4df0ff;letter-spacing:-.04em;text-align:center;
  text-shadow:0 0 10px #4df0ff,0 0 22px rgba(77,240,255,.95),0 0 42px rgba(26,60,255,.7),0 0 70px rgba(26,60,255,.4);
}
.price small{font-size:14px;margin-left:6px;letter-spacing:.1em;color:#b8f7ff;vertical-align:super;text-shadow:0 0 8px rgba(77,240,255,.8)}
.offer-card{padding:6px 0 14px;border-bottom:1px solid rgba(77,240,255,.14);margin:0 0 10px;text-align:center}
.offer-card h3{text-align:center;letter-spacing:.12em;color:#7ee9ff}
.offer-card .note{text-align:center;max-width:32em;margin-left:auto;margin-right:auto}
.break{margin:6px 0 0;color:#9ad7e8;font:600 13px/1.45 ui-monospace,monospace;white-space:pre-line}
.note{margin:8px 0;color:var(--muted);font:500 13px/1.4 system-ui}
h3{margin:4px 0 8px;font:800 13px system-ui;letter-spacing:.12em}
input.field,textarea.field,#sn-support-matter,#sn-add-eur{
  display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:10px;
  border:1px solid rgba(126,233,255,.35);background:#041018;color:#e8fbff;font:500 16px system-ui;
}
textarea.field,#sn-support-matter{min-height:88px}
.sn-route{animation:none!important}
.leaflet-control-zoom{margin-top:108px!important}
.pin{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#041018;border:2px solid #4df0ff;color:#e8fbff;font:800 12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pin.me{border-color:#fff;background:#1a3cff}
.pin.drop{border-color:#7dff9a}
.pin.drv{border-color:#ffb020}
#sn-topchrome-drag,#cli-drag{height:10px;min-height:10px;max-height:10px;width:100%;font-size:0;line-height:0;color:transparent;overflow:hidden;pointer-events:none;background:transparent;border:0;padding:0;margin:0;user-select:none}
.sn-radar-wrap{background:transparent!important;border:0!important;pointer-events:none!important}
.sn-radar{
  border-radius:999px;pointer-events:none;opacity:.55;
  background:conic-gradient(from 0deg,transparent 0 68%,rgba(77,240,255,.42) 86%,transparent 100%);
  animation:sn-radar-spin 4.2s linear infinite;box-shadow:inset 0 0 0 1px rgba(77,240,255,.35);
}
.sn-radar.hot{
  background:conic-gradient(from 0deg,transparent 0 68%,rgba(232,197,107,.42) 86%,transparent 100%);
  box-shadow:inset 0 0 0 1px rgba(232,197,107,.35);
}
@keyframes sn-radar-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sn-radar{animation:none}}
.actor-pin{
  box-sizing:border-box;display:grid;place-items:center;font:20px/1 system-ui;
  background:#071c2b;border:1px solid #4df0ff;border-radius:50%;box-shadow:0 1px 6px #02040a;
}
.actor-pin.test-pin{border-style:dashed}
.test-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid rgba(126,233,255,.24)}
.test-item img{border-radius:8px;object-fit:cover}
.test-item .note{margin:3px 0}
.test-form label{display:block;font:600 13px system-ui}
.test-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.test-times input{min-width:0}
#sn-resources{
  justify-self:center;width:clamp(36px,14vw,76px);height:30px;background:#04101c;
  border:1px solid rgba(77,240,255,.55);border-radius:7px;padding:3px;
}
#sn-resources canvas{display:block;width:100%;height:100%}
#sn-resources.alert{border-color:#ff5a7a;animation:resource-alert .8s alternate infinite}
@keyframes resource-alert{to{background:#621633;box-shadow:0 0 10px #ff5a7a}}
@media(prefers-reduced-motion:reduce){#sn-resources.alert{animation:none;background:#621633}}
#sn-resource-dialog{
  box-sizing:border-box;width:min(94vw,480px);padding:14px;border:1px solid #4df0ff;
  border-radius:14px;background:#040e1c;color:#e8fbff;
}
#sn-resource-dialog::backdrop{background:rgba(2,4,10,.55)}
#sn-resource-chart{display:block;width:100%;height:auto;background:#071c2b;border-radius:8px}
#sn-resource-readings{display:grid;grid-template-columns:1fr auto;gap:9px;font:12px system-ui}
#sn-resource-readings i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#sn-resource-readings dd{margin:0;text-align:right;color:#9ad7e8}

#sn-sound{
  position:fixed;z-index:51;left:var(--safe-l);top:calc(var(--safe-t) + var(--top-row) + 52px);
  width:var(--ctrl);height:var(--ctrl);display:grid;place-items:center;padding:0;
  border-radius:10px;border:1px solid rgba(77,240,255,.6);background:#04101c;color:#9ad7e8;
}
#sn-sound svg{width:20px;height:20px}
#sn-sound.on{color:#4df0ff;background:#11244a}
#sn-sound.on .sound-mute{display:none}
#sn-sound-dialog{
  box-sizing:border-box;width:min(92vw,360px);padding:14px;border:1px solid #4df0ff;
  border-radius:14px;background:#040e1c;color:#e8fbff;
}
#sn-sound-dialog::backdrop{background:rgba(2,4,10,.55)}
#sn-sound-dialog label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;font:600 13px system-ui}
#sn-sound-dialog input{accent-color:#4df0ff}
#sn-news{
  position:fixed;z-index:41;right:var(--safe-r);bottom:calc(var(--drawer-h) + 55px);
  width:min(250px,calc(100vw - 88px));max-height:max(34px,calc(100dvh - var(--drawer-h) - 130px));
  overflow:auto;border:1px solid rgba(77,240,255,.45);border-radius:10px;background:rgba(4,14,28,.96);
}
#sn-news summary{padding:7px 10px;color:#7ee9ff;cursor:pointer;font:700 12px system-ui}
#sn-news-preview iframe{width:100%;height:200px;border:0;display:block}
#sn-news-status{padding:0 8px;margin:5px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sn-news-actions{display:flex;gap:6px;padding:0 7px 6px}
#sn-news .sheet-go{min-height:28px}
#sn-news [hidden]{display:none}
.product-gallery{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.product-gallery button{
  flex:0 0 78px;display:grid;align-content:start;gap:4px;padding:4px;border-radius:8px;
  background:#04101c;color:#e8fbff;border:1px solid rgba(77,240,255,.38);font:600 11px/1.2 system-ui;
}
.product-gallery img{width:68px;height:48px;object-fit:cover;border-radius:5px}

</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city" aria-label="Street map"></div>
<div id="sn-topchrome-drag" class="sn-trivial-law" aria-hidden="true"></div>

<header id="top">
  <button type="button" id="sn-burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
  <button type="button" id="sn-resources" aria-label="Device resources" aria-haspopup="dialog"><canvas id="sn-spark" width="100" height="42" aria-hidden="true"></canvas></button>
  <button type="button" id="logo" aria-label="Force update Astranov.eu">ASTRANOV.EU</button>
  <div id="sn-radar" aria-hidden="true"><div id="sn-radar-sweep"></div><div id="sn-radar-blips"></div></div>
  <button type="button" id="sn-money" class="on" aria-label="Wallet"><span class="tgt">AV€</span></button>
</header>

<button type="button" id="sn-power" class="off" aria-label="Receive offers" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v9M7 5a8 8 0 1 0 10 0"/></svg>
</button>
<button type="button" id="sn-sound" aria-label="Sound settings" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><path class="sound-mute" d="M3 3l18 18"/></svg>
</button>
<dialog id="sn-sound-dialog" aria-labelledby="sn-sound-title">
  <div class="sheet-bar"><b id="sn-sound-title" class="sheet-ttl">Sound</b><form method="dialog"><button class="sheet-x">Close</button></form></div>
  <label>Enable sound<input name="enabled" type="checkbox"></label>
  <label>News<input name="news" type="range" min="0" max="100"></label>
  <label>Offers<input name="offers" type="range" min="0" max="100"></label>
  <label>Ambient<input name="ambient" type="range" min="0" max="100"></label>
  <label>AI helper<input name="helper" type="range" min="0" max="100"></label>
</dialog>
<aside id="sn-news" aria-label="Video news" hidden>
  <details id="sn-news-tile" open>
    <summary id="sn-news-label">World news</summary>
    <div id="sn-news-preview" hidden></div>
    <p id="sn-news-status" class="note">Finding recent clips…</p>
    <div id="sn-news-actions">
      <button id="sn-news-next" class="sheet-go" type="button" hidden>Next clip</button>
      <a id="sn-news-open" class="sheet-go" target="_blank" rel="noopener noreferrer" hidden>Open on YouTube</a>
    </div>
  </details>
</aside>
<button type="button" id="sn-support" aria-label="Support">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v5a5 5 0 0 1-5 5h-3"/><rect x="3" y="11" width="4" height="6" rx="1"/><rect x="17" y="11" width="4" height="6" rx="1"/></svg>
</button>
<div id="sn-offer-pay" hidden></div>
<div id="sn-level" hidden></div>

<dialog id="sn-resource-dialog" aria-labelledby="sn-resource-title">
  <div class="sheet-bar"><b id="sn-resource-title" class="sheet-ttl">Device resources</b><form method="dialog"><button class="sheet-x">Close</button></form></div>
  <canvas id="sn-resource-chart" width="600" height="200" aria-hidden="true"></canvas>
  <dl id="sn-resource-readings"></dl>
</dialog>

<nav id="menu" hidden>
  <button type="button" id="sn-support-menu">SUPPORT DESK</button>
  <button type="button" id="sn-view">Zoom in</button>
  <button type="button" id="sn-view-out">Zoom out</button>
  <button type="button" id="sn-compass">COMPASS</button>
  <button type="button" id="sn-portions">PORTIONS</button>
</nav>

<button type="button" id="sn-me" aria-label="Login"><span class="ph">IN</span></button>
<button type="button" id="gps" aria-label="GPS">GPS</button>

<div id="drawer" aria-label="Sheet">
  <div id="cli-drag" class="sn-trivial-law" aria-hidden="true"></div>
  <button type="button" id="handle" aria-label="Expand sheet" aria-controls="sheet" aria-expanded="false"></button>
  <form id="search" action="/" method="get">
    <input id="q" name="q" autocomplete="off" enterkeyhint="search" placeholder="Command the HUD · show, hide, or reshape"/>
    <button type="button" id="mic" aria-label="Handsfree mic">🎤</button>
  </form>
  <div id="sheet"></div>
</div>

<div id="sn-sheet"><div id="sn-sheet-card" class="card"></div></div>
<div id="sn-tasks"><div class="card"><div id="sn-tasks-list"></div></div></div>
<div id="sn-support-sheet"></div>
<div id="toast" role="status"></div>
<div id="line" role="status"></div>

<script src="/js/vendor/leaflet.js?v=4447"></script>
<script src="/js/spacenet/partners/types.js?v=4447"></script>
<script src="/js/spacenet/partners/client.js?v=4447"></script>
<script src="/js/spacenet/app.js?v=4447"></script>
<script src="/js/spacenet/auth.js?v=4447"></script>
</body>
</html>
