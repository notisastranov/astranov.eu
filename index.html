<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4424"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4424"/>
<style>
:root{
  --bg:#02040a; --fg:#e8fbff; --muted:#8ec8d8; --accent:#4df0ff;
  --safe-t:max(6px, env(safe-area-inset-top));
  --safe-b:max(6px, env(safe-area-inset-bottom));
  --safe-l:max(10px, env(safe-area-inset-left));
  --safe-r:max(10px, env(safe-area-inset-right));
  --drawer-h:28px;
  --sheet-h:0px;
  --top-row:36px;
  --search-h:34px;
  --ctrl:36px;
  --gap:8px;
  --radar:52px;
  --radar-gap:40px;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#map,#city{position:fixed;inset:0;background:var(--bg);z-index:0}
#city{display:none;z-index:2}
#city.on{display:block}
#g{position:fixed;inset:0;width:100%;height:100%;background:#02040a;z-index:1;touch-action:none}
button,input{font-family:inherit}
button{cursor:pointer}

/* Top row: burger · ASTRANOV.EU · money — compact, restrained glow */
#top{
  position:fixed;z-index:50;top:0;left:0;right:0;
  height:calc(var(--safe-t) + var(--top-row));
  display:grid;grid-template-columns:var(--ctrl) 1fr minmax(var(--ctrl),auto);align-items:flex-end;gap:6px;
  padding:0 var(--safe-r) 2px var(--safe-l);pointer-events:none;box-sizing:border-box;
}
#top > *{pointer-events:auto}
#sn-burger{
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;font:700 18px/1 system-ui;
  box-shadow:0 0 6px rgba(77,240,255,.16);padding:0;
}
#sn-burger[aria-expanded="true"]{background:#1a3cff;color:#fff;border-color:#1a3cff}
#logo{
  justify-self:center;border:0;background:transparent;color:#4df0ff;
  font:800 13px/1 system-ui;letter-spacing:.16em;padding:6px 2px;white-space:nowrap;
  text-shadow:none;
}
#sn-money{
  min-width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;display:inline-flex;flex-direction:row;
  align-items:center;justify-content:center;padding:0 8px;gap:0;
  box-shadow:0 0 6px rgba(77,240,255,.16);white-space:nowrap;
  font:800 11px/1 system-ui;letter-spacing:.04em;text-shadow:none;
}
#sn-money .lbl{display:none!important}
#sn-money .tgt{font:inherit;letter-spacing:inherit;line-height:1;display:block}

/* Search + mic under top row */
#search{
  position:fixed;z-index:48;top:calc(var(--safe-t) + var(--top-row) + var(--gap));
  left:var(--safe-l);right:var(--safe-r);display:flex;gap:6px;min-width:0;
}
#q{
  flex:1;min-width:0;height:var(--search-h);border-radius:10px;border:1px solid rgba(77,240,255,.35);
  background:rgba(4,14,28,.92);color:var(--fg);padding:0 10px;font-size:14px;outline:none;
}
#mic{
  width:var(--search-h);height:var(--search-h);border-radius:10px;border:1px solid rgba(77,240,255,.35);
  background:rgba(4,14,28,.92);color:var(--accent);font-size:15px;flex:none;
}

/* Radar — below search with hard clearance; never under money/search */
#sn-radar{
  position:fixed;z-index:46;
  top:calc(var(--safe-t) + var(--top-row) + var(--gap) + var(--search-h) + var(--radar-gap));
  right:var(--safe-r);
  width:var(--radar);height:var(--radar);border-radius:50%;pointer-events:none;overflow:hidden;
  border:1px solid rgba(77,240,255,.4);
  background:radial-gradient(circle,rgba(4,14,28,.78) 0 58%,transparent 59%);
  box-shadow:inset 0 0 10px rgba(77,240,255,.14);
}
#sn-radar-sweep{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle,transparent 46%,rgba(77,240,255,.16) 47% 48%,transparent 49%),
    conic-gradient(from 0deg,transparent 0 72%,rgba(77,240,255,.55) 100%);
  animation:sn-sweep 2.8s linear infinite;
}
#sn-radar.hot{border-color:rgba(126,255,154,.55)}
#sn-radar.hot #sn-radar-sweep{
  background:
    radial-gradient(circle,transparent 46%,rgba(126,255,154,.2) 47% 48%,transparent 49%),
    conic-gradient(from 0deg,transparent 0 72%,rgba(126,255,154,.6) 100%);
}
#sn-radar-blips{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1}
#sn-radar-blips i{
  position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;
  background:#4df0ff;box-shadow:0 0 5px #4df0ff;opacity:.85;
}
@keyframes sn-sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#sn-radar-sweep{animation:none}}

#menu{
  position:fixed;z-index:55;left:var(--safe-l);
  top:calc(var(--safe-t) + var(--top-row) + 6px);
  display:flex;flex-direction:column;gap:4px;width:min(220px, calc(100vw - 20px));
  padding:6px;border-radius:12px;background:rgba(4,14,28,.97);
  border:1px solid rgba(77,240,255,.28);box-shadow:0 8px 22px rgba(0,0,0,.4);
}
#menu[hidden]{display:none}
#menu button{
  display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;
  border-radius:8px;border:1px solid rgba(126,233,255,.22);background:rgba(4,16,28,.9);
  color:#e8fbff;font:700 11px/1 system-ui;letter-spacing:.05em;text-align:left;
}
#sn-power.on{color:#041018;background:#4df0ff;border-color:#4df0ff;animation:sn-pulse 1.4s ease-in-out infinite}
#sn-power.off{color:#fff;background:#c41414;border-color:#ff3b3b;box-shadow:none;animation:none}
#gps.armed{border-color:#fff;color:#041018;background:#4df0ff}
@keyframes sn-pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,240,255,.4)}50%{box-shadow:0 0 0 5px rgba(77,240,255,0)}}

#sn-me{
  position:fixed!important;z-index:52!important;
  left:var(--safe-l)!important;right:auto!important;top:auto!important;
  bottom:calc(var(--safe-b) + var(--drawer-h) + var(--gap))!important;
  width:var(--ctrl)!important;height:var(--ctrl)!important;padding:0!important;border-radius:999px!important;
  border:1px solid rgba(77,240,255,.7)!important;background:rgba(4,16,28,.94)!important;
  color:#4df0ff!important;display:flex!important;align-items:center;justify-content:center;
  box-shadow:0 0 6px rgba(77,240,255,.16);overflow:hidden;
}
#sn-me .ph,#sn-me img{width:var(--ctrl);height:var(--ctrl);object-fit:cover;display:flex;align-items:center;justify-content:center;font:800 12px system-ui;color:#4df0ff}
#gps{
  position:fixed!important;z-index:52!important;
  right:var(--safe-r)!important;left:auto!important;top:auto!important;
  bottom:calc(var(--safe-b) + var(--drawer-h) + var(--gap))!important;
  width:var(--ctrl);height:var(--ctrl);border-radius:10px;border:1px solid rgba(77,240,255,.7);
  background:rgba(4,16,28,.94);color:#4df0ff;font:800 9px/1 system-ui;letter-spacing:.06em;
  box-shadow:0 0 6px rgba(77,240,255,.16);padding:0;
}

/* Compact unlabeled drawer handle — pill only */
#drawer{
  position:fixed;z-index:45;left:0;right:0;bottom:0;
  height:var(--drawer-h);max-height:66.666vh;
  display:flex;flex-direction:column;
  background:rgba(4,14,28,.96);border-top:1px solid rgba(77,240,255,.28);
  box-shadow:0 -6px 18px rgba(0,0,0,.35);touch-action:none;
}
#handle{
  flex:none;height:28px;min-height:28px;border:0;background:transparent;color:transparent;
  font-size:0;line-height:0;cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;user-select:none;padding:0;
}
#handle::before{
  content:"";width:36px;height:3px;border-radius:3px;background:rgba(126,176,255,.85);display:block;
  box-shadow:none;
}
#handle .lab{display:none!important}
#sheet{
  flex:1;min-height:0;overflow:auto;padding:0 10px calc(10px + var(--safe-b));
  -webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
}
/* No floating instruction/status banners */
#toast,#line{display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important}

/* Compat sheets used by app.js openSheet / jobs / support */
#sn-sheet,#sn-tasks{
  position:fixed;inset:0;z-index:70;display:none;pointer-events:none;background:transparent;
}
#sn-sheet.on,#sn-tasks.on{display:block;pointer-events:none}
#sn-sheet .card,#sn-tasks .card,#sn-sheet-card{
  pointer-events:auto;
  position:absolute;left:50%;top:max(72px, calc(var(--safe-t) + 64px));
  transform:translateX(-50%);width:min(420px,94vw);max-height:min(70vh, calc(100vh - 140px));
  overflow:auto;padding:12px;border-radius:16px;
  background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.45);
  box-shadow:0 16px 40px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;
}
#sn-support-sheet{
  position:fixed;z-index:72;display:none;width:min(360px,94vw);padding:12px;border-radius:16px;
  background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.45);
}
#sn-support-sheet.on{display:block}
.sheet-bar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sheet-ttl{flex:1;font:800 12px system-ui;letter-spacing:.14em;color:#7ee9ff}
.sheet-x,.sheet-go{
  height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(126,233,255,.35);
  background:rgba(4,16,28,.9);color:#e8fbff;font:800 13px system-ui;
}
.sheet-go{display:block;width:100%;margin:8px 0 0;text-align:center;text-decoration:none;box-sizing:border-box;line-height:40px}
.sheet-go.primary{background:#4df0ff;color:#041018;border-color:#4df0ff}
.pill{
  display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:10px;border-radius:12px;
  border:1px solid rgba(126,233,255,.28);background:rgba(4,16,28,.9);color:#e8fbff;text-align:left;
}
.pill .ph{
  width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(77,240,255,.45);font:800 14px system-ui;color:#4df0ff;flex:none;
}
.pill b{display:block;font:800 14px/1.2 system-ui}
.pill span{display:block;font:500 12px/1.3 system-ui;color:var(--muted)}
.stage{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.stage b{font:800 10px system-ui;letter-spacing:.08em;color:#6a8ea0;padding:4px 6px;border-radius:6px;border:1px solid rgba(126,233,255,.2)}
.stage b.on{color:#041018;background:#4df0ff;border-color:#4df0ff}

.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row b{flex:1;font:700 15px/1.3 system-ui}
.row span{color:var(--muted);font:600 13px ui-monospace,monospace}
.plus,.go{height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:#d7f6ff;font:800 13px system-ui}
.plus{width:40px;padding:0;font-size:22px;color:#041018;background:#4df0ff;border-color:#4df0ff}
.go{display:block;width:100%;margin:8px 0 0}
.go.primary{background:#4df0ff;color:#041018;border-color:#4df0ff}
.go.bad{color:#ffb4b4;border-color:rgba(255,90,90,.7)}
.go.ok{color:#041018;background:#7dff9a;border-color:#7dff9a}
.price{
  margin:8px 0 4px;font:800 36px/1 system-ui;color:#4df0ff;letter-spacing:-.03em;text-align:center;
  text-shadow:0 0 10px rgba(77,240,255,.35);
}
.price small{font-size:16px;margin-left:6px;letter-spacing:.08em}
.offer-card{padding:4px 0 12px;border-bottom:1px solid rgba(77,240,255,.18);margin:0 0 10px}
.break{margin:6px 0 0;color:#9ad7e8;font:600 13px/1.45 ui-monospace,monospace;white-space:pre-line}
.note{margin:8px 0;color:var(--muted);font:500 13px/1.4 system-ui}
h3{margin:4px 0 8px;font:800 13px system-ui;letter-spacing:.12em}
input.field,textarea.field,#sn-support-matter,#sn-add-eur{
  display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:10px;
  border:1px solid rgba(126,233,255,.35);background:#041018;color:#e8fbff;font:500 16px system-ui;
}
textarea.field,#sn-support-matter{min-height:88px}
.sn-route{animation:none!important}
.leaflet-control-zoom{margin-top:108px!important}
.pin{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#041018;border:2px solid #4df0ff;color:#e8fbff;font:800 12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pin.me{border-color:#fff;background:#1a3cff}
.pin.drop{border-color:#7dff9a}
.pin.drv{border-color:#ffb020}
#sn-topchrome-drag,#cli-drag{height:10px;min-height:10px;max-height:10px;width:100%;font-size:0;line-height:0;color:transparent;overflow:hidden;pointer-events:none;background:transparent;border:0;padding:0;margin:0;user-select:none}
.sn-radar-wrap{background:transparent!important;border:0!important;pointer-events:none!important}
.sn-radar{
  border-radius:999px;pointer-events:none;opacity:.55;
  background:conic-gradient(from 0deg,transparent 0 68%,rgba(77,240,255,.42) 86%,transparent 100%);
  animation:sn-radar-spin 4.2s linear infinite;box-shadow:inset 0 0 0 1px rgba(77,240,255,.35);
}
.sn-radar.hot{
  background:conic-gradient(from 0deg,transparent 0 68%,rgba(232,197,107,.42) 86%,transparent 100%);
  box-shadow:inset 0 0 0 1px rgba(232,197,107,.35);
}
@keyframes sn-radar-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sn-radar{animation:none}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="map" aria-hidden="true"></div>
<div id="city" aria-label="Street map"></div>
<div id="sn-topchrome-drag" class="sn-trivial-law" aria-hidden="true"></div>

<header id="top">
  <button type="button" id="sn-burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
  <button type="button" id="logo" aria-label="Force update Astranov.eu">ASTRANOV.EU</button>
  <button type="button" id="sn-money" class="on" aria-label="Wallet"><span class="tgt">AV€</span></button>
</header>

<form id="search" action="/" method="get">
  <input id="q" name="q" autocomplete="off" enterkeyhint="search" placeholder="Talk to SpaceNet · hunt a place"/>
  <button type="button" id="mic" aria-label="Handsfree mic">🎤</button>
</form>

<div id="sn-radar" aria-hidden="true"><div id="sn-radar-sweep"></div><div id="sn-radar-blips"></div></div>

<nav id="menu" hidden>
  <button type="button" id="sn-power" class="on">POWER ON</button>
  <button type="button" id="sn-support" aria-label="Support">SUPPORT 🎧</button>
  <button type="button" id="sn-support-menu">SUPPORT DESK</button>
  <button type="button" id="sn-view">VIEW</button>
  <button type="button" id="sn-compass">COMPASS</button>
  <button type="button" id="sn-portions">PORTIONS</button>
</nav>

<button type="button" id="sn-me" aria-label="Login"><span class="ph">IN</span></button>
<button type="button" id="gps" aria-label="GPS">GPS</button>

<div id="drawer" aria-label="Sheet">
  <div id="cli-drag" class="sn-trivial-law" aria-hidden="true"></div>
  <button type="button" id="handle" aria-label="Expand sheet"></button>
  <div id="sheet"></div>
</div>

<div id="sn-sheet"><div id="sn-sheet-card" class="card"></div></div>
<div id="sn-tasks"><div class="card"><div id="sn-tasks-list"></div></div></div>
<div id="sn-support-sheet"></div>
<div id="toast" role="status"></div>
<div id="line" role="status"></div>

<script src="/js/vendor/leaflet.js?v=4424"></script>
<script src="/js/spacenet/app.js?v=4424"></script>
<script src="/js/spacenet/auth.js?v=4424"></script>
</body>
</html>
