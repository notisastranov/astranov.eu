html,body{margin:0;height:100%;background:#02040a;color:#d8f6ff;overflow:hidden;font-family:system-ui,sans-serif;--u:36px;--sn:#4df0ff}
button,[role=button]{cursor:pointer}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#city{position:fixed;inset:0;z-index:12;display:none;background:#02040a}
#city.on{display:block}
#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:max(8px,env(safe-area-inset-top));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));box-sizing:border-box}
#dock{bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom))}
#island,#panel{pointer-events:auto}
#island{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(4,14,28,.78);border:1px solid rgba(80,220,255,.35);border-radius:18px;box-shadow:0 0 22px rgba(40,200,255,.18)}
#island b{font:800 13px/1.15 system-ui;letter-spacing:.08em}
#island .a{color:#4df0ff;text-shadow:0 0 6px #4df0ff}
#island .s{color:#7ee9ff}
#ver{font:800 12px/1.15 system-ui;color:#4df0ff}
#heal{width:6px;height:6px;border-radius:99px;background:#4df0ff;box-shadow:0 0 10px #4df0ff}
#sn-money{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 44px);right:max(8px,env(safe-area-inset-right));z-index:40;display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:72px;padding:0 12px;border-radius:999px;border:1px solid rgba(126,233,255,.7);background:rgba(4,16,28,.94);color:#7ee9ff;font:800 13px/1 ui-monospace,system-ui;pointer-events:auto}
#panel{width:min(520px,100%);padding:8px 6px 4px;background:linear-gradient(180deg,transparent,rgba(2,8,18,.92))}
form#f{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid rgba(126,233,255,.4)}
input#in{flex:1;min-width:0;height:40px;border:0;background:0;color:#e8fbff;font:500 16px system-ui;outline:none}
.hub button{width:36px;height:36px;border:1px solid rgba(77,240,255,.6);border-radius:999px;background:rgba(4,12,24,.4);color:#4df0ff}
#line{margin:0 4px 8px;font:500 12px/1.5 ui-monospace,monospace;color:#7ee9ff;max-height:4.5rem;overflow:auto;white-space:pre-wrap}
#sn-me,#gps{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:45;width:var(--u);padding:0;border:0;background:transparent;color:#4df0ff}
#sn-me{left:max(10px,env(safe-area-inset-left));z-index:90}
#gps{right:max(10px,env(safe-area-inset-right));z-index:120}
#sn-me .lbl,#gps .lbl{display:block;font:800 8px/1 system-ui;letter-spacing:.16em;text-align:center;margin:0 0 4px}
#sn-me .tgt,#gps .tgt{display:flex;align-items:center;justify-content:center;width:var(--u);height:var(--u);margin:0 auto;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:radial-gradient(circle at 50% 50%,rgba(77,240,255,.22),rgba(2,10,18,.8) 70%);font-size:18px;line-height:1}
#sn-sheet,#sn-menu,#sn-tasks,#sn-cart,#sn-cash,#sn-video,#sn-layers,#sn-place,#sn-pick{display:none}
#sn-sheet.on,#sn-menu.on,#sn-tasks.on,#sn-cart.on,#sn-cash.on,#sn-layers.on,#sn-place.on,#sn-pick.on{display:block}
#sn-support,#sn-pill,#sn-cart-btn,#sn-layer,#sn-fix{display:none}
#sn-power{display:inline-flex!important;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 80px);right:max(8px,env(safe-area-inset-right));z-index:60;width:36px;height:36px;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid rgba(77,240,255,.9);background:rgba(4,16,28,.94);color:#4df0ff;font-size:22px;line-height:1}
#sn-tasks-btn{display:inline-flex!important;position:fixed!important;top:calc(max(8px,env(safe-area-inset-top)) + 52px);left:3.6rem;z-index:50;align-items:center;justify-content:center;height:32px;min-width:70px;padding:0 12px;border-radius:999px;border:1px solid rgba(80,220,255,.35);background:rgba(4,16,28,.94);color:#4df0ff;font:800 11px/1 system-ui;letter-spacing:.14em}

<body>
<canvas id="g"></canvas>

<div id="dock"><div id="panel"><div id="line"></div><form id="f"><div class="hub"><button type="button" id="plus">+</button></div><input id="in" autocomplete="off" enterkeyhint="send" placeholder="Talk to Astranov SpaceNet" /><div class="hub"><button type="button" id="go" aria-label="Voice">🎙</button></div></form></div></div>

<script>
(function(){
  var VER="4206";
  var going=false;
  function go(v){ if(going) return; going=true; v=String(v||VER).replace(/[^\d]/g,"")||VER; location.replace("/?v="+v+"&t="+Date.now()); }
  function nuclear(e){
    if(e){ if(e.target&&e.target.closest&&e.target.closest("#sn-money")) return; e.preventDefault(); }
    var line=document.getElementById("line"); if(line) line.textContent="Wiping caches · loading latest…";
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(err){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(err){}
    Promise.all(tasks).then(function(){ go(VER); }).catch(function(){ go(VER); });
    setTimeout(function(){ go(VER); }, 1600);
  }
  window.SNReboot=nuclear;
  var brand=document.getElementById("island");
  if(brand) brand.addEventListener("click", nuclear, true);
  try{ if(navigator.serviceWorker) navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){}); }catch(e){}
})();
</script>
