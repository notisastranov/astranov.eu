<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4422"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4422"/>
<style>
:root{
  --bg:#02040a; --fg:#e8fbff; --muted:#8ec8d8; --accent:#4df0ff;
  --safe-t:max(8px, env(safe-area-inset-top));
  --safe-b:max(8px, env(safe-area-inset-bottom));
  --drawer-h:10px;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
button,input{font-family:inherit}
button{cursor:pointer}

#top{position:fixed;z-index:40;top:0;left:0;right:0;height:calc(var(--safe-t) + 10px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px 6px;pointer-events:none}
#logo{pointer-events:auto;border:0;background:transparent;color:#4df0ff;font:800 18px/1 system-ui;letter-spacing:.22em;padding:8px 4px}
#sn-support{pointer-events:auto;width:44px;height:44px;border-radius:999px;border:1.5px solid rgba(255,90,90,.9);background:rgba(22,4,6,.96);color:#ffb4b4;font-size:20px;box-shadow:0 0 12px rgba(255,40,40,.35)}

#search{position:fixed;z-index:40;top:calc(var(--safe-t) + 52px);left:12px;right:12px;display:flex;gap:8px}
#q{flex:1;height:44px;border-radius:12px;border:1px solid rgba(77,240,255,.45);background:rgba(4,14,28,.94);color:var(--fg);padding:0 12px;font-size:16px;outline:none}
#mic{width:44px;height:44px;border-radius:12px;border:1px solid rgba(77,240,255,.45);background:rgba(4,14,28,.94);color:var(--accent);font-size:18px}

#sn-burger{position:fixed;z-index:45;left:12px;bottom:calc(var(--drawer-h) + var(--safe-b) + 12px);width:48px;height:48px;border-radius:14px;border:1.5px solid rgba(77,240,255,.85);background:rgba(4,16,28,.96);color:#4df0ff;font:800 22px/1 system-ui;box-shadow:0 0 12px rgba(77,240,255,.28)}
#menu{position:fixed;z-index:46;left:12px;bottom:calc(var(--drawer-h) + var(--safe-b) + 68px);display:flex;flex-direction:column;gap:6px;width:min(240px, calc(100vw - 24px));padding:8px;border-radius:16px;background:rgba(4,14,28,.97);border:1px solid rgba(77,240,255,.35);box-shadow:0 12px 32px rgba(0,0,0,.45)}
#menu[hidden]{display:none}
#menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(126,233,255,.28);background:rgba(4,16,28,.9);color:#e8fbff;font:800 13px/1 system-ui;letter-spacing:.06em;text-align:left}
#sn-power.on{color:#041018;background:#4df0ff;border-color:#4df0ff;animation:sn-pulse 1.4s ease-in-out infinite}
#sn-power.off{color:#fff;background:#c41414;border-color:#ff3b3b;box-shadow:none;animation:none}
#gps.armed{border-color:#fff;color:#041018;background:#4df0ff}
@keyframes sn-pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,240,255,.55)}50%{box-shadow:0 0 0 8px rgba(77,240,255,0)}}

#drawer{position:fixed;z-index:42;left:0;right:0;bottom:0;height:var(--drawer-h);max-height:72vh;display:flex;flex-direction:column;background:rgba(4,14,28,.97);border-top:1px solid rgba(77,240,255,.4);box-shadow:0 -10px 28px rgba(0,0,0,.4)}
#handle{flex:none;height:48px;border:0;background:transparent;color:#4df0ff;font:800 12px/1 system-ui;letter-spacing:.14em;cursor:grab;touch-action:none}
#sheet{flex:1;overflow:auto;padding:0 12px calc(12px + var(--safe-b));-webkit-overflow-scrolling:touch}
#toast{position:fixed;z-index:60;left:12px;right:12px;top:calc(var(--safe-t) + 108px);padding:10px 12px;border-radius:12px;background:rgba(4,14,28,.94);border:1px solid rgba(77,240,255,.35);color:#d7f6ff;font:600 14px/1.35 system-ui;display:none}
#toast.on{display:block}

.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row b{flex:1;font:700 15px/1.3 system-ui}
.row span{color:var(--muted);font:600 13px ui-monospace,monospace}
.plus,.go{height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:#d7f6ff;font:800 13px system-ui}
.plus{width:40px;padding:0;font-size:22px;color:#041018;background:#4df0ff;border-color:#4df0ff}
.go{display:block;width:100%;margin:8px 0 0}
.go.primary{background:#4df0ff;color:#041018;border-color:#4df0ff}
.go.bad{color:#ffb4b4;border-color:rgba(255,90,90,.7)}
.go.ok{color:#041018;background:#7dff9a;border-color:#7dff9a}
.price{margin:8px 0 0;font:800 40px/1 system-ui;color:#4df0ff;letter-spacing:-.04em}
.price small{font-size:16px;margin-left:6px}
.break{margin:6px 0 0;color:#9ad7e8;font:600 13px/1.45 ui-monospace,monospace;white-space:pre-line}
.note{margin:8px 0;color:var(--muted);font:500 13px/1.4 system-ui}
h3{margin:4px 0 8px;font:800 13px system-ui;letter-spacing:.12em}
input.field,textarea.field{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:10px;border:1px solid rgba(126,233,255,.35);background:#041018;color:#e8fbff;font:500 16px system-ui}
textarea.field{min-height:88px}
.sn-route{animation:none!important}
.leaflet-control-zoom{margin-top:108px!important}
.pin{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#041018;border:2px solid #4df0ff;color:#e8fbff;font:800 12px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pin.me{border-color:#fff;background:#1a3cff}
.pin.drop{border-color:#7dff9a}
.pin.drv{border-color:#ffb020}
#sn-topchrome-drag,#cli-drag{height:10px;min-height:10px;max-height:10px;width:100%;font-size:0;line-height:0;color:transparent;overflow:hidden;pointer-events:auto;background:transparent;border:0;padding:0;margin:0;cursor:grab;user-select:none}
#sn-topchrome-drag::before,#sn-topchrome-drag::after,#cli-drag::before,#cli-drag::after{content:none}
#handle{height:10px;min-height:10px;max-height:10px;font-size:0;color:transparent;overflow:hidden;border:0;background:transparent}

</style>
</head>
<body>
<div id="map"></div>
<div id="sn-topchrome-drag" class="sn-trivial-law" aria-hidden="true"></div>
<header id="top">
  <button type="button" id="logo" aria-label="Astranov">ASTRANOV</button>
  <button type="button" id="sn-support" aria-label="Support">🎧</button>
</header>
<form id="search">
  <input id="q" autocomplete="off" enterkeyhint="search" placeholder="Command the HUD · show, hide, or reshape"/>
  <button type="button" id="mic" aria-label="Speak a search">🎤</button>
</form>
<button type="button" id="sn-burger" aria-label="Menu" aria-expanded="false">☰</button>
<nav id="menu" hidden>
  <button type="button" id="sn-power" class="on">POWER ON</button>
  <button type="button" id="sn-me" aria-label="Login"><span class="ph">IN</span></button>
  <button type="button" id="sn-money">MONEY</button>
  <button type="button" id="sn-support-menu">SUPPORT</button>
  <button type="button" id="gps">GPS</button>
  <button type="button" id="sn-view">VIEW</button>
  <button type="button" id="sn-compass">COMPASS</button>
  <button type="button" id="sn-portions">PORTIONS</button>
</nav>
<div id="drawer">
  <div id="cli-drag" class="sn-trivial-law" aria-hidden="true"></div>
  <button type="button" id="handle">OFFERS</button>
  <div id="sheet"></div>
</div>
<div id="toast" role="status"></div>
<script src="/js/vendor/leaflet.js?v=4422"></script>
<script src="/js/spacenet/app.js?v=4422"></script>
<script src="/js/spacenet/auth.js?v=4422"></script>
</body>
</html>
