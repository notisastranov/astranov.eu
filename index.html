<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4258"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4127"/>
<script>
try { if (navigator.serviceWorker) navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) {}
</script>
<style>
html,body{margin:0;height:100%;background:#02040a;color:#d8f6ff;overflow:hidden;font-family:system-ui,sans-serif;--u:40px}
#g,#city{position:fixed;inset:0}#city{display:none;z-index:12;background:#02040a}#city.on{display:block}
#g{z-index:1;touch-action:none}#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:max(8px,env(safe-area-inset-top));flex-direction:column;align-items:center;gap:8px}
#dock{bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom))}
#island,#panel{pointer-events:auto}#island{padding:7px 12px;background:rgba(4,14,28,.78);border:1px solid rgba(80,220,255,.35);border-radius:18px}
#island .r1,#island .r2,.hud-row{display:flex;gap:6px;justify-content:center;align-items:center}
#ver,.a{color:#4df0ff;font:800 12px system-ui}#line{color:#7ee9ff;font:500 12px ui-monospace;margin:0 4px 8px}
#sn-me{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom)+78px);z-index:90;width:auto;border:0;background:transparent;color:#4df0ff;padding:0;pointer-events:auto}
#gps{position:fixed!important;right:max(10px,env(safe-area-inset-right))!important;bottom:calc(env(safe-area-inset-bottom)+78px)!important;top:auto!important;left:auto!important;z-index:240!important;width:auto!important;height:auto!important;min-width:48px;min-height:64px;border:0!important;background:transparent!important;color:#4df0ff!important;padding:0!important;pointer-events:auto!important}
#gps .lbl{display:block;font:800 8px/1 system-ui;letter-spacing:.16em;text-align:center;margin:0 0 4px}
#gps .tgt{display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0 auto;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:radial-gradient(circle at 50% 50%,rgba(77,240,255,.28),rgba(2,10,18,.92) 70%);font-size:20px;line-height:1;box-shadow:0 0 16px rgba(77,240,255,.45)}
#sn-sheet,#sn-tasks{display:none;position:fixed;inset:0;z-index:80}#sn-sheet.on,#sn-tasks.on{display:block}
#sn-sheet .card,#sn-tasks .card{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(420px,94vw);height:33vh;overflow:auto;padding:10px;background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.4);border-radius:16px}
#sn-money,#sn-power,#sn-count{display:none}.leaflet-container{background:#02040a}
form#f{display:flex;gap:10px;min-height:52px;border-bottom:1px solid rgba(126,233,255,.4)}
input#in{flex:1;border:0;background:0;color:#e8fbff;font:500 16px system-ui;outline:0}
.hub button,#sn-tasks-btn,#sn-find-btn,#sn-node-btn{border:1px solid rgba(77,240,255,.6);border-radius:999px;background:rgba(4,16,28,.94);color:#4df0ff;pointer-events:auto}
.hub button{width:48px;height:48px}#sn-tasks-btn,#sn-find-btn,#sn-node-btn{height:32px;padding:0 14px;font:800 11px system-ui}
#sn-topchrome-drag,#cli-drag{height:10px;min-height:10px;max-height:10px;width:100%;font-size:0;line-height:0;color:transparent;overflow:hidden;pointer-events:auto;background:transparent;border:0;padding:0;margin:0;cursor:grab;-webkit-user-select:none;user-select:none}
#sn-topchrome-drag::before,#sn-topchrome-drag::after,#cli-drag::before,#cli-drag::after{content:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city"></div>
<div id="top">
<div id="sn-topchrome-drag" class="sn-trivial-law" aria-hidden="true"></div>
<div id="island">
<div class="r1"><b class="a">ASTRANOV</b><b class="s">SPACENET</b><span id="ver">V4258</span></div>
<div class="r2"><span id="sn-local">-</span><span id="sn-utc">-</span><span id="sn-wx"></span><span id="sn-node">node 0</span><canvas id="sn-spark" width="64" height="20"></canvas></div></div>
<div class="hud-row"><button type="button" id="sn-tasks-btn">JOBS</button><button type="button" id="sn-find-btn">FIND</button><button type="button" id="sn-node-btn">NODE</button></div></div>
<button type="button" id="sn-money">AV</button>
<button type="button" id="sn-power" class="idle" aria-label="Go live" hidden></button>
<div id="sn-count" aria-hidden="true"></div>
<button type="button" id="sn-me" aria-label="You">YOU</button>
<button type="button" id="gps" aria-label="GPS recalibrate"><span class="lbl">GPS</span><span class="tgt">🎯</span></button>
<div id="sn-tasks"><div class="bg" data-act="hide"></div><div class="card"><div class="bar"><b class="ttl">JOBS</b><button type="button" class="x" data-act="hide">HIDE</button></div><div id="sn-tasks-list"></div></div></div>
<div id="sn-sheet"><div class="bg" data-act="close"></div><div class="card" id="sn-sheet-card"></div></div>
<div id="dock"><div id="panel"><div id="cli-drag" class="sn-trivial-law" aria-hidden="true"></div><div id="line"></div><form id="f"><div class="hub"><button type="button" id="plus">+</button></div><input id="in" autocomplete="off" enterkeyhint="send" placeholder="Command the HUD · show, hide, or reshape"/><div class="hub"><button type="button" id="go">GO</button></div></form></div></div>
<input id="sn-file" type="file" accept="image/*,application/pdf,text/*" hidden/>
<script src="/js/vendor/leaflet.js?v=4127"></script>
<script src="/js/spacenet/app.js?v=4258"></script>
<script src="/os-bootloader.js?v=4258"></script>
<script src="/js/spacenet/auth.js?v=4258"></script>
<script>
(function(){
  var btn=document.getElementById("gps");
  if(!btn||btn.__snGpsLock) return;
  btn.__snGpsLock=true;
  function say(s){ var el=document.getElementById("line"); if(el) el.textContent=s; }
  function fly(pt){
    window.__SN_HERE=pt;
    try {
      if (window.SN && SN.cam) {
        SN.cam.yaw = pt.lng * Math.PI / 180;
        SN.cam.pitch = Math.max(-1.15, Math.min(1.15, pt.lat * Math.PI / 180));
        SN.cam.dist = 1.12;
      }
    } catch (e) {}
    try {
      var map = window.SN && SN.getMap && SN.getMap();
      if (map && map.setView) map.setView([pt.lat, pt.lng], 16);
      else if (window.SN && typeof SN.openCity === "function") SN.openCity(pt);
    } catch (e2) {}
    say("GPS " + pt.lat.toFixed(4) + "," + pt.lng.toFixed(4) + " · tap to recalibrate");
  }
  function denied(){
    say("GPS denied. Long tap the globe to pin YOU. Tap GPS again to retry.");
  }
  btn.addEventListener("click", function(ev){
    ev.stopPropagation();
    if(!navigator.geolocation){ denied(); return; }
    say("Locating… tap GPS again to recalibrate.");
    navigator.geolocation.getCurrentPosition(
      function(pos){ fly({lat:pos.coords.latitude,lng:pos.coords.longitude}); },
      function(){
        navigator.geolocation.getCurrentPosition(
          function(p){ fly({lat:p.coords.latitude,lng:p.coords.longitude}); },
          denied,
          {enableHighAccuracy:false,timeout:12000,maximumAge:60000}
        );
      },
      {enableHighAccuracy:true,timeout:8000,maximumAge:0}
    );
  }, true);
})();
</script>
</body></html>
