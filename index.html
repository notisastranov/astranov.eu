<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4271"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4127"/>
<script>
try { if (navigator.serviceWorker) navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) {}
(function () {
  function kill(n) {
    var src = n && n.getAttribute && (n.getAttribute("src") || "");
    if (!src) return;
    if (/\/js\/spacenet\/(app|auth)\.js/.test(src)) return;
    if (/\/js\/vendor\//.test(src)) return;
    if (/\/js\/spacenet\//.test(src)) n.remove();
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.tagName === "SCRIPT") kill(n);
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<style>
:root{
  --bg:#02040a; --fg:#e8fbff; --muted:#7ee9ff; --accent:#4df0ff;
  --panel:rgba(4,14,28,.92); --line:rgba(80,220,255,.35);
  --safe-t:max(10px,env(safe-area-inset-top));
  --safe-l:max(8px,env(safe-area-inset-left));
  --safe-r:max(10px,env(safe-area-inset-right));
  --safe-b:max(12px,env(safe-area-inset-bottom));
  --dock:78px;
}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif}
canvas#g{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:block;z-index:1;touch-action:none}
button, [role="button"]{cursor:pointer}
#g,#city,#sn-fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#g{z-index:1;touch-action:none}
#sn-fx{z-index:2;pointer-events:none}
#city{display:none;z-index:12;background:var(--bg)}
#city.on{display:block}
#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:0;left:0;right:0;flex-direction:column;align-items:stretch;gap:0}
#dock{bottom:0;padding:0 10px var(--safe-b)}
#island,#panel{pointer-events:auto}
#island{padding:calc(var(--safe-t) + 6px) 12px 8px;background:var(--panel);border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;box-sizing:border-box}
#island .r1,#island .r2{display:flex;gap:8px;justify-content:center;align-items:center}
#island .r2{flex-wrap:wrap;font:600 10px/1 ui-monospace,monospace;color:var(--muted)}
#sn-spark{display:block;width:120px;height:28px;flex:none;cursor:pointer}
#ver,.a,.s{color:var(--accent);font:800 13px system-ui;letter-spacing:.12em}
.a,.s{background:none;border:0;padding:0;cursor:pointer}
#sn-under{display:flex;width:100%;box-sizing:border-box;align-items:flex-start;justify-content:space-between;pointer-events:none;padding:8px 10px 0;gap:8px;background:transparent}
#sn-under > *{pointer-events:auto}
#sn-support{width:40px;height:40px;padding:0;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:rgba(4,16,28,.96);color:var(--accent);font:20px/1 system-ui}
#line{color:var(--muted);font:500 12px ui-monospace,monospace;margin:0 4px 8px;min-height:16px}
#sn-news{display:none!important}
#sn-power{display:inline-flex!important;visibility:visible!important;position:static!important;z-index:240!important;width:48px;height:48px;align-items:center;justify-content:center;padding:0;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:rgba(4,16,28,.96);color:var(--accent);box-shadow:0 0 14px rgba(77,240,255,.4);pointer-events:auto;flex:none}
#sn-power.on{box-shadow:0 0 18px rgba(80,255,140,.7);border-color:#7dff9a;color:#7dff9a}
#sn-power[hidden]{display:inline-flex!important;visibility:visible!important}
#sn-power svg{width:22px;height:22px;display:block}
#sn-money{display:inline-flex!important;visibility:visible!important;position:static!important;z-index:240!important;width:auto;min-width:0;flex:0 0 auto;align-items:center;justify-content:center;border:0!important;background:transparent!important;color:var(--accent)!important;padding:0!important;pointer-events:auto!important}
#sn-money[hidden]{display:inline-flex!important;visibility:visible!important}
#sn-money .lbl{display:none}
#sn-money .tgt{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:0;height:40px;margin:0;padding:0 12px;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:radial-gradient(circle at 50% 40%,rgba(77,240,255,.22),rgba(2,10,18,.94) 72%);box-shadow:0 0 10px rgba(77,240,255,.35);font:800 13px/1 ui-monospace,system-ui;font-variant-numeric:tabular-nums;white-space:nowrap}
#sn-me{position:fixed!important;left:var(--safe-l)!important;bottom:calc(var(--safe-b) + var(--dock))!important;top:auto!important;right:auto!important;z-index:240!important;width:auto;border:0;background:transparent;color:var(--accent);padding:0;pointer-events:auto}
#gps{position:fixed!important;right:var(--safe-r)!important;bottom:calc(var(--safe-b) + var(--dock))!important;top:auto!important;left:auto!important;z-index:240!important;width:auto;min-width:48px;min-height:64px;border:0!important;background:transparent!important;color:var(--accent)!important;padding:0!important;pointer-events:auto!important}
#gps .lbl,#sn-me .lbl{display:block;font:800 8px/1 system-ui;letter-spacing:.16em;text-align:center;margin:0 0 4px}
#gps .tgt,#sn-me .tgt{display:flex;align-items:center;justify-content:center;margin:0 auto;border-radius:999px;border:1.5px solid rgba(77,240,255,.95);background:radial-gradient(circle at 50% 40%,rgba(77,240,255,.22),rgba(2,10,18,.94) 72%)}
#gps .tgt{width:48px;height:48px;box-shadow:0 0 16px rgba(77,240,255,.4)}
#sn-me .tgt{width:40px;height:40px;overflow:hidden}
#gps svg{width:22px;height:22px;display:block}
.hud-row{display:none!important;opacity:0;filter:blur(8px);transform:scale(.86) translateY(-10px);pointer-events:none;gap:8px;justify-content:center}
.hud-row.mat{display:flex!important;opacity:1;filter:none;transform:none;pointer-events:auto}
#sn-sheet,#sn-tasks{display:none;position:fixed;inset:0;z-index:80}
#sn-sheet.on,#sn-tasks.on{display:block}
#sn-sheet .bg,#sn-tasks .bg{position:absolute;inset:0}
#sn-sheet .card,#sn-tasks .card{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(420px,94vw);height:33vh;overflow:auto;padding:12px;background:rgba(4,14,28,.97);border:1px solid rgba(126,233,255,.4);border-radius:16px}
#sn-count{display:none}
.leaflet-container{background:var(--bg);filter:saturate(.35) brightness(.78) contrast(1.15)}
form#f{display:flex;gap:8px;align-items:center;min-height:52px;padding:6px 8px;border:1px solid rgba(126,233,255,.35);border-radius:16px;background:rgba(2,4,10,.96)}
input#in{flex:1;min-height:44px;border:1px solid rgba(77,240,255,.35);border-radius:12px;background:#02040a;color:#e8fbff;caret-color:#4df0ff;padding:0 12px;font:500 16px system-ui;outline:0}
.hub button,#sn-tasks-btn,#sn-find-btn,#sn-node-btn{border:1px solid rgba(77,240,255,.6);border-radius:999px;background:rgba(4,16,28,.94);color:var(--accent);pointer-events:auto}
.hub button{width:48px;height:48px}
#sn-tasks-btn,#sn-find-btn,#sn-node-btn{height:32px;padding:0 14px;font:800 11px system-ui}
#sn-topchrome-drag,#cli-drag{height:10px;min-height:10px;max-height:10px;width:100%;font-size:0;line-height:0;color:transparent;overflow:hidden;pointer-events:auto;background:transparent;border:0;padding:0;margin:0;cursor:grab;user-select:none}
#sn-topchrome-drag::before,#sn-topchrome-drag::after,#cli-drag::before,#cli-drag::after{content:none}
.sheet-go{display:block;width:100%;height:44px;margin:8px 0 0;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:var(--muted);border-radius:10px;font:800 13px system-ui}
.sheet-go.primary{color:#041018;background:#4df0ff;border-color:#4df0ff}
.sheet-bar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sheet-ttl{flex:1;font:800 11px system-ui;letter-spacing:.16em;color:var(--muted)}
.sheet-x{height:40px;padding:0 12px;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:var(--fg);border-radius:10px}
.pill{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:8px 10px;border:1px solid rgba(126,233,255,.28);background:rgba(4,16,28,.9);color:#e8fbff;border-radius:12px;text-align:left}
.pill .ph{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(77,240,255,.12);color:#4df0ff;font:800 13px system-ui;flex:none}
.pill b{display:block;font:700 13px system-ui}
.pill span{display:block;font:500 11px system-ui;color:#8ec8d8}
.stage{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stage b{font:800 10px system-ui;letter-spacing:.08em;padding:6px 8px;border-radius:999px;border:1px solid rgba(126,233,255,.3);color:#8ec8d8}
.stage b.on{color:#041018;background:#4df0ff;border-color:#4df0ff}
.note{margin:8px 0 0;font:500 12px/1.35 system-ui;color:#8ec8d8}
#sn-sheet input,#sn-sheet textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:10px;border:1px solid rgba(126,233,255,.35);background:rgba(4,16,28,.9);color:#e8fbff;border-radius:10px;font:500 15px system-ui}
#sn-sheet textarea{min-height:88px;resize:vertical}

#sn-support.on{border-color:#ff5a5a;box-shadow:0 0 16px rgba(255,60,60,.7);color:#ff8a8a}
body.sn-support #panel{box-shadow:0 0 22px rgba(255,40,40,.35)}
body.sn-support form#f{border-color:rgba(255,70,70,.75);box-shadow:0 0 18px rgba(255,50,50,.45);background:rgba(28,4,6,.96)}
body.sn-support input#in{border-color:rgba(255,90,90,.7);caret-color:#ff6b6b;background:#140406;color:#ffe8e8}
body.sn-support #line{color:#ff8a8a}
body.sn-support #go,body.sn-support #plus{border-color:#ff6b6b;color:#ff8a8a}
#sn-desk{display:none;margin:0 4px 6px;font:800 10px system-ui;letter-spacing:.18em;color:#ff8a8a}
body.sn-support #sn-desk{display:block}
#sn-node{display:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city"></div>
<div id="sn-news"></div>
<div id="top">
  <div id="sn-topchrome-drag" class="sn-trivial-law" aria-hidden="true"></div>
  <div id="island">
    <div class="r1"><button type="button" class="a" id="sn-brand-a">ASTRANOV</button><button type="button" class="s" id="sn-brand-s">SPACENET</button><span id="ver">V4271</span></div>
    <div class="r2"><span id="sn-local">-</span><span id="sn-utc">-</span><span id="sn-wx"></span><span id="sn-node"></span><canvas id="sn-spark" width="120" height="28"></canvas></div>
  </div>
  <div id="sn-under">
    <button type="button" id="sn-power" class="idle show" aria-label="Power">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 3v9"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M7.2 6.4a7 7 0 1 0 9.6 0"/></svg>
    </button>
    <button type="button" id="sn-money" class="on" aria-label="Wallet"><span class="lbl">AV€</span><span class="tgt">AV€</span></button>
    <button type="button" id="sn-support" aria-label="Support">🛟</button>
  </div>
  <div class="hud-row" id="sn-filters">
    <button type="button" id="sn-tasks-btn">JOBS</button>
    <button type="button" id="sn-find-btn">FIND</button>
    <button type="button" id="sn-node-btn">NODE</button>
  </div>
</div>
<div id="sn-count" aria-hidden="true"></div>
<button type="button" id="sn-me" class="out" aria-label="Login"><span class="lbl">LOGIN</span><span class="tgt"><span class="ph">IN</span></span></button>
<button type="button" id="gps" aria-label="GPS recalibrate" data-geo="getCurrentPosition">
  <span class="lbl">GPS</span>
  <span class="tgt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
</button>
<div id="sn-tasks"><div class="bg" data-act="hide"></div><div class="card"><div class="sheet-bar"><b class="sheet-ttl">JOBS</b><button type="button" class="sheet-x" data-act="hide">HIDE</button></div><div id="sn-tasks-list"></div></div></div>
<div id="sn-sheet"><div class="bg" data-act="close"></div><div class="card" id="sn-sheet-card"></div></div>
<div id="dock"><div id="panel"><div id="cli-drag" class="sn-trivial-law" aria-hidden="true"></div><div id="sn-desk">SUPPORT</div><div id="line"></div><form id="f"><div class="hub"><button type="button" id="plus">+</button></div><input id="in" autocomplete="off" enterkeyhint="send" placeholder="Talk to Astranov SpaceNet"/><div class="hub"><button type="button" id="go" aria-label="Talk or send">MIC</button></div></form></div></div>
<input id="sn-file" type="file" accept="image/*,application/pdf,text/*" hidden/>
<script src="/js/vendor/leaflet.js?v=4127"></script>
<script src="/js/spacenet/app.js?v=4271"></script>
<script src="/js/spacenet/auth.js?v=4271"></script>
</body></html>
