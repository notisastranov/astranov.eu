<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="4267"/>
<meta name="theme-color" content="#02040a"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4127"/>
<script>
try { if (navigator.serviceWorker) navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) {}
(function () {
  function kill(n) {
    var src = n && n.getAttribute && (n.getAttribute("src") || "");
    if (!src) return;
    if (/\/js\/spacenet\/(app|auth)\.js/.test(src)) return;
    if (/\/js\/vendor\//.test(src)) return;
    if (/\/js\/spacenet\//.test(src)) n.remove();
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.tagName === "SCRIPT") kill(n);
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</head><body></body></html>
