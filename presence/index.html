<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceNet Presence</title>
  <meta name="astranov-build" content="20260823201000-price" />
  <link rel="icon" href="https://astranov.eu/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:#05080f; color:#eaf2ff; font:400 14px/1.4 Inter,system-ui,sans-serif; overflow:hidden; }
    #sn-back { position:fixed; inset:0; width:100%; height:100%; border:0; z-index:0; background:#05080f; }
    .hud { position:fixed; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; }
    .top, .cards, .foot { pointer-events:auto; }
    .top { display:flex; align-items:center; gap:12px; padding:12px 14px; background:linear-gradient(180deg, rgba(5,8,15,.88), rgba(5,8,15,.15)); }
    .top img.pic { width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid rgba(180,220,255,.35); }
    .top h1 { margin:0; font:700 16px/1.15 "Space Grotesk",Inter,sans-serif; }
    .top .blurb { color:#9ec4ee; font-size:12px; max-width:520px; }
    .badge { margin-left:auto; height:32px; padding:0 12px; border-radius:999px; border:1px solid rgba(126,200,255,.4); background:rgba(8,18,32,.65); color:#d7e6f7; font:650 11px/32px Inter,system-ui; white-space:nowrap; }
    .cards { display:flex; gap:10px; overflow-x:auto; padding:0 12px 12px; }
    .card { flex:0 0 220px; border-radius:14px; overflow:hidden; border:1px solid rgba(180,220,255,.18); background:rgba(8,14,24,.78); cursor:pointer; backdrop-filter:blur(8px); }
    .card.on { border-color:#7ec8ff; box-shadow:0 0 18px rgba(80,200,255,.35); }
    .card img { width:100%; height:110px; object-fit:cover; display:block; }
    .card .p { padding:8px 10px 10px; }
    .card b { display:block; font:650 13px/1.2 Inter,system-ui; }
    .card span { display:block; color:#9ec4ee; font-size:11px; }
    .card em { display:block; color:#c5d6ea; font:400 11px/1.3 Inter,system-ui; font-style:normal; margin-top:4px; }
    .foot { margin-top:auto; padding:8px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; background:linear-gradient(0deg, rgba(5,8,15,.9), transparent); }
    .foot a, .foot button { height:36px; padding:0 12px; border-radius:999px; border:1px solid rgba(126,200,255,.35); background:rgba(12,22,38,.7); color:#e8f2ff; font:650 12px/1 Inter,system-ui; text-decoration:none; display:inline-flex; align-items:center; cursor:pointer; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <iframe id="sn-back" title="SpaceNet globe" allow="autoplay"></iframe>
  <div class="hud">
    <div class="top">
      <img class="pic" id="pic" alt="" />
      <div>
        <h1 id="name">SpaceNet Presence</h1>
        <div class="blurb" id="blurb">Client web presence on the globe.</div>
      </div>
      <span class="badge">€330 / year</span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="foot">
      <button type="button" id="planet">Whole planet</button>
      <span class="badge">SpaceNet Presence · €330 / year per subdomain</span>
      <a id="open-globe" href="https://astranov.eu/" target="_blank" rel="noopener">Open SpaceNet</a>
    </div>
  </div>
  <script src="app.js?v=20260823201000-price"></script>
</body>
</html>
